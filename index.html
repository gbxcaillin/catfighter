<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
//  CATFIGHTER — Tunable Constants
// ═══════════════════════════════════════════════════════════════════

const W = 960, H = 540;
const TIMESTEP = 1000 / 60;          // 16.67ms fixed step
const GRAVITY = 0.58;                // gravity per frame
const GROUND_Y = 430;                // ground plane Y coordinate
const STAGE_L = 50;                  // left wall
const STAGE_R = W - 50;             // right wall
const JUMP_VEL = -11.5;             // base jump velocity
const AIR_CTRL = 0.65;              // air movement multiplier
const GROUND_FRIC = 0.82;           // ground friction
const PUSH_APART = 2.5;             // push fighters apart when overlapping
const HIT_PAUSE = 5;                // frames frozen on light hit
const HEAVY_PAUSE = 9;              // frames frozen on heavy hit
const KO_PAUSE = 35;                // frames frozen on KO
const SHAKE_DECAY = 0.82;           // screen shake falloff
const MAX_SHAKE = 14;               // max shake pixels
const ROUND_TIME = 60;              // seconds per round
const WINS_NEEDED = 2;              // rounds to win match
const SPECIAL_MAX = 100;            // special meter capacity
const SPECIAL_GAIN_DEAL = 14;       // meter gain on dealing damage
const SPECIAL_GAIN_TAKE = 10;       // meter gain on receiving damage
const BLOCK_DMG = 0.15;             // damage multiplier when blocking
const BLOCK_KB = 0.25;              // knockback multiplier when blocking
const PARTICLE_CAP = 120;           // max particles on screen
const AI_BASE_REACT = 14;           // AI base reaction time (frames)
const AI_AGGRO = 0.55;              // AI aggression factor
const ART = 1.6;                    // fighter body scale (collision + canvas cats)

// ═══════════════════════════════════════════════════════════════════
//  Canvas & Globals
// ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
resize();
addEventListener('resize', resize);

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// ═══════════════════════════════════════════════════════════════════
//  Palette
// ═══════════════════════════════════════════════════════════════════

const P = {
  bg1: '#0a0a0e', bg2: '#141420', bg3: '#1a1a2a',
  floor: '#2a2228', floorLine: '#ff2e63', floorLine2: '#08d9d6',
  p1: '#ff2e63', p2: '#08d9d6',
  p1d: '#b01a42', p2d: '#06a8a6',
  gold: '#f5c518', white: '#eef0f4',
  hpBg: '#1c1c30', hpLost: '#661122',
  spark: '#ffffcc', blockSpark: '#88eeff',
  ko: '#ff0044', round: '#f5c518',
  concrete: '#3a3a40', rust: '#8b4513', fire: '#ff6600',
  paper: '#d8cbb0', cork: '#4a3828', ink: '#08060a',
};

const F_SPRAY = 'Impact, "Arial Black", "Franklin Gothic Medium", sans-serif';
const F_SCRATCH = '"Trebuchet MS", "Segoe UI", Verdana, sans-serif';
const F_MONO = 'monospace';

// ═══════════════════════════════════════════════════════════════════
//  Utility
// ═══════════════════════════════════════════════════════════════════

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }
function rndInt(lo, hi) { return Math.floor(rnd(lo, hi + 1)); }
function srand(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// ═══════════════════════════════════════════════════════════════════
//  Punk Text & Stencil Helpers
// ═══════════════════════════════════════════════════════════════════

// Spray-painted lettering: jittered letters, thick stencil outline, drips, overspray
function sprayText(text, x, y, size, color, o = {}) {
  const rng = srand(o.seed || (text.length * 131 + size));
  ctx.save();
  ctx.font = `${size}px ${F_SPRAY}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  const spacing = o.spacing == null ? size * 0.04 : o.spacing;
  const widths = [...text].map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + (text.length - 1) * spacing;
  let cx = o.align === 'left' ? x : o.align === 'right' ? x - total : x - total / 2;
  const jit = o.jitter || 0;
  if (o.rotate) { ctx.translate(x, y); ctx.rotate(o.rotate); ctx.translate(-x, -y); }
  if (o.speckle !== false) {
    ctx.fillStyle = color;
    for (let i = 0; i < text.length * 5; i++) {
      ctx.globalAlpha = 0.15 + rng() * 0.3;
      const sx = cx + rng() * total + (rng() - 0.5) * size * 0.6;
      const sy = y - size * 0.8 + rng() * size * 1.2;
      ctx.beginPath(); ctx.arc(sx, sy, rng() * size * 0.03 + 0.5, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], w = widths[i];
    if (ch === ' ') { cx += w + spacing; continue; }
    const rot = (rng() - 0.5) * 0.14, sc = 0.9 + rng() * 0.2, dy = (rng() - 0.5) * size * 0.1;
    const jx = jit ? (Math.random() - 0.5) * jit : 0, jy = jit ? (Math.random() - 0.5) * jit : 0;
    ctx.save();
    ctx.translate(cx + w / 2 + jx, y + dy + jy);
    ctx.rotate(rot); ctx.scale(sc, sc);
    if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(ch, -w / 2 + size * 0.06, size * 0.06); }
    if (o.outline !== false) {
      ctx.lineWidth = size * 0.09; ctx.strokeStyle = o.outline || P.ink;
      ctx.strokeText(ch, -w / 2, 0);
    }
    if (o.glow) { ctx.shadowColor = o.glowColor || color; ctx.shadowBlur = o.glow; }
    ctx.fillStyle = color;
    ctx.fillText(ch, -w / 2, 0);
    ctx.shadowBlur = 0;
    if (o.drips !== false && rng() < 0.5) {
      const dx = -w / 2 + size * 0.1 + rng() * (w - size * 0.2), len = size * (0.12 + rng() * 0.4), th = size * 0.035;
      ctx.fillRect(dx - th / 2, -size * 0.05, th, len);
      ctx.beginPath(); ctx.arc(dx, len - size * 0.05, th * 0.9, 0, 7); ctx.fill();
    }
    ctx.restore();
    cx += w + spacing;
  }
  ctx.restore();
}

// Knife-scratched / marker lettering
function scratchText(text, x, y, size, color, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 'bold'} ${size}px ${F_SCRATCH}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'alphabetic';
  if (o.rotate) { ctx.translate(x, y); ctx.rotate(o.rotate); ctx.translate(-x, -y); }
  ctx.transform(1, 0, o.skew == null ? -0.18 : o.skew, 1, 0, 0);
  const sx = x + y * (o.skew == null ? 0.18 : -o.skew);
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.45;
  ctx.fillText(text, sx + 1, y + 1);
  ctx.fillText(text, sx - 1, y);
  ctx.globalAlpha = 1;
  ctx.fillText(text, sx, y);
  if (o.underline) {
    const w = ctx.measureText(text).width;
    const lx = o.align === 'left' ? sx : o.align === 'right' ? sx - w : sx - w / 2;
    ctx.strokeStyle = color; ctx.lineWidth = size * 0.06; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(lx, y + size * 0.22);
    ctx.quadraticCurveTo(lx + w * 0.5, y + size * 0.32, lx + w, y + size * 0.2);
    ctx.stroke();
  }
  ctx.restore();
}

// Cat-skull stencil with crossbones
function drawCatSkull(x, y, s, color, o = {}) {
  ctx.save();
  ctx.translate(x, y);
  if (o.rotate) ctx.rotate(o.rotate);
  ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
  ctx.fillStyle = color; ctx.strokeStyle = color;
  ctx.lineWidth = s * 0.12; ctx.lineCap = 'round';
  if (o.bones !== false) {
    for (const a of [0.6, -0.6]) {
      ctx.save(); ctx.rotate(a);
      ctx.fillRect(-s * 1.1, s * 0.85 - s * 0.09, s * 2.2, s * 0.18);
      for (const bx of [-s * 1.1, s * 1.1]) {
        ctx.beginPath(); ctx.arc(bx, s * 0.85 - s * 0.1, s * 0.14, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(bx, s * 0.85 + s * 0.1, s * 0.14, 0, 7); ctx.fill();
      }
      ctx.restore();
    }
  }
  ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s * 0.9, -s * 0.35); ctx.lineTo(-s * 0.75, -s * 1.35); ctx.lineTo(-s * 0.15, -s * 0.9); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s * 0.9, -s * 0.35); ctx.lineTo(s * 0.75, -s * 1.35); ctx.lineTo(s * 0.15, -s * 0.9); ctx.fill();
  ctx.fillRect(-s * 0.5, s * 0.7, s, s * 0.45);
  ctx.fillStyle = o.hole || P.ink;
  ctx.beginPath(); ctx.ellipse(-s * 0.4, -s * 0.1, s * 0.28, s * 0.32, 0.3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.4, -s * 0.1, s * 0.28, s * 0.32, -0.3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, s * 0.3); ctx.lineTo(-s * 0.13, s * 0.55); ctx.lineTo(s * 0.13, s * 0.55); ctx.fill();
  for (let i = -1; i <= 1; i++) ctx.fillRect(i * s * 0.28 - s * 0.05, s * 0.75, s * 0.1, s * 0.3);
  ctx.restore();
}

function drawChainLink(x, y, w, h, sp, color, alpha) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.globalAlpha = alpha;
  ctx.beginPath();
  for (let i = -h; i < w + h; i += sp) {
    ctx.moveTo(x + i, y); ctx.lineTo(x + i + h, y + h);
    ctx.moveTo(x + i, y); ctx.lineTo(x + i - h, y + h);
  }
  ctx.stroke();
  ctx.restore();
}

function drawCrown(x, y, s, color, lw) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw || s * 0.12; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - s, y + s * 0.6); ctx.lineTo(x - s * 0.9, y - s * 0.4); ctx.lineTo(x - s * 0.45, y + s * 0.1);
  ctx.lineTo(x, y - s * 0.8); ctx.lineTo(x + s * 0.45, y + s * 0.1); ctx.lineTo(x + s * 0.9, y - s * 0.4);
  ctx.lineTo(x + s, y + s * 0.6); ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function drawAnarchy(x, y, s, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = s * 0.14; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, s, 0.2, Math.PI * 2 - 0.3); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - s * 0.7, y + s * 0.9); ctx.lineTo(x, y - s * 1.1); ctx.lineTo(x + s * 0.7, y + s * 0.9);
  ctx.moveTo(x - s * 0.8, y + s * 0.2); ctx.lineTo(x + s * 0.9, y + s * 0.1);
  ctx.stroke();
  ctx.restore();
}

function drawTornPaper(x, y, w, h, rot, color, seed) {
  const rng = srand(seed);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.rect(-w / 2 + 6, -h / 2 + 8, w, h); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-w / 2, -h / 2);
  const step = 14;
  for (let px = -w / 2; px < w / 2; px += step) ctx.lineTo(px + step, -h / 2 + (rng() - 0.5) * 6);
  for (let py = -h / 2; py < h / 2; py += step) ctx.lineTo(w / 2 + (rng() - 0.5) * 6, py + step);
  for (let px = w / 2; px > -w / 2; px -= step) ctx.lineTo(px - step, h / 2 + (rng() - 0.5) * 6);
  for (let py = h / 2; py > -h / 2; py -= step) ctx.lineTo(-w / 2 + (rng() - 0.5) * 6, py - step);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(80,50,20,0.12)';
  for (let i = 0; i < 12; i++) {
    ctx.beginPath(); ctx.ellipse(-w / 2 + rng() * w, -h / 2 + rng() * h, 6 + rng() * 18, 3 + rng() * 8, rng() * 3, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawSafetyPin(x, y, rot, color) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-9, -2); ctx.lineTo(9, -2); ctx.moveTo(-9, 3); ctx.lineTo(7, 3); ctx.stroke();
  ctx.beginPath(); ctx.arc(-10, 0.5, 3, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = color; ctx.fillRect(7, -4, 4, 8);
  ctx.restore();
}

function drawPushpin(x, y, color) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(x + 3, y + 5, 7, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(x - 2.5, y - 2.5, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function rectsHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ═══════════════════════════════════════════════════════════════════
//  Sound Engine (Web Audio API)
// ═══════════════════════════════════════════════════════════════════

let noiseBuffer = null;
function getNoiseBuffer() {
  if (noiseBuffer) return noiseBuffer;
  ensureAudio();
  const len = audioCtx.sampleRate * 0.5;
  noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return noiseBuffer;
}

function playNoise(freq, dur, vol, q) {
  ensureAudio();
  const src = audioCtx.createBufferSource();
  src.buffer = getNoiseBuffer();
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = freq; filt.Q.value = q || 2;
  const gain = audioCtx.createGain();
  const t = audioCtx.currentTime;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filt).connect(gain).connect(audioCtx.destination);
  src.start(t); src.stop(t + dur);
}

function playTone(freq, dur, vol, type, slide) {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  osc.type = type || 'sine';
  const t = audioCtx.currentTime;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur);
}

const SFX = {
  hitLight()  { playNoise(900, 0.08, 0.35, 3); playTone(300, 0.06, 0.15, 'square'); },
  hitHeavy()  { playNoise(500, 0.15, 0.45, 2); playTone(150, 0.12, 0.2, 'sawtooth'); },
  block()     { playTone(1200, 0.05, 0.2, 'square'); playTone(800, 0.04, 0.15, 'sine'); },
  jump()      { playTone(400, 0.1, 0.12, 'sine', 800); },
  land()      { playNoise(200, 0.06, 0.15, 1); },
  special()   { playTone(500, 0.3, 0.2, 'sawtooth', 1200); playTone(700, 0.3, 0.15, 'sine', 1400); },
  ko()        { playTone(600, 0.5, 0.3, 'sawtooth', 80); playNoise(300, 0.4, 0.25, 1); },
  bell()      { playTone(800, 0.6, 0.2, 'sine'); playTone(1200, 0.4, 0.1, 'sine'); },
  select()    { playTone(660, 0.08, 0.15, 'square'); },
  move()      { playTone(440, 0.04, 0.08, 'square'); },
  win()       { playTone(523, 0.15, 0.2, 'square'); setTimeout(()=>playTone(659,0.15,0.2,'square'),150); setTimeout(()=>playTone(784,0.3,0.25,'square'),300); },
};

// ═══════════════════════════════════════════════════════════════════
//  Particles
// ═══════════════════════════════════════════════════════════════════

const particles = [];

function spawnParts(x, y, count, color, speed, life, size) {
  for (let i = 0; i < count; i++) {
    const a = rnd(0, Math.PI * 2);
    const s = speed * rnd(0.4, 1);
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - rnd(1,3),
      life: life * rnd(0.6, 1), max: life,
      color, size: (size||3) * rnd(0.6, 1.4),
    });
  }
  while (particles.length > PARTICLE_CAP) particles.shift();
}

function spawnHitSparks(x, y, dir) {
  for (let i = 0; i < 8; i++) {
    const a = rnd(-0.6, 0.6) + (dir > 0 ? 0 : Math.PI);
    const s = rnd(3, 8);
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - rnd(1,4),
      life: rnd(8,16), max: 16, color: P.spark, size: rnd(2,5),
    });
  }
  spawnParts(x, y, 5, P.p1, 4, 12, 2);
}

function updateParticles() {
  updateHitFx();
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.15;
    p.vx *= 0.97;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    const s = p.size * (0.5 + a * 0.5);
    ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════════
//  Screen Shake
// ═══════════════════════════════════════════════════════════════════

let shakeAmt = 0;
function addShake(amt) { shakeAmt = Math.min(shakeAmt + amt, MAX_SHAKE); }
function getShake() {
  if (shakeAmt < 0.5) return {x:0, y:0};
  const x = rnd(-shakeAmt, shakeAmt);
  const y = rnd(-shakeAmt, shakeAmt);
  shakeAmt *= SHAKE_DECAY;
  return {x, y};
}

// ═══════════════════════════════════════════════════════════════════
//  Input
// ═══════════════════════════════════════════════════════════════════

const keys = {};
const justPressed = {};
addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
  ensureAudio();
  e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

function wasPressed(code) { return !!justPressed[code]; }
function isDown(code) { return !!keys[code]; }
function clearJustPressed() { for (const k in justPressed) delete justPressed[k]; }
function lastKeyPressed() {
  for (const k in justPressed) { if (justPressed[k]) return k; }
  return null;
}

const DEFAULT_BINDINGS = {
  p1: { left:'KeyA', right:'KeyD', up:'KeyW', down:'KeyS', light:'KeyJ', heavy:'KeyK', special:'KeyL' },
  p2: { left:'ArrowLeft', right:'ArrowRight', up:'ArrowUp', down:'ArrowDown', light:'Numpad1', heavy:'Numpad2', special:'Numpad3' },
};
const P2_ALT = { light:'Digit1', heavy:'Digit2', special:'Digit3' };

let bindings = loadBindings();
function loadBindings() {
  try {
    const s = localStorage.getItem('catfighter_bindings');
    if (s) {
      const b = JSON.parse(s);
      if (b.p1 && b.p2) return b;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_BINDINGS));
}
function saveBindings() {
  try { localStorage.setItem('catfighter_bindings', JSON.stringify(bindings)); } catch(e) {}
}

const ACTIONS = ['left','right','up','down','light','heavy','special'];
const ACTION_LABELS = { left:'Move Left', right:'Move Right', up:'Jump', down:'Crouch', light:'Light Attack', heavy:'Heavy Attack', special:'Special' };
const KEY_DISPLAY = {
  KeyA:'A',KeyB:'B',KeyC:'C',KeyD:'D',KeyE:'E',KeyF:'F',KeyG:'G',KeyH:'H',KeyI:'I',KeyJ:'J',KeyK:'K',KeyL:'L',KeyM:'M',

// Touch state
const touch = { left:false, right:false, up:false, down:false, light:false, heavy:false, special:false, any:false, confirm:false, pause:false };
let touchActive = false;
const touchJust = { light:false, heavy:false, special:false, confirm:false, pause:false, left:false, right:false, up:false, down:false };

const TBTN = [
  { id:'left',  x:90,  y:H-85, r:32 },
  { id:'right', x:170, y:H-85, r:32 },
  { id:'up',    x:130, y:H-135, r:32 },
  { id:'down',  x:130, y:H-40, r:32 },
  { id:'light', x:W-185, y:H-65, r:36, label:'L' },
  { id:'heavy', x:W-105, y:H-65, r:36, label:'H' },
  { id:'special',x:W-145,y:H-130,r:30, label:'S' },
  { id:'confirm',x:W/2,  y:H-65, r:28, label:'OK' },
  { id:'pause',  x:W/2+98, y:30,  r:18, label:'II' },
];

function handleTouches(e) {
  e.preventDefault();
  ensureAudio();
  touchActive = true;
  const prev = {};
  for (const k in touchJust) prev[k] = touch[k];
  for (const k in touch) touch[k] = false;
  const rect = canvas.getBoundingClientRect();
  for (const t of e.touches) {
    const tx = (t.clientX - rect.left) / rect.width * W;
    const ty = (t.clientY - rect.top) / rect.height * H;
    touch.any = true;
    for (const btn of TBTN) {
      if (Math.hypot(tx - btn.x, ty - btn.y) < btn.r * 1.3) {
        touch[btn.id] = true;
      }
    }
  }
  for (const k in touchJust) {
    if (touch[k] && !prev[k]) touchJust[k] = true;
  }
}
canvas.addEventListener('touchstart', handleTouches, {passive:false});
canvas.addEventListener('touchmove', handleTouches, {passive:false});
canvas.addEventListener('touchend', handleTouches, {passive:false});
canvas.addEventListener('touchcancel', handleTouches, {passive:false});

function drawTouchUI() {
  if (!touchActive) return;
  const TOUCH_IMG = { left: 'btn_dpad_left', right: 'btn_dpad_right', up: 'btn_dpad_up', down: 'btn_dpad_down', light: 'btn_light', heavy: 'btn_heavy', special: 'btn_special', confirm: 'btn_confirm', pause: 'btn_pause' };
  for (const btn of TBTN) {
    const pressed = touch[btn.id];
    if (drawImg('ui_' + TOUCH_IMG[btn.id], btn.x, btn.y, btn.r * 2.2, { alpha: pressed ? 1 : 0.7, scale: pressed ? 1.12 : 1 })) continue;
    ctx.globalAlpha = pressed ? 0.5 : 0.2;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = pressed ? 0.9 : 0.5;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const labels = {left:'◀',right:'▶',up:'▲',down:'▼'};
    ctx.fillText(btn.label || labels[btn.id] || '', btn.x, btn.y);
  }
  ctx.globalAlpha = 1;
}

// Merged input for P1 (keyboard + touch)
function p1Input() {
  return {
    left: P1.left() || touch.left,
    right: P1.right() || touch.right,
    up: P1.up() || touch.up,
    down: P1.down() || touch.down,
    light: P1.light() || touchJust.light,
    heavy: P1.heavy() || touchJust.heavy,
    special: P1.special() || touchJust.special,
  };
}

function loadImage(key, src) {
  const im = new Image();
  im.onload = () => { ASSETS.images[key] = im; };
  im.src = src;
}
function img(key) { return ASSETS.images[key] || null; }

function loadSprites(key) {
  const s = document.createElement('script');
  s.src = `assets/fighters/${key}/manifest.js`;
  s.onload = () => {
    const man = SPRITE_MANIFEST[key];
    if (!man) return;
    const set = { frames: {}, ready: false, count: 0, total: Object.keys(man).length };
    for (const name in man) {
      const im = new Image();
      im.onload = () => { set.frames[name] = { img: im, w: man[name].w, h: man[name].h, fx: man[name].fx, white: null }; set.count++; if (set.count >= set.total) set.ready = true; };
      im.onerror = () => { set.total--; if (set.count >= set.total) set.ready = true; };
      im.src = `assets/fighters/${key}/${name}.png`;
    }
    ASSETS.sprites[key] = set;
  };
  document.head.appendChild(s);
}

// draw an image centred at (cx,cy) with a target height, keeping aspect
function drawImg(key, cx, cy, h, o = {}) {
  const im = img(key);
  if (!im) return false;
  const s = h / im.height, w = im.width * s;
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.add) ctx.globalCompositeOperation = 'lighter';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 18; }
  ctx.translate(cx + (o.dx || 0), cy + (o.dy || 0));
  if (o.rot) ctx.rotate(o.rot);
  if (o.scale) ctx.scale(o.scale, o.scale);
  if (o.flip) ctx.scale(-1, 1);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
  return true;
}

const hitFx = [];
function spawnHitFx(key, x, y, size, life) {
  if (!img(key)) return;
  hitFx.push({ key, x, y, size, life, t: 0, rot: Math.random() * 6.28 });
}
function updateHitFx() {
  for (let i = hitFx.length - 1; i >= 0; i--) { hitFx[i].t++; if (hitFx[i].t >= hitFx[i].life) hitFx.splice(i, 1); }
}
function drawHitFx() {
  for (const f of hitFx) {
    const k = f.t / f.life;
    drawImg(f.key, f.x, f.y, f.size * (0.55 + k * 0.9), { alpha: 1 - k * k, add: true, rot: f.rot + k * 0.3 });
  }
}


function spriteSet(key) {
  const s = ASSETS.sprites[key];
  return s && s.ready && (s.frames.idle_2 || s.frames.idle_1) ? s : null;
}

function whiteFrame(fr) {
  if (!fr.white) {
    const c = document.createElement('canvas'); c.width = fr.w; c.height = fr.h;
    const g = c.getContext('2d');
    g.drawImage(fr.img, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = '#fff'; g.fillRect(0, 0, fr.w, fr.h);
    fr.white = c;
  }
  return fr.white;
}

// ═══════════════════════════════════════════════════════════════════
//  Fighter
// ═══════════════════════════════════════════════════════════════════

function createFighter(breedKey, startX, facing) {
  const b = BREEDS[breedKey];
  return {
    breed: b, breedKey,
    x: startX, y: GROUND_Y,
    vx: 0, vy: 0,
    facing, // 1=right, -1=left
    state: 'idle', stateFrame: 0,
    hp: b.hp, maxHp: b.hp, displayHp: b.hp,
    special: 0,
    wins: 0,
    grounded: true,
    hitThisAtk: false,
    hitstunTime: 0,
    blockstunTime: 0,
    invincible: 0,
    comboCount: 0,
    lastHitDir: 1,
    flashTimer: 0,
    // special move projectile/state
    specActive: false, specData: null,
    currentInput: { left:false, right:false, up:false, down:false, light:false, heavy:false, special:false },
    winPose: false,
  };
}

function fighterHurtbox(f) {
  const b = f.breed;
  const crouchMod = f.state === 'crouch' ? 0.6 : 1;
  const w = (b.bodyRX * 2 + 8) * ART;
  const h = (b.bodyRY * 2 + b.headR * 2 + 20) * crouchMod * ART;
  return { x: f.x - w/2, y: f.y - h, w, h };
}

function fighterAtkHitbox(f) {
  const atk = f.state === 'light' ? f.breed.lAtk : f.state === 'heavy' ? f.breed.hAtk : null;
  if (!atk) return null;
  const su = atk.su, ac = atk.ac;
  if (f.stateFrame < su || f.stateFrame >= su + ac) return null;
  const ox = f.facing * (f.breed.bodyRX + 5) * ART;
  const rx = atk.rx * ART, ry = atk.ry * ART;
  return {
    x: f.x + ox + (f.facing > 0 ? 0 : -rx),
    y: f.y - (f.breed.bodyRY * 2 + f.breed.headR + 5) * ART,
    w: rx, h: ry,
  };
}

function atkData(f) {
  return f.state === 'light' ? f.breed.lAtk : f.state === 'heavy' ? f.breed.hAtk : null;
}

function totalAtkFrames(atk) { return atk.su + atk.ac + atk.re; }

function updateFighter(f, input, opp) {
  const b = f.breed;
  f.stateFrame++;
  if (f.invincible > 0) f.invincible--;
  if (f.flashTimer > 0) f.flashTimer--;

  // smooth HP bar
  f.displayHp = lerp(f.displayHp, f.hp, 0.12);

  // auto-face opponent
  if (f.state === 'idle' || f.state === 'walk' || f.state === 'crouch') {
    f.facing = opp.x > f.x ? 1 : -1;
  }

  // gravity
  if (!f.grounded) {
    f.vy += GRAVITY;
    f.y += f.vy;
    if (f.y >= GROUND_Y) {
      f.y = GROUND_Y;
      f.vy = 0;
      f.grounded = true;
      if (f.state === 'airborne' || f.state === 'jump') {
        f.state = 'idle'; f.stateFrame = 0;
      }
    }
  }

  // hitstun
  if (f.state === 'hitstun') {
    f.vx *= 0.9;
    f.x += f.vx;
    f.hitstunTime--;
    if (f.hitstunTime <= 0) {
      f.state = 'idle'; f.stateFrame = 0;
      f.comboCount = 0;
    }
    clampStage(f);
    return;
  }

  // blockstun
  if (f.state === 'blockstun') {
    f.vx *= 0.88;
    f.x += f.vx;
    f.blockstunTime--;
    if (f.blockstunTime <= 0) {
      f.state = 'idle'; f.stateFrame = 0;
    }
    clampStage(f);
    return;
  }

  // knockdown
  if (f.state === 'ko') {
    f.vx *= 0.92;
    f.x += f.vx;
    clampStage(f);
    return;
  }

  // attacks
  if (f.state === 'light' || f.state === 'heavy') {
    const atk = atkData(f);
    f.vx *= 0.9;
    f.x += f.vx;
    if (f.stateFrame >= totalAtkFrames(atk)) {
      f.state = 'idle'; f.stateFrame = 0;
      f.hitThisAtk = false;
    }
    clampStage(f);
    return;
  }

  // special attack
  if (f.state === 'special') {
    f.vx *= 0.9;
    f.x += f.vx;
    handleSpecial(f, opp);
    clampStage(f);
    return;
  }

  // movement
  const spd = b.speed * (f.grounded ? 1 : AIR_CTRL);
  let moving = false;

  if (input.left) { f.vx -= spd * 0.3; moving = true; }
  if (input.right) { f.vx += spd * 0.3; moving = true; }

  if (f.grounded) {
    f.vx *= GROUND_FRIC;

    // crouch
    if (input.down) {
      if (f.state !== 'crouch') { f.state = 'crouch'; f.stateFrame = 0; }
    } else if (f.state === 'crouch') {
      f.state = 'idle'; f.stateFrame = 0;
    }

    // jump
    if (input.up && f.state !== 'crouch') {
      f.vy = b.jumpF;
      f.grounded = false;
      f.state = 'jump'; f.stateFrame = 0;
      SFX.jump();
    }

    // attacks (grounded only for simplicity)
    if (input.light && f.state !== 'crouch') {
      f.state = 'light'; f.stateFrame = 0; f.hitThisAtk = false;
      f.vx += f.facing * 2;
    }
    if (input.heavy && f.state !== 'crouch') {
      f.state = 'heavy'; f.stateFrame = 0; f.hitThisAtk = false;
      f.vx += f.facing * 3;
    }
    if (input.special && f.special >= SPECIAL_MAX && f.state !== 'crouch') {
      f.state = 'special'; f.stateFrame = 0; f.hitThisAtk = false;
      f.special = 0;
      startSpecial(f, opp);
      SFX.special();
    }

    if (!moving && f.state !== 'crouch' && f.state !== 'light' && f.state !== 'heavy' && f.state !== 'special') {
      if (f.state !== 'idle') { f.state = 'idle'; f.stateFrame = 0; }
    } else if (moving && f.state === 'idle') {
      f.state = 'walk'; f.stateFrame = 0;
    }
  } else {
    // air attacks
    if (input.light) {
      f.state = 'light'; f.stateFrame = 0; f.hitThisAtk = false;
    }
    if (input.heavy) {
      f.state = 'heavy'; f.stateFrame = 0; f.hitThisAtk = false;
    }
  }

  f.x += f.vx;
  clampStage(f);
}

function clampStage(f) {
  const hw = f.breed.bodyRX + 5;
  if (f.x < STAGE_L + hw) { f.x = STAGE_L + hw; f.vx = 0; }
  if (f.x > STAGE_R - hw) { f.x = STAGE_R - hw; f.vx = 0; }
}

function isBlocking(f, opp) {
  if (f.state === 'hitstun' || f.state === 'ko' || f.state === 'light' || f.state === 'heavy' || f.state === 'special') return false;
  if (!f.currentInput) return false;
  const awayDir = opp.x > f.x ? -1 : 1;
  return awayDir < 0 ? f.currentInput.left : f.currentInput.right;
}

//  Special Moves
// ═══════════════════════════════════════════════════════════════════

function startSpecial(f, opp) {
  const type = f.breed.specType;
  if (type === 'furball') {
    f.specActive = true;
    f.specData = { type:'furball', balls: [
      { x: f.x + f.facing*30*ART, y: f.y - 50*ART, vx: f.facing*8, vy: -2 },
      { x: f.x + f.facing*30*ART, y: f.y - 55*ART, vx: f.facing*7, vy: -4 },
      { x: f.x + f.facing*30*ART, y: f.y - 45*ART, vx: f.facing*9, vy: 0 },
    ], timer: 40 };
  } else if (type === 'shadowDash') {
    f.specActive = true;
    f.specData = { type:'shadowDash', timer: 20, dashDir: f.facing, hit: false };
    f.vx = f.facing * 14;
    f.invincible = 10;
  } else if (type === 'earthquake') {
    f.specActive = true;
    f.specData = { type:'earthquake', timer: 25, hit: false };
    addShake(MAX_SHAKE);
  } else if (type === 'hypnoGaze') {
    f.specActive = true;
    f.specData = { type:'hypnoGaze', timer: 30, hit: false };
  }
}

function handleSpecial(f, opp) {
  if (!f.specActive) {
    if (f.stateFrame > 30) { f.state = 'idle'; f.stateFrame = 0; }
    return;
  }
  const d = f.specData;
  d.timer--;

  if (d.type === 'furball') {
    for (const ball of d.balls) {
      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.vy += 0.1;
      const bRect = { x: ball.x-8*ART, y: ball.y-8*ART, w: 16*ART, h: 16*ART };
      if (!ball.hit && rectsHit(bRect, fighterHurtbox(opp))) {
        ball.hit = true;
        applyHit(opp, f, f.breed.specDmg * 0.4, 4, 8, ball.x, ball.y);
      }
    }
    if (d.timer <= 0) { f.specActive = false; f.state = 'idle'; f.stateFrame = 0; }
  } else if (d.type === 'shadowDash') {
    f.vx *= 0.95;
    if (!d.hit && rectsHit(fighterHurtbox(f), fighterHurtbox(opp))) {
      d.hit = true;
      applyHit(opp, f, f.breed.specDmg, 8, 14, opp.x, opp.y - 40*ART);
    }
    if (d.timer <= 0) { f.specActive = false; f.state = 'idle'; f.stateFrame = 0; f.invincible = 0; }
  } else if (d.type === 'earthquake') {
    if (f.stateFrame === 8 && !d.hit) {
      d.hit = true;
      if (opp.grounded && Math.abs(opp.x - f.x) < 180 * ART) {
        applyHit(opp, f, f.breed.specDmg, 12, 18, opp.x, GROUND_Y - 10);
        addShake(MAX_SHAKE);
        spawnParts(f.x, GROUND_Y, 20, '#A67B3D', 6, 20, 4);
      }
      spawnParts(f.x - 60, GROUND_Y, 8, '#5C3D1E', 4, 15, 3);
      spawnParts(f.x + 60, GROUND_Y, 8, '#5C3D1E', 4, 15, 3);
    }
    if (d.timer <= 0) { f.specActive = false; f.state = 'idle'; f.stateFrame = 0; }
  } else if (d.type === 'hypnoGaze') {
    if (f.stateFrame === 6 && !d.hit && Math.abs(opp.x - f.x) < 140 * ART) {
      d.hit = true;
      opp.hitstunTime = 40;
      opp.state = 'hitstun'; opp.stateFrame = 0;
      applyHit(opp, f, f.breed.specDmg, 0, 0, opp.x, opp.y - 50*ART);
      spawnParts(opp.x, opp.y - 60*ART, 15, '#FF00FF', 3, 25, 3);
    }
    if (d.timer <= 0) { f.specActive = false; f.state = 'idle'; f.stateFrame = 0; }
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Hit Resolution
// ═══════════════════════════════════════════════════════════════════

function applyHit(target, attacker, dmg, kb, stunFrames, sparkX, sparkY) {
  const blocked = isBlocking(target, attacker);
  const dir = attacker.x < target.x ? 1 : -1;

  if (blocked) {
    target.hp -= Math.ceil(dmg * BLOCK_DMG);
    target.vx = dir * kb * BLOCK_KB;
    target.state = 'blockstun'; target.stateFrame = 0;
    target.blockstunTime = Math.ceil(stunFrames * 0.5);
    spawnParts(sparkX, sparkY, 6, P.blockSpark, 5, 10, 3);
    spawnHitFx('fx_hit_4', sparkX, sparkY, 60, 12);
    SFX.block();
    game.hitPause = 3;
  } else {
    target.hp -= dmg;
    target.vx = dir * kb / target.breed.weight;
    target.vy = -Math.abs(kb) * 0.3;
    target.hitstunTime = stunFrames;
    target.state = 'hitstun'; target.stateFrame = 0;
    target.flashTimer = stunFrames;
    target.comboCount++;
    target.lastHitDir = dir;
    spawnHitSparks(sparkX, sparkY, dir);
    spawnHitFx(dmg > 15 ? 'fx_hit_1' : 'fx_hit_3', sparkX, sparkY, dmg > 15 ? 120 : 76, 14);
    addShake(dmg > 15 ? 10 : 5);
    if (dmg > 15) { SFX.hitHeavy(); game.hitPause = HEAVY_PAUSE; }
    else { SFX.hitLight(); game.hitPause = HIT_PAUSE; }
  }

  attacker.special = Math.min(SPECIAL_MAX, attacker.special + SPECIAL_GAIN_DEAL);
  target.special = Math.min(SPECIAL_MAX, target.special + SPECIAL_GAIN_TAKE);

  if (target.hp <= 0) {
    target.hp = 0;
    target.state = 'ko'; target.stateFrame = 0;
    target.vx = dir * 6;
    target.vy = -6;
    game.hitPause = KO_PAUSE;
    addShake(MAX_SHAKE);
    SFX.ko();
    spawnParts(sparkX, sparkY, 25, P.ko, 8, 25, 5);
    spawnHitFx('fx_hit_5', sparkX, sparkY, 200, 26);
    spawnHitFx('fx_hit_6', sparkX, sparkY, 140, 20);
    spawnParts(sparkX, sparkY, 15, P.gold, 6, 30, 4);
  }
}

function checkHits(f1, f2) {
  // f1 attacking f2
  if ((f1.state === 'light' || f1.state === 'heavy') && !f1.hitThisAtk) {
    const hitbox = fighterAtkHitbox(f1);
    if (hitbox && rectsHit(hitbox, fighterHurtbox(f2))) {
      f1.hitThisAtk = true;
      const atk = atkData(f1);
      const sparkX = (f1.x + f2.x) / 2;
      const sparkY = hitbox.y + hitbox.h / 2;
      applyHit(f2, f1, atk.dmg, atk.kb, f1.state === 'heavy' ? 18 : 10, sparkX, sparkY);
    }
  }
}

function pushApart(f1, f2) {
  const dist = Math.abs(f1.x - f2.x);
  const minDist = (f1.breed.bodyRX + f2.breed.bodyRX + 4) * ART;
  if (dist < minDist) {
    const push = (minDist - dist) / 2 * PUSH_APART * 0.5;
    const dir = f1.x < f2.x ? -1 : 1;
    f1.x += dir * push;
    f2.x -= dir * push;
  }
}

// ═══════════════════════════════════════════════════════════════════
//  AI Controller
// ═══════════════════════════════════════════════════════════════════

const ai = {
  decision: 'wait',
  timer: 0,
  reactTimer: 0,
  difficulty: 0.5,
};

function aiUpdate(self, opp) {
  ai.timer--;
  if (ai.timer > 0) return aiToInput(self, opp);

  ai.timer = rndInt(8, 22);
  const dist = Math.abs(self.x - opp.x);
  const oppAtk = opp.state === 'light' || opp.state === 'heavy' || opp.state === 'special';

  if (self.state === 'hitstun' || self.state === 'ko' || self.state === 'blockstun') {
    ai.decision = 'idle';
    return aiToInput(self, opp);
  }

  // close range
  if (dist < 90 * ART) {
    if (oppAtk && Math.random() < ai.difficulty * 0.6) {
      ai.decision = 'block';
    } else if (Math.random() < 0.15) {
      ai.decision = 'jump_back';
    } else if (Math.random() < AI_AGGRO) {
      ai.decision = Math.random() < 0.35 ? 'heavy' : 'light';
    } else {
      ai.decision = 'block';
    }
  }
  // attack range
  else if (dist < 140 * ART) {
    if (Math.random() < AI_AGGRO * 0.8) {
      ai.decision = 'approach_attack';
    } else {
      ai.decision = 'approach';
    }
  }
  // far
  else {
    if (Math.random() < 0.7) ai.decision = 'approach';
    else if (Math.random() < 0.15) ai.decision = 'jump_in';
    else ai.decision = 'wait';
  }

  // special
  if (self.special >= SPECIAL_MAX && dist < 160 * ART && Math.random() < 0.4) {
    ai.decision = 'special';
  }

  return aiToInput(self, opp);
}

function aiToInput(self, opp) {
  const inp = { left:false, right:false, up:false, down:false, light:false, heavy:false, special:false };
  const toOpp = opp.x > self.x ? 'right' : 'left';
  const awayOpp = toOpp === 'right' ? 'left' : 'right';

  switch (ai.decision) {
    case 'approach': inp[toOpp] = true; break;
    case 'approach_attack': inp[toOpp] = true; if (Math.abs(self.x-opp.x)<100 * ART) inp.light = true; break;
    case 'light': inp.light = true; break;
    case 'heavy': inp.heavy = true; break;
    case 'special': inp.special = true; break;
    case 'block': inp[awayOpp] = true; break;
    case 'jump_back': inp[awayOpp] = true; inp.up = true; break;
    case 'jump_in': inp[toOpp] = true; inp.up = true; break;
  }
  return inp;
}

// ═══════════════════════════════════════════════════════════════════
//  Cat Drawing
// ═══════════════════════════════════════════════════════════════════

function drawCat(f) {
  const b = f.breed;
  const c = b.color;
  const k = b.key;
  const flash = f.flashTimer > 0 && Math.floor(f.stateFrame / 3) % 2 === 0;
  const col = (clr) => flash ? '#ffffff' : clr;
  const sf = f.stateFrame;
  const gf = game.frame;
  const specFull = f.special >= SPECIAL_MAX;

  const SET = spriteSet(k);
  if (SET) { drawSpriteCat(f, SET); drawProjectiles(f); return; }

  ctx.save();
  ctx.translate(f.x, f.y);
  if (f.facing < 0) ctx.scale(-1, 1);
  ctx.scale(ART, ART);

  let bodyOY = 0, headOY = 0, armExt = 0, armAng = 0;
  let legAnim = 0, crouchAmt = 0;

  switch (f.state) {
    case 'idle':
      if (k === 'hex') {
        const tw = (sf % 120) > 110 ? Math.sin(sf * 1.5) * 2 : 0;
        bodyOY = tw; headOY = tw * 0.5;
      } else if (k === 'brutus') {
        bodyOY = Math.abs(Math.sin(sf * 0.14)) * -4;
        headOY = Math.sin(sf * 0.28) * 2.5;
        armAng = Math.sin(sf * 0.28) * 0.25;
      } else {
        bodyOY = Math.sin(sf * 0.08) * 2;
        headOY = Math.sin(sf * 0.08 + 0.5) * 1.5;
        armAng = Math.sin(sf * 0.06) * 0.1;
      }
      break;
    case 'walk':
      bodyOY = Math.sin(sf * 0.15) * 1.5;
      headOY = Math.sin(sf * 0.15 + 0.3) * 1;
      legAnim = Math.sin(sf * 0.25) * 6;
      if (k === 'brutus') bodyOY -= 2;
      break;
    case 'jump':
    case 'airborne':
      bodyOY = -4; headOY = -3;
      break;
    case 'crouch':
      crouchAmt = Math.min(sf / 4, 1);
      bodyOY = 16 * crouchAmt; headOY = 12 * crouchAmt;
      break;
    case 'light': {
      const atk = b.lAtk;
      if (sf < atk.su) { armExt = -8; bodyOY = 2; }
      else if (sf < atk.su + atk.ac) { armExt = 30; bodyOY = -1; }
      else { const t = (sf - atk.su - atk.ac) / atk.re; armExt = lerp(30, 0, t); }
      break;
    }
    case 'heavy': {
      const atk = b.hAtk;
      if (sf < atk.su) { armExt = -12; bodyOY = 4; armAng = -0.3; }
      else if (sf < atk.su + atk.ac) { armExt = 38; bodyOY = -3; armAng = 0.2; }
      else { const t = (sf - atk.su - atk.ac) / atk.re; armExt = lerp(38, 0, t); armAng = lerp(0.2, 0, t); }
      break;
    }
    case 'special':
      bodyOY = Math.sin(sf * 0.2) * 3; armExt = 20; armAng = Math.sin(sf * 0.3) * 0.3;
      break;
    case 'hitstun':
      bodyOY = Math.sin(sf * 0.4) * 4; headOY = Math.sin(sf * 0.5) * 3;
      break;
    case 'blockstun':
      bodyOY = 3; armExt = -5;
      break;
    case 'ko':
      bodyOY = 15 + Math.min(sf, 15); headOY = 12 + Math.min(sf, 12);
      break;
  }

  const bodyX = 0;
  const bodyY = -42 + bodyOY;
  const headX = 4;
  const headY = -72 + headOY;
  const legW = 9, legH = 22;

  // ── Breed-specific ghosting (drawn behind everything) ──
  if (!flash && k === 'hex' && ((gf % 150) < 4 || f.state === 'hitstun')) {
    ctx.globalAlpha = 0.5;
    for (const [ox, cc] of [[-5, c.cyan], [5, c.magenta]]) {
      ctx.fillStyle = cc;
      ctx.beginPath(); ctx.ellipse(bodyX + ox, bodyY, b.bodyRX, b.bodyRY, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(headX + ox, headY, b.headR, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if (!flash && k === 'vex' && f.state === 'walk') {
    for (let i = 1; i <= 2; i++) {
      ctx.globalAlpha = 0.18 / i;
      ctx.fillStyle = c.eye;
      ctx.beginPath(); ctx.ellipse(bodyX - i * 10, bodyY, b.bodyRX, b.bodyRY, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(headX - i * 10, headY, b.headR, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ── Tail ──
  const tailBaseX = -b.bodyRX * 0.8;
  const tailBaseY = bodyY + 5;
  const tailWave = k === 'hex' ? Math.round(Math.sin(sf * 0.06) * 2) * 4 : Math.sin(sf * 0.06) * 8;
  const tc1x = tailBaseX - 18, tc1y = tailBaseY - 25 + tailWave;
  const tEndX = tailBaseX - 12, tEndY = tailBaseY - 45 + tailWave;
  const tailPt = (t) => {
    const mt = 1 - t;
    return [mt * mt * tailBaseX + 2 * mt * t * tc1x + t * t * tEndX, mt * mt * tailBaseY + 2 * mt * t * tc1y + t * t * tEndY];
  };
  ctx.strokeStyle = col(c.body);
  ctx.lineWidth = b.tailThick;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(tailBaseX, tailBaseY);
  ctx.quadraticCurveTo(tc1x, tc1y, tEndX, tEndY);
  ctx.stroke();
  if (k === 'razor') {
    // kinked tail: a hard bend near the tip
    ctx.beginPath(); const [kx, ky] = tailPt(0.75);
    ctx.moveTo(kx, ky); ctx.lineTo(kx - 7, ky - 9); ctx.stroke();
    ctx.fillStyle = col(c.light);
    for (let t = 0.1; t < 1; t += 0.15) { const [px, py] = tailPt(t); ctx.beginPath(); ctx.arc(px + Math.sin(t * 40) * 3, py, 2.5, 0, 7); ctx.fill(); }
  }
  if (k === 'brutus') {
    ctx.fillStyle = col(c.body);
    ctx.beginPath(); ctx.arc(tEndX, tEndY, b.tailThick * 0.9, 0, 7); ctx.fill();
    ctx.strokeStyle = col(c.stripe); ctx.lineWidth = 3;
    for (const t of [0.25, 0.5, 0.75]) { const [px, py] = tailPt(t); ctx.beginPath(); ctx.moveTo(px - 5, py - 3); ctx.lineTo(px + 5, py + 3); ctx.stroke(); }
  }
  if (k === 'vex') {
    ctx.strokeStyle = col(c.dark); ctx.lineWidth = b.tailThick;
    ctx.beginPath(); const [sx, sy] = tailPt(0.65);
    ctx.moveTo(sx, sy); ctx.quadraticCurveTo(tailBaseX - 15, tailBaseY - 42 + tailWave, tEndX, tEndY); ctx.stroke();
  }
  if (k === 'hex' && !flash) {
    ctx.save();
    for (let i = 0; i <= 10; i++) {
      const t = i / 10; const [px, py] = tailPt(t);
      const cc = ((i + (gf >> 3)) % 2 === 0) ? c.cyan : c.magenta;
      ctx.fillStyle = cc; ctx.shadowColor = cc; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(px, py, 1.6, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  // ── Back Leg ──
  ctx.fillStyle = col(c.dark);
  roundRect(ctx, -5 - legAnim * 0.3, -legH + bodyOY * 0.3, legW, legH + 2, 4);
  ctx.fillStyle = col(b.points ? c.dark : c.body);
  ctx.beginPath();
  ctx.arc(-1 - legAnim * 0.3, 2 + bodyOY * 0.3, b.pawR * 0.8, 0, Math.PI * 2);
  ctx.fill();

  // ── Body ──
  ctx.fillStyle = col(c.body);
  ctx.beginPath();
  ctx.ellipse(bodyX, bodyY, b.bodyRX, b.bodyRY, 0, 0, Math.PI * 2);
  ctx.fill();

  if (b.fluffy) {
    ctx.fillStyle = col(c.light);
    for (let a = 0; a < Math.PI * 2; a += 0.7) {
      ctx.beginPath();
      ctx.arc(bodyX + Math.cos(a) * (b.bodyRX + 2), bodyY + Math.sin(a) * (b.bodyRY + 2), 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (b.stripes) {
    ctx.strokeStyle = col(c.stripe);
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(bodyX + i * 11 - 4, bodyY - b.bodyRY * 0.8);
      ctx.lineTo(bodyX + i * 11 + 1, bodyY - b.bodyRY * 0.3);
      ctx.lineTo(bodyX + i * 11 - 2, bodyY + b.bodyRY * 0.1);
      ctx.lineTo(bodyX + i * 11 + 4, bodyY + b.bodyRY * 0.6);
      ctx.stroke();
    }
  }

  if (b.wrinkles) {
    ctx.strokeStyle = col(c.dark);
    ctx.lineWidth = 1;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(bodyX - 8, bodyY + i * 7);
      ctx.quadraticCurveTo(bodyX, bodyY + i * 7 - 3, bodyX + 8, bodyY + i * 7);
      ctx.stroke();
    }
  }

  // hex circuit tattoos + chest mandala
  if (k === 'hex' && !flash) {
    ctx.save();
    const pulse = 0.55 + Math.sin(gf * 0.12) * 0.35;
    ctx.globalAlpha = pulse;
    ctx.lineWidth = 1.3; ctx.lineCap = 'square';
    ctx.strokeStyle = c.cyan; ctx.shadowColor = c.cyan; ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(bodyX - b.bodyRX * 0.7, bodyY - 4); ctx.lineTo(bodyX - b.bodyRX * 0.3, bodyY - 4); ctx.lineTo(bodyX - b.bodyRX * 0.3, bodyY - 12);
    ctx.moveTo(bodyX - b.bodyRX * 0.6, bodyY + 8); ctx.lineTo(bodyX - 2, bodyY + 8); ctx.lineTo(bodyX + 4, bodyY + 14);
    ctx.moveTo(bodyX + 8, bodyY - b.bodyRY * 0.8); ctx.lineTo(bodyX + 8, bodyY - 12);
    ctx.stroke();
    for (const [px, py] of [[bodyX - b.bodyRX * 0.3, bodyY - 12], [bodyX + 4, bodyY + 14], [bodyX - b.bodyRX * 0.7, bodyY - 4]]) { ctx.fillStyle = c.cyan; ctx.fillRect(px - 1.5, py - 1.5, 3, 3); }
    ctx.strokeStyle = c.magenta; ctx.shadowColor = c.magenta;
    const mx = bodyX + b.bodyRX * 0.35, my = bodyY - 1, mr = 6;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; const px = mx + Math.cos(a) * mr, py = my + Math.sin(a) * mr; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mx, my - mr * 0.7); ctx.lineTo(mx + mr * 0.6, my + mr * 0.4); ctx.lineTo(mx - mr * 0.6, my + mr * 0.4); ctx.closePath(); ctx.stroke();
    ctx.restore();
  }

  if (b.mane) {
    ctx.fillStyle = col(c.light);
    for (let a = -1.5; a < 1.5; a += 0.35) {
      ctx.beginPath();
      ctx.arc(bodyX + Math.cos(a) * (b.bodyRX * 0.6) + 5, bodyY - b.bodyRY * 0.6 + Math.sin(a) * 6, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // brutus vest, skull shave, chain
  if (k === 'brutus') {
    ctx.save();
    ctx.beginPath(); ctx.ellipse(bodyX, bodyY, b.bodyRX, b.bodyRY, 0, 0, 7); ctx.clip();
    ctx.fillStyle = col(c.vest);
    ctx.beginPath(); ctx.ellipse(bodyX - 3, bodyY + 2, b.bodyRX * 0.85, b.bodyRY * 0.95, 0, 0, 7); ctx.fill();
    ctx.fillStyle = col(c.body);
    ctx.beginPath(); ctx.moveTo(bodyX + 2, bodyY - b.bodyRY); ctx.lineTo(bodyX + 12, bodyY + 6); ctx.lineTo(bodyX + b.bodyRX * 0.5, bodyY - b.bodyRY); ctx.fill();
    ctx.fillStyle = col(c.stud);
    for (let a = -2.4; a < -0.4; a += 0.32) { ctx.beginPath(); ctx.arc(bodyX - 3 + Math.cos(a) * b.bodyRX * 0.78, bodyY + 2 + Math.sin(a) * b.bodyRY * 0.88, 1.6, 0, 7); ctx.fill(); }
    ctx.restore();
    if (!flash) drawCatSkull(bodyX - b.bodyRX * 0.42, bodyY - b.bodyRY * 0.25, 4.2, c.shave, { bones: false, alpha: 0.85, hole: c.vest });
    const sag = Math.sin(sf * 0.1) * 3 + (f.state === 'walk' ? Math.sin(sf * 0.25) * 4 : 0);
    ctx.strokeStyle = col(c.chain); ctx.lineWidth = 2;
    for (let i = 0; i < 7; i++) {
      const t = i / 6;
      const lx = lerp(bodyX - b.bodyRX * 0.55, bodyX + b.bodyRX * 0.75, t);
      const ly = lerp(bodyY - b.bodyRY * 0.75, bodyY - b.bodyRY * 0.65, t) + Math.sin(t * Math.PI) * (10 + sag);
      ctx.beginPath(); ctx.ellipse(lx, ly, i % 2 ? 2 : 3.2, i % 2 ? 3.2 : 2, 0, 0, 7); ctx.stroke();
    }
  }

  // ── Back Arm ──
  ctx.fillStyle = col(c.dark);
  ctx.beginPath();
  ctx.arc(-b.bodyRX * 0.3, bodyY - 2, b.pawR * 0.7, 0, Math.PI * 2);
  ctx.fill();

  // ── Front Leg ──
  const flx = 3 + legAnim * 0.3, fly = -legH + bodyOY * 0.3;
  ctx.fillStyle = col(c.body);
  roundRect(ctx, flx, fly, legW, legH + 2, 4);
  if (k === 'vex' && !flash) {
    ctx.save(); ctx.beginPath(); ctx.rect(flx, fly, legW, legH); ctx.clip();
    ctx.strokeStyle = c.net; ctx.lineWidth = 0.8; ctx.beginPath();
    for (let i = -legH; i < legW + legH; i += 4) { ctx.moveTo(flx + i, fly); ctx.lineTo(flx + i - legH, fly + legH); ctx.moveTo(flx + i, fly); ctx.lineTo(flx + i + legH, fly + legH); }
    ctx.stroke(); ctx.restore();
  }
  ctx.fillStyle = col(b.points ? c.dark : c.body);
  ctx.beginPath();
  ctx.arc(7 + legAnim * 0.3, 2 + bodyOY * 0.3, b.pawR * 0.9, 0, Math.PI * 2);
  ctx.fill();

  // ── Neckwear (between body and head) ──
  const neckX = headX - 2, neckY = headY + b.headR * 0.78;
  if (k === 'razor') {
    ctx.strokeStyle = col(c.collar); ctx.lineWidth = 7;
    ctx.beginPath(); ctx.ellipse(neckX, neckY, b.headR * 0.9, b.headR * 0.3, 0, 0.1, Math.PI - 0.1); ctx.stroke();
    ctx.fillStyle = col(c.stud);
    for (let i = 0; i < 6; i++) {
      if (i === 4) continue;
      const a = 0.35 + i * 0.49;
      const sx = neckX + Math.cos(a) * b.headR * 0.9, sy = neckY + Math.sin(a) * b.headR * 0.3;
      ctx.beginPath(); ctx.moveTo(sx - 2.5, sy); ctx.lineTo(sx, sy + 6); ctx.lineTo(sx + 2.5, sy); ctx.fill();

  }
  if (k === 'vex') {

    ctx.beginPath(); ctx.ellipse(neckX, neckY - 1, b.headR * 0.8, b.headR * 0.25, 0, 0.1, Math.PI - 0.1); ctx.stroke();
    ctx.fillStyle = col(c.spike);
    for (let i = 0; i < 5; i++) {
      const a = 0.4 + i * 0.58;

    }

  }

  // ── Head ──
  ctx.fillStyle = col(c.body);
  ctx.beginPath();
  ctx.arc(headX, headY, b.headR, 0, Math.PI * 2);
  ctx.fill();

  if (b.fluffy) {
    ctx.fillStyle = col(c.light);
    for (let a = 0; a < Math.PI * 2; a += 0.8) {

    }
  }

  if (b.points) {
    ctx.fillStyle = col(c.dark);
    ctx.beginPath();
    ctx.ellipse(headX + b.headR * 0.25, headY + 2, b.headR * 0.55, b.headR * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const faceOX = b.headR * 0.3;
  const eyeY = headY - b.headR * 0.1;
  const eyeLX = headX + faceOX - b.eyeR * 1.2;
  const eyeRX = headX + faceOX + b.eyeR * 1.2;

  if (k === 'razor' && !flash) {
    // raccoon mask + cheek scars
    ctx.fillStyle = c.dark; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.ellipse(headX + faceOX * 0.6, eyeY, b.headR * 0.85, b.headR * 0.28, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = c.scar; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(headX - b.headR * 0.55 + i * 4, headY + 2);
      ctx.lineTo(headX - b.headR * 0.7 + i * 4, headY + 13);
      ctx.stroke();
    }
  }

  if (k === 'brutus') {
    // lightning shave + mohawk
    if (!flash) {
      ctx.strokeStyle = c.shave; ctx.lineWidth = 2; ctx.lineJoin = 'miter';
      ctx.beginPath(); ctx.moveTo(headX - b.headR * 0.7, headY - 8); ctx.lineTo(headX - b.headR * 0.55, headY - 2); ctx.lineTo(headX - b.headR * 0.68, headY); ctx.lineTo(headX - b.headR * 0.5, headY + 8); ctx.stroke();
    }
    const bang = f.state === 'idle' ? Math.sin(sf * 0.28) * 3 : 0;
    for (let i = 0; i < 7; i++) {
      const t = i / 6;
      const mx = lerp(headX - b.headR * 0.55, headX + b.headR * 0.45, t);
      const my = headY - Math.sqrt(Math.max(0, b.headR * b.headR - (mx - headX) ** 2)) + 2;
      const h = 12 + Math.sin(t * Math.PI) * 8 + bang;
      ctx.fillStyle = col(c.mohawk);
      ctx.beginPath(); ctx.moveTo(mx - 4, my + 2); ctx.lineTo(mx + 1 - t * 3, my - h); ctx.lineTo(mx + 4, my + 2); ctx.fill();
      ctx.fillStyle = col(c.mohawkTip);
      ctx.beginPath(); ctx.moveTo(mx - 1.5, my - h * 0.55); ctx.lineTo(mx + 1 - t * 3, my - h); ctx.lineTo(mx + 1.5, my - h * 0.55); ctx.fill();
    }
  }

  // ── Ears ──
  const earBaseY = headY - b.headR * 0.6;
  const earLX = headX - b.headR * 0.5;
  const earRX = headX + b.headR * 0.5;
  ctx.fillStyle = col(b.points ? c.dark : c.body);
  ctx.beginPath();
  ctx.moveTo(earLX - b.earW / 2, earBaseY + 2);
  if (k === 'razor') {
    ctx.lineTo(earLX - b.earW * 0.15, earBaseY - b.earH * 0.55);
    ctx.lineTo(earLX + b.earW * 0.05, earBaseY - b.earH * 0.35);
    ctx.lineTo(earLX + b.earW * 0.1, earBaseY - b.earH);
  } else {
    ctx.lineTo(earLX, earBaseY - b.earH);
  }
  ctx.lineTo(earLX + b.earW / 2, earBaseY + 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(earRX - b.earW / 2, earBaseY + 2);
  ctx.lineTo(earRX, earBaseY - b.earH);
  ctx.lineTo(earRX + b.earW / 2, earBaseY + 2);
  ctx.fill();
  ctx.fillStyle = col(c.inner);
  const inS = 0.55;
  if (k !== 'razor') {
    ctx.beginPath();
    ctx.moveTo(earLX - b.earW * inS / 2, earBaseY + 1);
    ctx.lineTo(earLX, earBaseY - b.earH * 0.7);
    ctx.lineTo(earLX + b.earW * inS / 2, earBaseY + 1);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.moveTo(earRX - b.earW * inS / 2, earBaseY + 1);
  ctx.lineTo(earRX, earBaseY - b.earH * 0.7);
  ctx.lineTo(earRX + b.earW * inS / 2, earBaseY + 1);
  ctx.fill();
  if (k === 'hex' && !flash) {
    ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = c.cyan; ctx.shadowColor = c.cyan; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(earRX - b.earW * inS / 2, earBaseY + 1); ctx.lineTo(earRX, earBaseY - b.earH * 0.7); ctx.lineTo(earRX + b.earW * inS / 2, earBaseY + 1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(earLX - b.earW * inS / 2, earBaseY + 1); ctx.lineTo(earLX, earBaseY - b.earH * 0.7); ctx.lineTo(earLX + b.earW * inS / 2, earBaseY + 1); ctx.fill();
    ctx.restore();

    ctx.beginPath(); ctx.arc(earLX - 4, earBaseY - b.earH * 0.45, 1.4, 0, 7); ctx.fill();

  }

  if (b.earTufts) {
    ctx.strokeStyle = col(c.light);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(earLX, earBaseY - b.earH); ctx.lineTo(earLX - 3, earBaseY - b.earH - 6);
    ctx.moveTo(earLX, earBaseY - b.earH); ctx.lineTo(earLX + 2, earBaseY - b.earH - 7);
    ctx.moveTo(earRX, earBaseY - b.earH); ctx.lineTo(earRX - 2, earBaseY - b.earH - 7);

  }

  if (k === 'razor') {
    ctx.strokeStyle = col(c.stud); ctx.lineWidth = 1.5;

  }
  if (k === 'brutus') {
    ctx.strokeStyle = col(c.pin); ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const px = earRX + b.earW * 0.15 + i * 2.5, py = earBaseY - b.earH * 0.5 + i * 4;
      ctx.beginPath(); ctx.moveTo(px - 3, py + 1); ctx.lineTo(px + 3, py - 3); ctx.stroke();

    }
  }

  if (k === 'hex') {
    const gy = headY - b.headR * 0.62;
    ctx.strokeStyle = col('#222'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(headX - b.headR * 0.95, gy + 2); ctx.lineTo(headX + b.headR * 0.95, gy - 1); ctx.stroke();

      } else {
        ctx.fillStyle = col(c.cracked);
        ctx.beginPath(); ctx.arc(gx, gy, 3.8, 0, 7); ctx.fill();
        ctx.strokeStyle = col('#999'); ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(gx - 3, gy - 2); ctx.lineTo(gx, gy + 0.5); ctx.lineTo(gx + 3, gy + 3); ctx.moveTo(gx, gy + 0.5); ctx.lineTo(gx + 2.5, gy - 2.5); ctx.stroke();
      }
    }
    if (!flash) {
      ctx.save();
      const hx = headX + faceOX, hy = headY - b.headR * 0.38;
      ctx.strokeStyle = c.cyan; ctx.shadowColor = c.cyan; ctx.shadowBlur = 6; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx - 5, hy); ctx.quadraticCurveTo(hx, hy - 4, hx + 5, hy); ctx.quadraticCurveTo(hx, hy + 4, hx - 5, hy); ctx.stroke();

  // ── Eyes ──
  const ir = b.eyeR * 0.65;
  const pr = ir * 0.55;
  if (k === 'hex') {
    const lBlink = (gf % 200) < 5 ? 0.12 : 1;
    const rBlink = ((gf + 55) % 200) < 5 ? 0.12 : 1;
    const strobe = f.state === 'special';
    for (const [ex, cc, bl] of [[eyeLX, strobe && (gf >> 1) % 2 ? c.magenta : c.cyan, lBlink], [eyeRX, strobe && (gf >> 1) % 2 ? c.cyan : c.magenta, rBlink]]) {

      if (!flash) { ctx.shadowColor = cc; ctx.shadowBlur = 10; }
      ctx.fillStyle = col(cc);

      ctx.restore();

    }

      ctx.beginPath(); ctx.arc(ex + 1, eyeY, ir * sc, 0, 7); ctx.fill();

      ctx.fillStyle = col('#111');
      ctx.beginPath(); ctx.arc(ex + 1.5, eyeY, ir * sc * 0.75, 0, 7); ctx.fill();

    }

    for (const ex of [eyeLX, eyeRX]) {
      ctx.fillStyle = col('#fff');
      ctx.beginPath(); ctx.ellipse(ex, eyeY, b.eyeR * 1.05, b.eyeR * 0.5, 0, 0, 7); ctx.fill();
      ctx.save();
      if (!flash) { ctx.shadowColor = c.eye; ctx.shadowBlur = specFull ? 10 + Math.sin(gf * 0.2) * 4 : 3; }
      ctx.fillStyle = col(c.eye);
      ctx.beginPath(); ctx.ellipse(ex + 1, eyeY, ir, b.eyeR * 0.48, 0, 0, 7); ctx.fill();
      ctx.restore();
      ctx.fillStyle = col('#111');
      ctx.beginPath(); ctx.ellipse(ex + 1.5, eyeY, pr * 0.6, b.eyeR * 0.42, 0, 0, 7); ctx.fill();
      if (!flash) {
        ctx.strokeStyle = c.dark; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(ex - b.eyeR, eyeY - b.eyeR * 0.9); ctx.lineTo(ex + b.eyeR * 1.1, eyeY - b.eyeR * 0.45); ctx.stroke();

    }
  }

  if (f.state === 'ko') {
    ctx.strokeStyle = col('#333');
    ctx.lineWidth = 2;
    const xs = b.eyeR * 0.7;
    for (const ex of [eyeLX, eyeRX]) {
      ctx.beginPath(); ctx.moveTo(ex - xs, eyeY - xs); ctx.lineTo(ex + xs, eyeY + xs); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex + xs, eyeY - xs); ctx.lineTo(ex - xs, eyeY + xs); ctx.stroke();
    }
  }

  // ── Nose & Mouth ──
  const noseX = headX + faceOX + b.headR * 0.15;
  const noseY = headY + b.headR * 0.25;
  ctx.fillStyle = col(c.nose);
  ctx.beginPath();
  ctx.moveTo(noseX, noseY - 2.5); ctx.lineTo(noseX - 3, noseY + 2); ctx.lineTo(noseX + 3, noseY + 2);
  ctx.fill();
  if (k === 'vex' && !flash) { ctx.fillStyle = '#E0E0E8'; ctx.beginPath(); ctx.arc(noseX - 4, noseY - 1, 1.1, 0, 7); ctx.fill(); }

  if (!flash) {
    ctx.strokeStyle = k === 'vex' ? '#0A0612' : c.dark;
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    if (k === 'brutus') {
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(noseX - 9, noseY + 5); ctx.quadraticCurveTo(noseX, noseY + 13, noseX + 9, noseY + 4); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(noseX - 7, noseY + 6); ctx.lineTo(noseX - 5.5, noseY + 12); ctx.lineTo(noseX - 4, noseY + 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(noseX + 4, noseY + 7); ctx.lineTo(noseX + 5.5, noseY + 12); ctx.lineTo(noseX + 7, noseY + 6); ctx.fill();
      if (f.state === 'idle' || f.state === 'walk') { ctx.fillStyle = '#E0506A'; ctx.beginPath(); ctx.ellipse(noseX, noseY + 12, 3, 4, 0, 0, 7); ctx.fill(); }
    } else if (k === 'hex') {
      const grin = f.state === 'special' || f.state === 'heavy';
      ctx.beginPath();
      if (grin) { ctx.moveTo(noseX - 8, noseY + 4); ctx.quadraticCurveTo(noseX, noseY + 12, noseX + 9, noseY + 3); ctx.stroke(); ctx.fillStyle = '#fff'; for (let i = -6; i <= 6; i += 3) ctx.fillRect(noseX + i, noseY + 6, 1.5, 2.5); }
      else { ctx.moveTo(noseX - 5, noseY + 6); ctx.lineTo(noseX + 5, noseY + 6); ctx.stroke(); }
    } else if (k === 'vex') {
      ctx.beginPath(); ctx.moveTo(noseX, noseY + 2); ctx.lineTo(noseX, noseY + 5); ctx.moveTo(noseX - 4, noseY + 6); ctx.quadraticCurveTo(noseX + 1, noseY + 5, noseX + 6, noseY + 3); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(noseX + 3, noseY + 5); ctx.lineTo(noseX + 4, noseY + 9); ctx.lineTo(noseX + 5, noseY + 4.5); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(noseX, noseY + 2); ctx.lineTo(noseX, noseY + 5); ctx.moveTo(noseX - 5, noseY + 5); ctx.quadraticCurveTo(noseX, noseY + 8, noseX + 6, noseY + 4); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(noseX + 2, noseY + 6); ctx.lineTo(noseX + 3.5, noseY + 11); ctx.lineTo(noseX + 5, noseY + 5.5); ctx.fill();
    }
    ctx.strokeStyle = k === 'vex' ? '#5A4A70' : k === 'hex' ? '#D8C8D8' : c.dark;
    ctx.lineWidth = 0.8;
    const wX = noseX + 2, wY = noseY + 2;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(wX, wY + i * 2); ctx.lineTo(wX + 18, wY + i * 4 - 2); ctx.stroke();
    }
  }

  // ── Front Arm / Paw ──
  const armBaseX = b.bodyRX * 0.5;
  const armBaseY = bodyY - 3;
  const pawX = armBaseX + 12 + armExt;
  const pawY = armBaseY - 8 + Math.sin(armAng) * 5;

  ctx.strokeStyle = col(c.body);
  ctx.lineWidth = k === 'brutus' ? 8 : 6;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(armBaseX, armBaseY); ctx.lineTo(pawX, pawY); ctx.stroke();

  if (!flash) {
    const ax = pawX - armBaseX, ay = pawY - armBaseY, al = Math.hypot(ax, ay) || 1;
    const ux = ax / al, uy = ay / al;
    if (k === 'razor') {
      ctx.strokeStyle = c.bandage; ctx.lineWidth = 2.2;
      for (let t = 0.45; t < 0.95; t += 0.12) {
        const px = armBaseX + ux * al * t, py = armBaseY + uy * al * t;
        ctx.beginPath(); ctx.moveTo(px - uy * 3.5 + ux, py + ux * 3.5 + uy); ctx.lineTo(px + uy * 3.5 - ux, py - ux * 3.5 - uy); ctx.stroke();
      }
    } else if (k === 'vex') {
      ctx.strokeStyle = c.net; ctx.lineWidth = 0.8;
      for (let t = 0.2; t < 0.9; t += 0.09) {
        const px = armBaseX + ux * al * t, py = armBaseY + uy * al * t;
        ctx.beginPath(); ctx.moveTo(px - uy * 3, py + ux * 3); ctx.lineTo(px + ux * 5 + uy * 3, py + uy * 5 - ux * 3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px + uy * 3, py - ux * 3); ctx.lineTo(px + ux * 5 - uy * 3, py + uy * 5 + ux * 3); ctx.stroke();
      }
    } else if (k === 'hex') {
      ctx.save(); ctx.strokeStyle = c.magenta; ctx.shadowColor = c.magenta; ctx.shadowBlur = 5; ctx.lineWidth = 1; ctx.globalAlpha = 0.6 + Math.sin(gf * 0.12) * 0.3;
      ctx.beginPath(); ctx.moveTo(armBaseX + ux * 4, armBaseY + uy * 4); ctx.lineTo(pawX - ux * 5, pawY - uy * 5); ctx.stroke();
      ctx.restore();
    }
  }

  ctx.fillStyle = col(b.points ? c.dark : c.body);
  ctx.beginPath();
  ctx.arc(pawX, pawY, b.pawR, 0, Math.PI * 2);
  ctx.fill();

  if ((f.state === 'light' || f.state === 'heavy') && armExt > 15) {
    ctx.strokeStyle = col(k === 'hex' ? c.cyan : '#fff');
    ctx.lineWidth = 1.5;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(pawX + 5, pawY + i * 5); ctx.lineTo(pawX + 12, pawY + i * 7); ctx.stroke();
    }
    if (k === 'vex') {
      ctx.strokeStyle = c.eye; ctx.globalAlpha = 0.5; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(armBaseX, armBaseY - 6); ctx.quadraticCurveTo(pawX * 0.6, pawY - 16, pawX + 8, pawY - 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  if (f.state === 'special' && f.specActive && f.specData) {
    drawSpecialEffect(f);
  }

  ctx.restore();
  drawProjectiles(f);
}

function drawProjectiles(f) {
  const b = f.breed, c = b.color, gf = game.frame;
  const flash = f.flashTimer > 0 && Math.floor(f.stateFrame / 3) % 2 === 0;
  const col = (clr) => flash ? '#ffffff' : clr;
  if (f.specActive && f.specData && f.specData.type === 'furball') {
    for (const ball of f.specData.balls) {
      if (ball.hit) continue;
      ctx.save();
      ctx.translate(ball.x, ball.y);
      ctx.scale(ART, ART);
      ctx.rotate(gf * 0.3);
      ctx.shadowColor = b.specColor; ctx.shadowBlur = 14;
      ctx.fillStyle = b.specColor;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; const r = i % 2 ? 9 : 5; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = col(c.dark);
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, 7); ctx.fill();
      ctx.restore();
    }
  }
}

function spriteSeq(S, prefix) {
  if (!S.seq) S.seq = {};
  if (!S.seq[prefix]) {
    const arr = [];
    for (let i = 1; S.frames[prefix + '_' + i]; i++) arr.push(S.frames[prefix + '_' + i]);
    S.seq[prefix] = arr;
  }
  return S.seq[prefix];
}

function spriteIdle(f, S) {
  const a = spriteSeq(S, 'idle');
  if (f.breed.key === 'razor') return a[1] || a[0];
  return a[((game.frame / 32) | 0) % a.length];
}

function spritePose(f, S) {
  const sf = f.stateFrame, b = f.breed;
  const idle = spriteIdle(f, S);
  const at = (p, i) => { const a = spriteSeq(S, p); return a.length ? a[Math.max(0, Math.min(a.length - 1, i))] : idle; };
  const step = (p, rate, offset) => { const a = spriteSeq(S, p); return a.length ? a[Math.min(a.length - 1, ((sf - (offset || 0)) / rate) | 0)] : idle; };
  if (f.winPose && (f.state === 'idle' || f.state === 'walk')) return at('win', 0);
  switch (f.state) {
    case 'idle': return idle;
    case 'walk': { const a = spriteSeq(S, 'walk'); return a.length ? a[((sf / 7) | 0) % a.length] : idle; }
    case 'jump': case 'airborne': return at('jump', f.vy < 0 ? 0 : 1);
    case 'crouch': return at('crouch', 0);
    case 'light': return at('light', sf < b.lAtk.su ? 0 : 1);
    case 'heavy': return at('heavy', sf < b.hAtk.su ? 0 : 1);
    case 'special': return spriteSeq(S, 'special').length ? step('special', 8) : at('roar', 0);
    case 'hitstun': return step('hit', 6);
    case 'blockstun': return at('block', 0);
    case 'ko': { const hit = spriteSeq(S, 'hit'); if (sf < 8 && hit.length) return hit[hit.length - 1]; return step('ko', 8, 8); }
  }
  return idle;
}

function spriteScale(f, S) {
  if (!S.scale) { const a = spriteSeq(S, 'idle'); const ref = f.breed.key === 'razor' ? (a[1] || a[0]) : a[0]; S.scale = f.breed.spriteH / ref.h; }
  return S.scale;
}

function drawSpriteCat(f, S) {
  const b = f.breed, sf = f.stateFrame, gf = game.frame;
  const fr = spritePose(f, S);
  const flash = f.flashTimer > 0 && Math.floor(sf / 3) % 2 === 0;
  let bob = 0, sx = 1, sy = 1, rot = 0, ox = 0;
  const atk = f.state === 'light' ? b.lAtk : f.state === 'heavy' ? b.hAtk : null;
  const active = atk && sf >= atk.su && sf < atk.su + atk.ac;
  switch (f.state) {
    case 'idle': sy = 1 + Math.sin(sf * 0.08) * 0.012; sx = 1 - Math.sin(sf * 0.08) * 0.006; break;
    case 'walk': bob = -Math.abs(Math.sin(sf * 0.17)) * 4; rot = Math.sin(sf * 0.17) * 0.02; break;
    case 'jump': case 'airborne': rot = 0.06; break;
    case 'light': case 'heavy': ox = sf < atk.su ? -4 : active ? 8 : lerp(8, 0, (sf - atk.su - atk.ac) / atk.re); break;
    case 'special': sy = 1 + Math.sin(sf * 0.3) * 0.02; break;
    case 'hitstun': rot = -0.08 + Math.sin(sf * 0.5) * 0.03; ox = -3; break;
    case 'blockstun': ox = -2; break;
    case 'ko': ox = sf < 10 ? -6 : 0; break;
  }
  const sc = spriteScale(f, S);
  const w = fr.w * sc, h = fr.h * sc, fx = fr.fx * sc;

  ctx.save();
  ctx.translate(f.x, f.y);
  if (f.facing < 0) ctx.scale(-1, 1);
  // ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.beginPath(); ctx.ellipse(w * 0.05, GROUND_Y - f.y + 3, w * 0.3, 7, 0, 0, 7); ctx.fill();
  // afterimages
  if (!flash && (f.state === 'walk' && b.key === 'vex' || (f.state === 'special' && f.specData && f.specData.type === 'shadowDash'))) {
    for (let i = 1; i <= 3; i++) { ctx.globalAlpha = 0.18 / i; ctx.drawImage(fr.img, -fx - i * 14, -h, w, h); }
    ctx.globalAlpha = 1;
  }
  if (!flash && b.key === 'hex' && (gf % 150) < 4) {
    ctx.globalAlpha = 0.5;
    ctx.drawImage(whiteFrame(fr), -fx - 5, -h, w, h); ctx.drawImage(whiteFrame(fr), -fx + 5, -h, w, h);
    ctx.globalAlpha = 1;
  }
  ctx.translate(ox, bob); ctx.rotate(rot); ctx.scale(sx, sy);
  if (f.state === 'special' && !flash) { ctx.shadowColor = b.specColor; ctx.shadowBlur = 24 + Math.sin(gf * 0.4) * 8; }
  ctx.drawImage(fr.img, -fx, -h, w, h);
  ctx.shadowBlur = 0;
  if (flash) { ctx.globalAlpha = 0.7; ctx.drawImage(whiteFrame(fr), -fx, -h, w, h); ctx.globalAlpha = 1; }
  if (active && !flash) {
    ctx.save();
    ctx.strokeStyle = b.specColor; ctx.shadowColor = b.specColor; ctx.shadowBlur = 14;
    ctx.lineWidth = f.state === 'heavy' ? 6 : 4; ctx.lineCap = 'round'; ctx.globalAlpha = 0.75;
    ctx.beginPath(); ctx.arc(w * 0.3, -h * 0.55, h * (f.state === 'heavy' ? 0.42 : 0.34), -1.0, 0.45); ctx.stroke();
    ctx.restore();
  }
  if (f.state === 'special' && f.specActive && f.specData) { ctx.save(); ctx.scale(ART, ART); drawSpecialEffect(f); ctx.restore(); }
  ctx.restore();
}

function drawSpecialEffect(f) {
  const d = f.specData;
  const b = f.breed, c = b.color;
  if (d.type === 'shadowDash') {
    for (let i = 1; i <= 4; i++) {
      ctx.globalAlpha = 0.35 / i;
      ctx.fillStyle = i % 2 ? c.eye : '#0A0612';
      ctx.beginPath();
      ctx.ellipse(-i * 16, -42, b.bodyRX, b.bodyRY, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath(); ctx.arc(-i * 16 + 4, -72, b.headR, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (d.type === 'earthquake' && f.stateFrame >= 6 && f.stateFrame <= 15) {
    ctx.strokeStyle = b.specColor;
    ctx.lineWidth = 4;
    ctx.shadowColor = b.specColor; ctx.shadowBlur = 12;
    const r = (f.stateFrame - 6) * 18;
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.ellipse(0, 2, r, 8, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.ellipse(0, 2, r * 0.6, 5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  } else if (d.type === 'hypnoGaze' && f.stateFrame < 20) {
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const cc = i % 2 ? c.cyan : c.magenta;
      ctx.strokeStyle = cc; ctx.shadowColor = cc; ctx.shadowBlur = 8;
      ctx.globalAlpha = 0.7 - i * 0.12;
      const r = 5 + f.stateFrame * 2.5 + i * 12;
      ctx.beginPath(); ctx.arc(20, -70, r, -0.35, 0.35); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
}

function roundRect(cx, x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.lineTo(x + w - r, y);
  cx.arcTo(x + w, y, x + w, y + r, r);
  cx.lineTo(x + w, y + h - r);
  cx.arcTo(x + w, y + h, x + w - r, y + h, r);
  cx.lineTo(x + r, y + h);
  cx.arcTo(x, y + h, x, y + h - r, r);
  cx.lineTo(x, y + r);
  cx.arcTo(x, y, x + r, y, r);
  cx.fill();
}

function withCtx(c2d, fn) { const main = ctx; ctx = c2d; fn(); ctx = main; }
function makeLayer() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

function speckle(x, y, w, h, n, seed, colors, maxR, alpha) {
  const rng = srand(seed);
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = colors[Math.floor(rng() * colors.length)];
    ctx.globalAlpha = alpha * rng();
    ctx.beginPath(); ctx.arc(x + rng() * w, y + rng() * h, rng() * maxR + 0.3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function crackLines(x, y, n, len, seed, color, lw) {
  const rng = srand(seed);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    let px = x + (rng() - 0.5) * 20, py = y + (rng() - 0.5) * 20, a = rng() * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(px, py);
    const segs = 4 + Math.floor(rng() * 6);
    for (let s = 0; s < segs; s++) { a += (rng() - 0.5) * 1.2; const l = len * (0.4 + rng()); px += Math.cos(a) * l; py += Math.sin(a) * l; ctx.lineTo(px, py); }
    ctx.stroke();
  }
}

function drawStars(seed, n, maxY, color) {
  const rng = srand(seed);
  for (let i = 0; i < n; i++) {
    ctx.globalAlpha = 0.3 + rng() * 0.7; ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(rng() * W, rng() * maxY, rng() * 1.2 + 0.3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function glowBlob(x, y, r, color, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexAlpha(color, alpha)); g.addColorStop(1, hexAlpha(color, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawWorkLight(x, y, footY) {
  ctx.strokeStyle = '#3A3A3A'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y + 14); ctx.lineTo(x, footY - 70);
  ctx.moveTo(x, footY - 70); ctx.lineTo(x - 24, footY);
  ctx.moveTo(x, footY - 70); ctx.lineTo(x + 24, footY);
  ctx.moveTo(x, footY - 70); ctx.lineTo(x + 4, footY);
  ctx.stroke();
  ctx.fillStyle = '#2A2A2E'; roundRect(ctx, x - 24, y - 15, 48, 30, 3);
  ctx.save(); ctx.fillStyle = '#FFF3D0'; ctx.shadowColor = '#FFE8A0'; ctx.shadowBlur = 18;
  for (const [dx, dy] of [[-19, -11], [1, -11], [-19, 1], [1, 1]]) ctx.fillRect(x + dx, y + dy, 17, 9);
  ctx.restore();
}

function lightCone(x, y, tx, tw, alpha) {
  const g = ctx.createLinearGradient(x, y, tx, GROUND_Y);
  g.addColorStop(0, `rgba(255,240,200,${alpha})`); g.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y); ctx.lineTo(tx + tw, GROUND_Y + 50); ctx.lineTo(tx - tw, GROUND_Y + 50); ctx.fill();
}

function drawFire(x, y, w, gf, scale, seed) {
  const rng = srand(seed + (gf >> 1));
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const cols = ['#FF3A00', '#FF8A00', '#FFD060'];
  for (let i = 0; i < 7; i++) {
    const fx = x + (i - 3) * w / 7 + (rng() - 0.5) * 4;
    const h = (16 + rng() * 22 + Math.sin(gf * 0.3 + i * 1.7) * 6) * scale;
    for (let j = 0; j < 3; j++) {
      ctx.fillStyle = cols[j]; ctx.globalAlpha = 0.5 - j * 0.1;
      const hh = h * (1 - j * 0.3), ww = (w / 7) * (1 - j * 0.25);
      ctx.beginPath();
      ctx.moveTo(fx - ww, y);
      ctx.quadraticCurveTo(fx - ww * 0.5, y - hh * 0.6, fx + (rng() - 0.5) * 6, y - hh);
      ctx.quadraticCurveTo(fx + ww * 0.5, y - hh * 0.6, fx + ww, y);
      ctx.fill();
    }
  }
  ctx.restore();
  for (let i = 0; i < 6; i++) {
    const age = (gf + i * 41) % 120, t = age / 120;
    ctx.fillStyle = '#FFB050'; ctx.globalAlpha = (1 - t) * 0.8;
    ctx.beginPath(); ctx.arc(x + Math.sin(age * 0.1 + i) * 10 + (i - 3) * 5, y - 10 - age * 0.9 * scale, 1.5, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function smokeColumn(x, y, gf, seed, n, drift, color) {
  for (let i = 0; i < n; i++) {
    const age = (gf + i * 37 * ((seed % 5) + 1)) % 200, t = age / 200;
    ctx.fillStyle = color || '#C8C0C8'; ctx.globalAlpha = (1 - t) * 0.14 * Math.min(1, t * 6);
    ctx.beginPath(); ctx.arc(x + Math.sin(age * 0.04 + i + seed) * 10 + drift * age, y - age * 0.55, 6 + age * 0.14, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTireStack(x, y, n, rx) {
  rx = rx || 40;
  for (let i = 0; i < n; i++) {
    const ty = y - i * (rx * 0.5), ox = (i % 2) * 5;
    ctx.fillStyle = '#141414'; ctx.beginPath(); ctx.ellipse(x + ox, ty + 4, rx, rx * 0.36, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#1E1E1E'; ctx.fillRect(x + ox - rx, ty - rx * 0.25, rx * 2, rx * 0.3);
    ctx.beginPath(); ctx.ellipse(x + ox, ty - rx * 0.25, rx, rx * 0.36, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#2E2E2E'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x + ox, ty - rx * 0.25, rx * 0.92, rx * 0.3, 0, 0, 7); ctx.stroke();
    ctx.fillStyle = '#0A0A0A'; ctx.beginPath(); ctx.ellipse(x + ox, ty - rx * 0.25, rx * 0.42, rx * 0.15, 0, 0, 7); ctx.fill();
  }
}

function drawOilDrum(x, y, w, h, base, band) {
  ctx.fillStyle = base; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = band;
  for (const t of [0.15, 0.5, 0.85]) ctx.fillRect(x, y + h * t - 3, w, 6);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x + w * 0.7, y, w * 0.3, h);
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(x + w * 0.1, y, w * 0.12, h);
  ctx.fillStyle = '#1A0E08'; ctx.beginPath(); ctx.ellipse(x + w / 2, y, w / 2, w * 0.18, 0, 0, 7); ctx.fill();
  speckle(x, y, w, h, 40, x * 7 + y, ['#8B4513', '#5A2A10', '#A0522D'], 3, 0.5);
}

function drawCloth(x, y, w, h, color, seed) {
  const rng = srand(seed);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y);
  ctx.lineTo(x + w + (rng() - 0.5) * 8, y + h);
  for (let px = x + w; px > x; px -= 16) ctx.lineTo(px - 8, y + h + (rng() - 0.3) * 10);
  ctx.lineTo(x + (rng() - 0.5) * 8, y + h); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
  for (let i = 1; i < 4; i++) { const fx = x + w * i / 4 + (rng() - 0.5) * 10; ctx.beginPath(); ctx.moveTo(fx, y); ctx.quadraticCurveTo(fx + (rng() - 0.5) * 12, y + h / 2, fx + (rng() - 0.5) * 8, y + h); ctx.stroke(); }
}

function paintedRing(cx, cy, rx, ry, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 28; ctx.lineWidth = 5; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.stroke();
  ctx.shadowBlur = 0; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.35; ctx.strokeStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(cx, cy, rx * 0.93, ry * 0.9, 0, 0, 7); ctx.stroke();
  ctx.restore();
}

function puddle(x, y, rx, ry, reflect) {
  ctx.fillStyle = '#100C14'; ctx.globalAlpha = 0.8;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
  ctx.fillStyle = reflect; ctx.globalAlpha = 0.22;
  ctx.beginPath(); ctx.ellipse(x, y + 1, rx * 0.8, ry * 0.5, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}

function floorTiles(color, line, seed, topY) {
  const ty = topY == null ? GROUND_Y : topY;
  ctx.fillStyle = color; ctx.fillRect(0, ty, W, H - ty);
  const sh = ctx.createLinearGradient(0, ty, 0, ty + 90); sh.addColorStop(0, 'rgba(0,0,0,0.45)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh; ctx.fillRect(0, ty, W, 90);
  ctx.strokeStyle = line; ctx.lineWidth = 1;
  for (let k = 0; k < 9; k++) { const y = ty + k * k * 3.2 + 6; if (y > H) break; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const sq = (H - ty) / 260;
  for (let x = -600; x <= W + 600; x += 120) { ctx.beginPath(); ctx.moveTo(W / 2 + (x - W / 2) * (0.25 * (1 - sq) + 0.05), ty); ctx.lineTo(x, H); ctx.stroke(); }
  speckle(0, ty, W, H - ty, 500, seed, ['#000', '#fff'], 1.5, 0.12);
}

function drawChainFence(x, y, w, h, postSp, color, postColor) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x, y, w, h);
  drawChainLink(x, y, w, h, 13, color, 0.75);
  ctx.strokeStyle = postColor; ctx.lineWidth = 4;
  for (let px = x; px <= x + w; px += postSp) { ctx.beginPath(); ctx.moveTo(px, y - 4); ctx.lineTo(px, y + h); ctx.stroke(); }
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) { const bx = x + w * (0.22 + i * 0.3), by = y + h * 0.45; ctx.beginPath(); ctx.ellipse(bx, by, 22 + i * 6, 14, 0.3, 0, 7); ctx.stroke(); }
}

function drawCrate(x, y, w, h, color) {
  ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y + h); ctx.moveTo(x + w, y); ctx.lineTo(x, y + h); ctx.stroke();
}

function drawSpeaker(x, y, w, h) {
  ctx.fillStyle = '#141416'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#2A2A2E'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  for (const [cy, r] of [[y + h * 0.3, w * 0.22], [y + h * 0.7, w * 0.3]]) {
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(x + w / 2, cy, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#0A0A0A'; ctx.beginPath(); ctx.arc(x + w / 2, cy, r * 0.55, 0, 7); ctx.fill();
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(x + w / 2, cy, r * 0.2, 0, 7); ctx.fill();
  }
}

//  Stage 1 — THE PIT
// ═══════════════════════════════════════════════════════════════════

const pitCrowd = (() => {
  const rng = srand(4242), arr = [];
  for (let i = 0; i < 46; i++) arr.push({ x: rng() * W, y: 336 + rng() * 10, s: 0.8 + rng() * 0.45, ph: rng() * 6.28, eye: ['#FF2E63', '#08D9D6', '#FFB040', '#B8FF00'][Math.floor(rng() * 4)], phone: rng() < 0.28, arm: rng() < 0.5 });
  return arr;
})();

function pitBack() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0C0C12'); g.addColorStop(0.5, '#181822'); g.addColorStop(1, '#1E1E2C');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  speckle(0, 0, W, H, 900, 11, ['#000', '#fff', '#4A4A5A'], 1.6, 0.14);
  // water stains
  const rng = srand(77);
  for (let i = 0; i < 14; i++) {
    const sx = rng() * W, sw = 6 + rng() * 22, sh = 60 + rng() * 200;
    const sg = ctx.createLinearGradient(0, 40, 0, 40 + sh); sg.addColorStop(0, 'rgba(0,0,0,0.35)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg; ctx.fillRect(sx, 40, sw, sh);

function pitMid(gf) {
  // light cones (right one flickers)

  // dust motes

  ctx.fillStyle = '#FFF8E0';
