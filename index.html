<canvas id="c"></canvas>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
//  CATFIGHTER — Tunable Constants
// ═══════════════════════════════════════════════════════════════════

const W = 960, H = 540;
const TIMESTEP = 1000 / 60;          // 16.67ms fixed step
const GRAVITY = 0.58;                // gravity per frame
const GROUND_Y = 430;                // ground plane Y coordinate
const STAGE_L = 50;                  // left wall
const STAGE_R = W - 50;             // right wall
const AIR_CTRL = 0.65;              // air movement multiplier
const GROUND_FRIC = 0.82;           // ground friction
const PUSH_APART = 2.5;             // push fighters apart when overlapping
const HIT_PAUSE = 5;                // frames frozen on light hit
const HEAVY_PAUSE = 9;              // frames frozen on heavy hit
const KO_PAUSE = 35;                // frames frozen on KO
const SHAKE_DECAY = 0.82;           // screen shake falloff
const MAX_SHAKE = 14;               // max shake pixels
const ROUND_TIME = 60;              // seconds per round
const WINS_NEEDED = 2;              // rounds to win match
const SPECIAL_MAX = 100;            // special meter capacity
const SPECIAL_GAIN_DEAL = 14;       // meter gain on dealing damage
const SPECIAL_GAIN_TAKE = 10;       // meter gain on receiving damage
const BLOCK_DMG = 0.15;             // damage multiplier when blocking
const BLOCK_KB = 0.25;              // knockback multiplier when blocking
const PARTICLE_CAP = 120;           // max particles on screen
const GUARD_MAX = 100;              // guard meter capacity
const GUARD_COST = 10;              // guard lost per blocked hit, on top of the hit's damage
const GUARD_REGEN = 0.6;            // guard regained per frame once the pressure is off
const GUARD_REGEN_DELAY = 70;       // frames after a blocked hit before guard starts to recover
const GUARD_BREAK_STUN = 55;        // frames a fighter stands defenceless after a guard break
const COMBO_SCALE = 0.12;           // damage lost for every hit already in the combo
const COMBO_MIN_SCALE = 0.4;        // floor for that scaling
const COMBO_STUN_DECAY = 2;         // hitstun frames lost per hit after the third, so combos end
const COMBO_SHOW = 80;              // frames the combo counter stays up after the last hit
const CPU_MAX_LEVEL = 8;            // CPU level reached on a 7-win streak
const MASTER_VOL = 0.8;             // overall sound volume
const MAX_RENDER_SCALE = 2;         // cap on internal resolution (x 960x540)
const LOAD_TRIES = 3;               // attempts per art file before the load counts as failed
const ART = 2.18;                   // fighter body scale: breed sizes below are in sprite-art units
const MOVE_SCALE = 1.3;             // walk speed multiplier for the larger fighters
const JUMP_SCALE = 1.2;             // jump velocity multiplier for the larger fighters

// ═══════════════════════════════════════════════════════════════════
//  Canvas & Globals
// ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');
let RS = 1;   // render scale: backing-store pixels per game unit

// shadowBlur ignores the canvas transform, so scale it with the render scale
const sbDesc = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'shadowBlur');
Object.defineProperty(ctx, 'shadowBlur', { get() { return sbDesc.get.call(this) / RS; }, set(v) { sbDesc.set.call(this, v * RS); } });

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
  const pw = Math.round(W * Math.min(MAX_RENDER_SCALE, Math.max(1, s * (window.devicePixelRatio || 1))));
  if (canvas.width !== pw) { canvas.width = pw; canvas.height = Math.round(pw * H / W); }
  RS = canvas.width / W;
}
resize();
addEventListener('resize', resize);

let audioCtx = null, masterGain = null;
let muted = false;
try { muted = localStorage.getItem('catfighter_muted') === '1'; } catch (e) {}
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : MASTER_VOL;
    const comp = audioCtx.createDynamicsCompressor();
    masterGain.connect(comp); comp.connect(audioCtx.destination);
    for (const n in sndRaw) decodeSound(n);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function toggleMute() {
  muted = !muted;
  if (masterGain) masterGain.gain.value = muted ? 0 : MASTER_VOL;
  try { localStorage.setItem('catfighter_muted', muted ? '1' : '0'); } catch (e) {}
}

// asset load tracking for the loading screen
const loadState = { total: 0, done: 0, failed: [], seen: 0, idle: 0 };
function trackLoad() {
  loadState.total++;
  let fin = false;
  return () => { if (!fin) { fin = true; loadState.done++; } };
}

// ═══════════════════════════════════════════════════════════════════
//  Palette
// ═══════════════════════════════════════════════════════════════════

const P = {
  p1: '#ff2e63', p2: '#08d9d6',
  gold: '#f5c518', ko: '#ff0044', ink: '#08060a',
  spark: '#ffffcc', blockSpark: '#88eeff',
};

const F_SPRAY = 'Impact, "Arial Black", "Franklin Gothic Medium", sans-serif';
const F_SCRATCH = '"Trebuchet MS", "Segoe UI", Verdana, sans-serif';
const F_MONO = 'monospace';

// ═══════════════════════════════════════════════════════════════════
//  Utility
// ═══════════════════════════════════════════════════════════════════

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }
function rndInt(lo, hi) { return Math.floor(rnd(lo, hi + 1)); }
function srand(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// ═══════════════════════════════════════════════════════════════════
//  Punk Text & Stencil Helpers
// ═══════════════════════════════════════════════════════════════════

// Spray-painted lettering: jittered letters, thick stencil outline, drips, overspray
function sprayText(text, x, y, size, color, o = {}) {
  const rng = srand(o.seed || (text.length * 131 + size));
  ctx.save();
  ctx.font = `${size}px ${F_SPRAY}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  const spacing = o.spacing == null ? size * 0.04 : o.spacing;
  const widths = [...text].map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + (text.length - 1) * spacing;
  let cx = o.align === 'left' ? x : o.align === 'right' ? x - total : x - total / 2;
  const jit = o.jitter || 0;
  if (o.rotate) { ctx.translate(x, y); ctx.rotate(o.rotate); ctx.translate(-x, -y); }
  if (o.speckle !== false) {
    ctx.fillStyle = color;
    for (let i = 0; i < text.length * 5; i++) {
      ctx.globalAlpha = 0.15 + rng() * 0.3;
      const sx = cx + rng() * total + (rng() - 0.5) * size * 0.6;
      const sy = y - size * 0.8 + rng() * size * 1.2;
      ctx.beginPath(); ctx.arc(sx, sy, rng() * size * 0.03 + 0.5, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], w = widths[i];
    if (ch === ' ') { cx += w + spacing; continue; }
    const rot = (rng() - 0.5) * 0.14, sc = 0.9 + rng() * 0.2, dy = (rng() - 0.5) * size * 0.1;
    const jx = jit ? (Math.random() - 0.5) * jit : 0, jy = jit ? (Math.random() - 0.5) * jit : 0;
    ctx.save();
    ctx.translate(cx + w / 2 + jx, y + dy + jy);
    ctx.rotate(rot); ctx.scale(sc, sc);
    if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(ch, -w / 2 + size * 0.06, size * 0.06); }
    if (o.outline !== false) {
      ctx.lineWidth = size * 0.09; ctx.strokeStyle = o.outline || P.ink;
      ctx.strokeText(ch, -w / 2, 0);
    }
    if (o.glow) { ctx.shadowColor = o.glowColor || color; ctx.shadowBlur = o.glow; }
    ctx.fillStyle = color;
    ctx.fillText(ch, -w / 2, 0);
    ctx.shadowBlur = 0;
    if (o.drips !== false && rng() < 0.5) {
      const dx = -w / 2 + size * 0.1 + rng() * (w - size * 0.2), len = size * (0.12 + rng() * 0.4), th = size * 0.035;
      ctx.fillRect(dx - th / 2, -size * 0.05, th, len);
      ctx.beginPath(); ctx.arc(dx, len - size * 0.05, th * 0.9, 0, 7); ctx.fill();
    }
    ctx.restore();
    cx += w + spacing;
  }
  ctx.restore();
}

// Heavy outlined label for in-fight callouts; readable over a busy backdrop whatever fonts the device has
function tagText(text, x, y, size, color) {
  ctx.save();
  ctx.font = `italic 900 ${size}px ${F_SCRATCH}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.24; ctx.strokeStyle = P.ink;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// Knife-scratched / marker lettering
function scratchText(text, x, y, size, color, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 'bold'} ${size}px ${F_SCRATCH}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'alphabetic';
  if (o.rotate) { ctx.translate(x, y); ctx.rotate(o.rotate); ctx.translate(-x, -y); }
  ctx.transform(1, 0, o.skew == null ? -0.18 : o.skew, 1, 0, 0);
  const sx = x + y * (o.skew == null ? 0.18 : -o.skew);
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.45;
  ctx.fillText(text, sx + 1, y + 1);
  ctx.fillText(text, sx - 1, y);
  ctx.globalAlpha = 1;
  ctx.fillText(text, sx, y);
  if (o.underline) {
    const w = ctx.measureText(text).width;
    const lx = o.align === 'left' ? sx : o.align === 'right' ? sx - w : sx - w / 2;
    ctx.strokeStyle = color; ctx.lineWidth = size * 0.06; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(lx, y + size * 0.22);
    ctx.quadraticCurveTo(lx + w * 0.5, y + size * 0.32, lx + w, y + size * 0.2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawChainLink(x, y, w, h, sp, color, alpha) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.globalAlpha = alpha;
  ctx.beginPath();
  for (let i = -h; i < w + h; i += sp) {
    ctx.moveTo(x + i, y); ctx.lineTo(x + i + h, y + h);
    ctx.moveTo(x + i, y); ctx.lineTo(x + i - h, y + h);
  }
  ctx.stroke();
  ctx.restore();
}

function drawSafetyPin(x, y, rot, color) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-9, -2); ctx.lineTo(9, -2); ctx.moveTo(-9, 3); ctx.lineTo(7, 3); ctx.stroke();
  ctx.beginPath(); ctx.arc(-10, 0.5, 3, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = color; ctx.fillRect(7, -4, 4, 8);
  ctx.restore();
}

function rectsHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ═══════════════════════════════════════════════════════════════════
//  Sound Engine (Web Audio API)
// ═══════════════════════════════════════════════════════════════════

// recorded clips (assets/sfx, see CREDITS.md there); the synth below is the fallback
const SND_NAMES = ['punch_1','punch_2','punch_3','hit_1','hit_2','hit_3','ko','block_1','block_2','land',
  'swish_1','swish_2','swish_3','swoosh_1','swoosh_2','jump','bell','ding','gong',
  'growl_1','growl_2','growl_3','growl_4','meow','mew','magic','spell','quake','boom',
  'ui_move','ui_select','ui_back','ui_pause','tick','crowd','applause'];
const SND = {}, sndRaw = {};

function decodeSound(name) {
  const raw = sndRaw[name];
  delete sndRaw[name];
  audioCtx.decodeAudioData(raw, buf => { SND[name] = buf; }, () => {});
}
function loadSounds() {
  if (location.protocol === 'file:') return;   // fetch can't read local files; the synth plays instead
  for (const name of SND_NAMES) {
    const done = trackLoad();
    fetch(`assets/sfx/${name}.mp3`)
      .then(r => r.ok ? r.arrayBuffer() : null)
      .then(buf => { if (buf) { sndRaw[name] = buf; if (audioCtx) decodeSound(name); } })
      .catch(() => {})
      .then(done);
  }
}
loadSounds();

// o: vol, rate (pitch), vary (random pitch spread), delay (seconds)
function playSnd(name, o = {}) {
  const buf = SND[name];
  if (!buf || !audioCtx) return false;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = (o.rate || 1) * (1 + (Math.random() - 0.5) * (o.vary || 0));
  const gain = audioCtx.createGain();
  gain.gain.value = o.vol == null ? 1 : o.vol;
  src.connect(gain); gain.connect(masterGain);
  src.start(audioCtx.currentTime + (o.delay || 0));
  return true;
}
function pick(base, n) { return base + '_' + (1 + Math.floor(Math.random() * n)); }

let noiseBuffer = null;
function getNoiseBuffer() {
  if (noiseBuffer) return noiseBuffer;
  ensureAudio();
  const len = audioCtx.sampleRate * 0.5;
  noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return noiseBuffer;
}

function playNoise(freq, dur, vol, q) {
  ensureAudio();
  const src = audioCtx.createBufferSource();
  src.buffer = getNoiseBuffer();
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = freq; filt.Q.value = q || 2;
  const gain = audioCtx.createGain();
  const t = audioCtx.currentTime;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filt); filt.connect(gain); gain.connect(masterGain);
  src.start(t); src.stop(t + dur);
}

function playTone(freq, dur, vol, type, slide) {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  osc.type = type || 'sine';
  const t = audioCtx.currentTime;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(t); osc.stop(t + dur);
}

// f = the fighter making the sound; its breed.voice pitches the cat noises
const SFX = {
  swing(heavy) {
    if (heavy) playSnd(pick('swoosh', 2), { vol: 0.7, vary: 0.2 });
    else playSnd(pick('swish', 3), { vol: 0.55, vary: 0.25 });
  },
  hitLight() {
    if (!playSnd(pick('punch', 3), { vol: 0.9, vary: 0.16 })) { playNoise(900, 0.08, 0.35, 3); playTone(300, 0.06, 0.15, 'square'); }
  },
  hitHeavy(f) {
    if (!playSnd(pick('hit', 3), { vary: 0.12 })) { playNoise(500, 0.15, 0.45, 2); playTone(150, 0.12, 0.2, 'sawtooth'); return; }
    if (f && Math.random() < 0.6) playSnd(pick('growl', 4), { vol: 0.5, rate: f.breed.voice, vary: 0.1, delay: 0.05 });
  },
  block() {
    if (!playSnd(pick('block', 2), { vol: 0.8, vary: 0.2 })) { playTone(1200, 0.05, 0.2, 'square'); playTone(800, 0.04, 0.15, 'sine'); }
  },
  guardBreak() {
    if (playSnd('block_1', { rate: 0.6 })) playSnd('boom', { vol: 0.5, rate: 1.6 });
    else { playNoise(300, 0.25, 0.4, 2); playTone(200, 0.3, 0.25, 'sawtooth', 60); }
  },
  jump() { if (!playSnd('jump', { vol: 0.45, vary: 0.2 })) playTone(400, 0.1, 0.12, 'sine', 800); },
  land() { if (!playSnd('land', { vol: 0.5, vary: 0.2 })) playNoise(200, 0.06, 0.15, 1); },
  special(f) {
    const voice = f.breed.voice;
    let ok;
    switch (f.breed.specType) {
      case 'furball':    ok = playSnd(pick('growl', 4), { vol: 0.8, rate: voice }); playSnd('swoosh_1', { vol: 0.8, rate: 0.7, delay: 0.05 }); break;
      case 'shadowDash': ok = playSnd('swoosh_2', { rate: 0.45 }); playSnd('magic', { vol: 0.35, rate: 1.4 }); break;
      case 'earthquake': ok = playSnd(pick('growl', 4), { rate: voice }); break;
      case 'hypnoGaze':  ok = playSnd('spell', { vol: 0.8, rate: 1.3 }); playSnd('magic', { vol: 0.5 }); break;
    }
    if (!ok) { playTone(500, 0.3, 0.2, 'sawtooth', 1200); playTone(700, 0.3, 0.15, 'sine', 1400); }
  },
  quake() { if (playSnd('quake')) playSnd('boom', { vol: 0.8, rate: 0.7 }); else playNoise(120, 0.3, 0.5, 1); },
  ko(f) {
    if (!playSnd('ko')) { playTone(600, 0.5, 0.3, 'sawtooth', 80); playNoise(300, 0.4, 0.25, 1); return; }
    playSnd('meow', { vol: 0.8, rate: f.breed.voice * 0.6, delay: 0.1 });
    playSnd('crowd', { vol: 0.7, delay: 0.2 });
  },
  bell()  { if (!playSnd('bell', { vol: 0.8 })) { playTone(800, 0.6, 0.2, 'sine'); playTone(1200, 0.4, 0.1, 'sine'); } },
  fight() { if (!playSnd('gong', { vol: 0.9 })) { playTone(660, 0.5, 0.2, 'sine'); playTone(990, 0.4, 0.12, 'sine'); } },
  ready() { playSnd('ding', { vol: 0.5 }); },
  tick()  { if (!playSnd('tick', { vol: 0.7 })) playTone(1000, 0.03, 0.06, 'square'); },
  select() { if (!playSnd('ui_select', { vol: 0.5 })) playTone(660, 0.08, 0.15, 'square'); },
  move()   { if (!playSnd('ui_move', { vol: 0.6 })) playTone(440, 0.04, 0.08, 'square'); },
  back()   { if (!playSnd('ui_back', { vol: 0.7 })) playTone(330, 0.05, 0.08, 'square'); },
  pause()  { if (!playSnd('ui_pause', { vol: 0.7 })) playTone(520, 0.08, 0.15, 'square'); },
  meow(breed) {   // the small, high-voiced cats get the kitten clip
    if (breed.voice > 1.1) playSnd('mew', { vol: 0.75, rate: breed.voice * 0.75, vary: 0.06 });
    else playSnd('meow', { vol: 0.7, rate: breed.voice, vary: 0.06 });
  },
  win(f) {
    if (!playSnd('applause')) { playTone(523, 0.15, 0.2, 'square'); setTimeout(() => playTone(659, 0.15, 0.2, 'square'), 150); setTimeout(() => playTone(784, 0.3, 0.25, 'square'), 300); return; }
    playSnd('meow', { vol: 0.8, rate: f.breed.voice, delay: 0.3 });
  },
};

// ═══════════════════════════════════════════════════════════════════
//  Particles
// ═══════════════════════════════════════════════════════════════════

const particles = [];

function spawnParts(x, y, count, color, speed, life, size) {
  for (let i = 0; i < count; i++) {
    const a = rnd(0, Math.PI * 2);
    const s = speed * rnd(0.4, 1);
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - rnd(1,3),
      life: life * rnd(0.6, 1), max: life,
      color, size: (size||3) * rnd(0.6, 1.4),
    });
  }
  while (particles.length > PARTICLE_CAP) particles.shift();
}

function spawnHitSparks(x, y, dir) {
  for (let i = 0; i < 8; i++) {
    const a = rnd(-0.6, 0.6) + (dir > 0 ? 0 : Math.PI);
    const s = rnd(3, 8);
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - rnd(1,4),
      life: rnd(8,16), max: 16, color: P.spark, size: rnd(2,5),
    });
  }
  spawnParts(x, y, 5, P.p1, 4, 12, 2);
}

function updateParticles() {
  updateHitFx();
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.15;
    p.vx *= 0.97;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    const s = p.size * (0.5 + a * 0.5);
    ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════════
//  Screen Shake
// ═══════════════════════════════════════════════════════════════════

let shakeAmt = 0;
function addShake(amt) { shakeAmt = Math.min(shakeAmt + amt, MAX_SHAKE); }
function getShake() {
  if (shakeAmt < 0.5) return {x:0, y:0};
  const x = rnd(-shakeAmt, shakeAmt);
  const y = rnd(-shakeAmt, shakeAmt);
  shakeAmt *= SHAKE_DECAY;
  return {x, y};
}

// ═══════════════════════════════════════════════════════════════════
//  Input
// ═══════════════════════════════════════════════════════════════════

const keys = {};
const justPressed = {};
addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
  ensureAudio();
  if (e.code === 'KeyM' && !e.repeat && !game.controlsWaiting && !keyIsBound('KeyM')) toggleMute();
  // keep browser shortcuts (Ctrl+R, F5, F12...) working
  const shortcut = (e.ctrlKey || e.metaKey) && !/^(Control|Meta)/.test(e.code);
  if (!shortcut && !/^F\d+$/.test(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && game.state === 'fighting') { game.state = 'paused'; game.pauseMenu = 0; }
});

function wasPressed(code) { return !!justPressed[code]; }
function isDown(code) { return !!keys[code]; }
function clearJustPressed() { for (const k in justPressed) delete justPressed[k]; }
function lastKeyPressed() {
  for (const k in justPressed) { if (justPressed[k]) return k; }
  return null;
}

let bindings = loadBindings();
function loadBindings() {
  try {
    const s = localStorage.getItem('catfighter_bindings');
    if (s) {
      const b = JSON.parse(s);
      if (b.p1 && b.p2) { for (const p of ['p1', 'p2']) if (!b[p].block) b[p].block = DEFAULT_BINDINGS[p].block; return b; }
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_BINDINGS));
}
function keyIsBound(code) {
  return ['p1', 'p2'].some(pl => Object.values(bindings[pl]).includes(code));
}
function saveBindings() {
  try { localStorage.setItem('catfighter_bindings', JSON.stringify(bindings)); } catch(e) {}
}

function btnActive(btn) {
  const s = game.state;
  if (btn.id === 'pause') return s === 'fighting' || s === 'roundIntro' || s === 'paused';
  if (btn.id === 'confirm') return s === 'modeSelect' || s === 'charSelect' || s === 'stageSelect';
  return s === 'fighting' || s === 'roundIntro';
}
function btnHit(btn, x, y) { return btnActive(btn) && Math.hypot(x - btn.x, y - btn.y) < btn.r * 1.3; }
function canvasPos(p) {
  const rect = canvas.getBoundingClientRect();
  return { x: (p.clientX - rect.left) / rect.width * W, y: (p.clientY - rect.top) / rect.height * H };
}

function handleTouches(e) {
  e.preventDefault();
  ensureAudio();
  touchActive = true;
  const prev = {};
  for (const k in touchJust) prev[k] = touch[k];
  for (const k in touch) touch[k] = false;
  if (e.type === 'touchstart') {
    for (const t of e.changedTouches) {
      const pos = canvasPos(t);
      if (!TBTN.some(btn => btnHit(btn, pos.x, pos.y))) tapPos = pos;
    }
  }
  for (const t of e.touches) {
    const pos = canvasPos(t);
    touch.any = true;
    for (const btn of TBTN) {
      if (btnHit(btn, pos.x, pos.y)) touch[btn.id] = true;
    }
  }
  for (const k in touchJust) {
    if (touch[k] && !prev[k]) touchJust[k] = true;
  }
}
canvas.addEventListener('touchstart', handleTouches, {passive:false});
canvas.addEventListener('touchmove', handleTouches, {passive:false});
canvas.addEventListener('touchend', handleTouches, {passive:false});
canvas.addEventListener('touchcancel', handleTouches, {passive:false});
canvas.addEventListener('mousedown', e => {
  ensureAudio();
  tapPos = canvasPos(e);
  touchJust.any = true;
});

function drawTouchUI() {
  if (!touchActive) return;
  for (const btn of TBTN) {
    if (!btnActive(btn)) continue;
    const pressed = touch[btn.id];
    const heavyPulse = btn.id === 'heavy' ? 22 + Math.sin(game.frame * 0.15) * 8 : 0;
    drawImg('ui_' + btn.art, btn.x, btn.y, btn.r * 2.2, { alpha: pressed ? 1 : 0.8, scale: pressed ? 1.12 : 1, flip: btn.id === 'left', glow: heavyPulse ? P.p1 : null, blur: heavyPulse });
  }
}

// Merged input for P1 (keyboard + touch)
function p1Input() {
  return {
    left: P1.left() || touch.left,
    right: P1.right() || touch.right,
    up: P1.up() || touch.up,
    down: P1.down() || touch.down,
    light: P1.light() || touchJust.light,
    heavy: P1.heavy() || touchJust.heavy,
    special: P1.special() || touchJust.special,
    block: P1.block() || touch.block,
  };
}

// nothing can be drawn without the art, so a failed request is retried before it counts as missing
function fetchImage(src, onload) {
  const done = trackLoad();
  let tries = 0;
  (function attempt() {
    const im = new Image();
    im.onload = () => { onload(im); done(); };
    im.onerror = () => {
      if (++tries < LOAD_TRIES) setTimeout(attempt, 500 * tries);
      else { loadState.failed.push(src); done(); }
    };
    im.src = src;
  })();
}
function loadImage(key, src) { fetchImage(src, im => { ASSETS.images[key] = im; }); }
function img(key) { return ASSETS.images[key]; }

// a fighter's frames: assets/fighters/<key>/manifest.js lists them with their size and foot position
function loadSprites(key) {
  const s = document.createElement('script'), manifestDone = trackLoad();
  s.src = `assets/fighters/${key}/manifest.js`;
  s.onerror = () => { loadState.failed.push(s.src); manifestDone(); };
  s.onload = () => {
    const man = SPRITE_MANIFEST[key], set = { frames: {} };
    for (const name in man) {
      fetchImage(`assets/fighters/${key}/${name}.png`, im => { set.frames[name] = { img: im, w: man[name].w, h: man[name].h, fx: man[name].fx, white: null }; });
    }
    ASSETS.sprites[key] = set;
    manifestDone();
  };
  document.head.appendChild(s);
}

// draw an image centred at (cx,cy) with a target height, keeping aspect
function drawImg(key, cx, cy, h, o = {}) {
  const im = img(key);
  if (!im) return;
  const s = h / im.height, w = im.width * s;
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.add) ctx.globalCompositeOperation = 'lighter';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 18; }
  ctx.translate(cx + (o.dx || 0), cy + (o.dy || 0));
  if (o.rot) ctx.rotate(o.rot);
  if (o.scale) ctx.scale(o.scale, o.scale);
  if (o.flip) ctx.scale(-1, 1);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}

// sprite hit effects
const hitFx = [];
function spawnHitFx(key, x, y, size, life, o = {}) {
  hitFx.push({ key, x, y, size, life, t: 0, rot: o.rot != null ? o.rot : Math.random() * 6.28, add: o.add !== false, grow: o.grow == null ? 0.9 : o.grow, spin: o.spin == null ? 0.3 : o.spin, dy: o.dy || 0 });
}
function updateHitFx() {
  for (let i = hitFx.length - 1; i >= 0; i--) { hitFx[i].t++; if (hitFx[i].t >= hitFx[i].life) hitFx.splice(i, 1); }
  for (let i = popups.length - 1; i >= 0; i--) { if (++popups[i].t >= popups[i].life) popups.splice(i, 1); }
}
function drawHitFx() {
  for (const f of hitFx) {
    const k = f.t / f.life;
    drawImg(f.key, f.x, f.y + f.dy * k, f.size * (0.55 + k * f.grow), { alpha: 1 - k * k, add: f.add, rot: f.rot + k * f.spin });
  }
  for (const p of popups) {
    const k = p.t / p.life, pop = 1 + Math.max(0, 6 - p.t) * 0.08;
    ctx.save();
    ctx.globalAlpha = Math.min(1, (1 - k) * 3);
    ctx.translate(p.x, p.y - k * 26); ctx.scale(pop, pop);
    tagText(p.text, 0, 0, 34, p.color);
    ctx.restore();
  }
}

// short callouts that pop up, rise and fade
const popups = [];
function spawnPopup(text, x, y, color) {
  popups.push({ text, x: clamp(x, 130, W - 130), y: Math.max(y, 130), color, t: 0, life: 55 });
}


function whiteFrame(fr) {
  if (!fr.white) {
    const c = document.createElement('canvas'); c.width = fr.w; c.height = fr.h;
    const g = c.getContext('2d');
    g.drawImage(fr.img, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = '#fff'; g.fillRect(0, 0, fr.w, fr.h);
    fr.white = c;
  }
  return fr.white;
}

function createFighter(breedKey, startX, facing) {
  const b = BREEDS[breedKey];
  return {
    breed: b, breedKey,
    x: startX, y: GROUND_Y,
    vx: 0, vy: 0,
    facing, // 1=right, -1=left
    state: 'idle', stateFrame: 0,
    hp: b.hp, maxHp: b.hp, displayHp: b.hp,
    special: 0,
    wins: 0,
    grounded: true,
    hitThisAtk: false,
    hitstunTime: 0,
    blockstunTime: 0,
    invincible: 0,
    flashTimer: 0,
    guard: GUARD_MAX, guardDelay: 0, dizzyTime: 0,
    comboCount: 0, comboDmg: 0,              // hits and damage taken in the combo this fighter is caught in
    combo: { hits: 0, dmg: 0, life: 0 },     // the combo this fighter is dealing, for the on-screen counter
    // special move projectile/state
    specActive: false, specData: null,
    currentInput: { left:false, right:false, up:false, down:false, light:false, heavy:false, special:false, block:false },
    winPose: false, atkKind: 'stand', airAtk: false,
  };
}

function fighterHurtbox(f) {
  const b = f.breed;
  const crouchMod = f.state === 'crouch' ? 0.6 : 1;
  const w = (b.bodyRX * 2 + 8) * ART;
  const h = (b.bodyRY * 2 + b.headR * 2 + 20) * crouchMod * ART;
  return { x: f.x - w/2, y: f.y - h, w, h };
}

function fighterAtkHitbox(f) {
  const atk = f.state === 'light' ? f.breed.lAtk : f.state === 'heavy' ? f.breed.hAtk : null;
  if (!atk) return null;
  const su = atk.su, ac = atk.ac;
  if (f.stateFrame < su || f.stateFrame >= su + ac) return null;
  const ox = f.facing * (f.breed.bodyRX + 5) * ART;
  let rx = atk.rx * ART, ry = atk.ry * ART;
  let y = f.y - (f.breed.bodyRY * 2 + f.breed.headR + 5) * ART;
  if (f.atkKind === 'air') { y = f.y - f.breed.bodyRY * 1.4 * ART; ry *= 1.4; }
  else if (f.atkKind === 'crouch') { y = f.y - f.breed.bodyRY * 1.3 * ART; ry *= 0.9; rx *= 1.15; }
  return {
    x: f.x + ox + (f.facing > 0 ? 0 : -rx),
    y, w: rx, h: ry,
  };
}

function atkData(f) {
  return f.state === 'light' ? f.breed.lAtk : f.state === 'heavy' ? f.breed.hAtk : null;
}

function totalAtkFrames(atk) { return atk.su + atk.ac + atk.re; }

function updateFighter(f, input, opp) {
  const b = f.breed;
  f.stateFrame++;
  if (f.invincible > 0) f.invincible--;
  if (f.flashTimer > 0) f.flashTimer--;
  if (f.combo.life > 0) f.combo.life--;

  // guard recovers once the pressure is off
  if (f.guardDelay > 0) f.guardDelay--;
  else if (f.state !== 'dizzy' && f.guard < GUARD_MAX) f.guard = Math.min(GUARD_MAX, f.guard + GUARD_REGEN);

  // smooth HP bar
  f.displayHp = lerp(f.displayHp, f.hp, 0.12);

  // auto-face opponent
  if (f.state === 'idle' || f.state === 'walk' || f.state === 'crouch' || f.state === 'block') {
    f.facing = opp.x > f.x ? 1 : -1;
  }

  // gravity
  if (!f.grounded) {
    f.vy += GRAVITY;
    f.y += f.vy;
    if (f.y >= GROUND_Y) {
      f.y = GROUND_Y;
      f.vy = 0;
      f.grounded = true;
      f.airAtk = false;
      spawnHitFx('fx_dust_1', f.x, f.y - 8, 110, 16, { add: false, rot: 0, spin: 0, grow: 0.6, dy: -10 });
      SFX.land();
      if (f.state === 'airborne' || f.state === 'jump') {
        f.state = 'idle'; f.stateFrame = 0;
      }
    }
  }

  // hitstun
  if (f.state === 'hitstun') {
    f.vx *= 0.9;
    f.x += f.vx;
    f.hitstunTime--;
    if (f.hitstunTime <= 0) {
      f.state = 'idle'; f.stateFrame = 0;
      f.comboCount = 0; f.comboDmg = 0;
    }
    clampStage(f);
    return;
  }

  // blockstun
  if (f.state === 'blockstun') {
    f.vx *= 0.88;
    f.x += f.vx;
    f.blockstunTime--;
    if (f.blockstunTime <= 0) {
      f.state = 'idle'; f.stateFrame = 0;
    }
    clampStage(f);
    return;
  }

  // guard broken: defenceless until it wears off or a hit lands
  if (f.state === 'dizzy') {
    f.vx *= 0.85;
    f.x += f.vx;
    if (--f.dizzyTime <= 0) { f.state = 'idle'; f.stateFrame = 0; f.guard = GUARD_MAX; }
    clampStage(f);
    return;
  }

  // knockdown
  if (f.state === 'ko') {
    f.vx *= 0.92;
    f.x += f.vx;
    clampStage(f);
    return;
  }

  // attacks
  if (f.state === 'light' || f.state === 'heavy') {
    const atk = atkData(f);
    f.vx *= f.atkKind === 'air' ? 0.98 : 0.9;
    f.x += f.vx;
    if (f.atkKind === 'air' && f.grounded) { f.state = 'idle'; f.stateFrame = 0; f.hitThisAtk = false; f.atkKind = 'stand'; }
    else if (f.stateFrame >= totalAtkFrames(atk)) {
      f.state = !f.grounded ? 'jump' : f.atkKind === 'crouch' && input.down ? 'crouch' : 'idle';
      f.stateFrame = 0;
      f.hitThisAtk = false; f.atkKind = 'stand';
    }
    clampStage(f);
    return;
  }

  // special attack
  if (f.state === 'special') {
    f.vx *= 0.9;
    f.x += f.vx;
    handleSpecial(f, opp);
    clampStage(f);
    return;
  }

  // movement
  const spd = b.speed * MOVE_SCALE * (f.grounded ? 1 : AIR_CTRL);
  let moving = false;

  if (input.left) { f.vx -= spd * 0.3; moving = true; }
  if (input.right) { f.vx += spd * 0.3; moving = true; }

  if (f.grounded) {
    f.vx *= GROUND_FRIC;

    // block stance
    if (input.block && !input.down) {
      if (f.state !== 'block') { f.state = 'block'; f.stateFrame = 0; }
      f.vx *= 0.6;
      f.x += f.vx;
      clampStage(f);
      return;
    } else if (f.state === 'block') {
      f.state = 'idle'; f.stateFrame = 0;
    }

    // crouch
    if (input.down) {
      if (f.state !== 'crouch') { f.state = 'crouch'; f.stateFrame = 0; }
    } else if (f.state === 'crouch') {
      f.state = 'idle'; f.stateFrame = 0;
    }

    // crouching attacks
    if (f.state === 'crouch' && (input.light || input.heavy)) {
      f.state = input.heavy ? 'heavy' : 'light'; f.stateFrame = 0; f.hitThisAtk = false; f.atkKind = 'crouch';
      SFX.swing(input.heavy);
      f.vx += f.facing * 1.5;
      f.x += f.vx; clampStage(f);
      return;
    }

    // jump
    if (input.up && f.state !== 'crouch') {
      f.vy = b.jumpF * JUMP_SCALE;
      f.grounded = false;
      f.state = 'jump'; f.stateFrame = 0;
      SFX.jump();
    }
    // standing attacks
    else if (input.heavy && f.state !== 'crouch') {
      f.state = 'heavy'; f.stateFrame = 0; f.hitThisAtk = false; f.atkKind = 'stand';
      f.vx += f.facing * 3;
      SFX.swing(true);
    }
    else if (input.light && f.state !== 'crouch') {
      f.state = 'light'; f.stateFrame = 0; f.hitThisAtk = false; f.atkKind = 'stand';
      f.vx += f.facing * 2;
      SFX.swing(false);
    }
    else if (input.special && f.special >= SPECIAL_MAX && f.state !== 'crouch') {
      f.state = 'special'; f.stateFrame = 0; f.hitThisAtk = false;
      f.special = 0;
      startSpecial(f, opp);
      SFX.special(f);
    }

    if (!moving && f.state !== 'crouch' && f.state !== 'light' && f.state !== 'heavy' && f.state !== 'special' && f.state !== 'jump') {
      if (f.state !== 'idle') { f.state = 'idle'; f.stateFrame = 0; }
    } else if (moving && f.state === 'idle') {
      f.state = 'walk'; f.stateFrame = 0;
    }
  } else {
    // air attack: one forward dive per jump
    if ((input.light || input.heavy) && !f.airAtk) {
      f.state = input.heavy ? 'heavy' : 'light'; f.stateFrame = 0; f.hitThisAtk = false; f.atkKind = 'air';
      f.airAtk = true;
      f.vx += f.facing * 2.5;
      SFX.swing(input.heavy);
    }
  }

  f.x += f.vx;
  clampStage(f);
}

function clampStage(f) {
  const hw = (f.breed.bodyRX + 5) * ART;
  if (f.x < STAGE_L + hw) { f.x = STAGE_L + hw; f.vx = 0; }
  if (f.x > STAGE_R - hw) { f.x = STAGE_R - hw; f.vx = 0; }
}

function isBlocking(f, opp) {
  if (f.state === 'hitstun' || f.state === 'dizzy' || f.state === 'ko' || f.state === 'light' || f.state === 'heavy' || f.state === 'special') return false;
  if (!f.currentInput) return false;
  if (f.state === 'block' || f.currentInput.block) return true;
  const awayDir = opp.x > f.x ? -1 : 1;
  return awayDir < 0 ? f.currentInput.left : f.currentInput.right;
}

// ═══════════════════════════════════════════════════════════════════
//  Special Moves
// ═══════════════════════════════════════════════════════════════════

function startSpecial(f, opp) {
  const type = f.breed.specType;
  if (type === 'furball') {
    f.specActive = true;
    f.specData = { type:'furball', balls: [
      { x: f.x + f.facing*30*ART, y: f.y - 50*ART, vx: f.facing*8, vy: -2 },
      { x: f.x + f.facing*30*ART, y: f.y - 55*ART, vx: f.facing*7, vy: -4 },
      { x: f.x + f.facing*30*ART, y: f.y - 45*ART, vx: f.facing*9, vy: 0 },
    ], timer: 40 };
  } else if (type === 'shadowDash') {
    f.specActive = true;
    f.specData = { type:'shadowDash', timer: 20, dashDir: f.facing, hit: false };
    f.vx = f.facing * 14;
    f.invincible = 10;
  } else if (type === 'earthquake') {
    f.specActive = true;
    f.specData = { type:'earthquake', timer: 25, hit: false };
    addShake(MAX_SHAKE);
  } else if (type === 'hypnoGaze') {
    f.specActive = true;
    f.specData = { type:'hypnoGaze', timer: 30, hit: false };
  }
}

function handleSpecial(f, opp) {
  if (!f.specActive) {
    if (f.stateFrame > 30) { f.state = 'idle'; f.stateFrame = 0; }
    return;
  }
  const d = f.specData;
  d.timer--;

  if (d.type === 'furball') {
    for (const ball of d.balls) {
      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.vy += 0.1;
      const bRect = { x: ball.x-8*ART, y: ball.y-8*ART, w: 16*ART, h: 16*ART };
      if (!ball.hit && rectsHit(bRect, fighterHurtbox(opp))) {
        ball.hit = true;
        applyHit(opp, f, f.breed.specDmg * 0.4, 4, 8, ball.x, ball.y);
      }
    }
    if (d.timer <= 0) { f.specActive = false; f.state = 'idle'; f.stateFrame = 0; }
  } else if (d.type === 'shadowDash') {
    f.vx *= 0.95;
    if (!d.hit && rectsHit(fighterHurtbox(f), fighterHurtbox(opp))) {
      d.hit = true;
      applyHit(opp, f, f.breed.specDmg, 8, 14, opp.x, opp.y - 40*ART);
    }
    if (d.timer <= 0) { f.specActive = false; f.state = 'idle'; f.stateFrame = 0; f.invincible = 0; }
  } else if (d.type === 'earthquake') {
    if (f.stateFrame === 8 && !d.hit) {
      d.hit = true;
      if (opp.grounded && Math.abs(opp.x - f.x) < 180 * ART) {
        applyHit(opp, f, f.breed.specDmg, 12, 18, opp.x, GROUND_Y - 10);
        addShake(MAX_SHAKE);
        spawnParts(f.x, GROUND_Y, 20, '#A67B3D', 6, 20, 4);
      }
      SFX.quake();
      spawnParts(f.x - 60, GROUND_Y, 8, '#5C3D1E', 4, 15, 3);
      spawnParts(f.x + 60, GROUND_Y, 8, '#5C3D1E', 4, 15, 3);
    }
    if (d.timer <= 0) { f.specActive = false; f.state = 'idle'; f.stateFrame = 0; }
  } else if (d.type === 'hypnoGaze') {
    if (f.stateFrame === 6 && !d.hit && Math.abs(opp.x - f.x) < 140 * ART) {
      d.hit = true;
      applyHit(opp, f, f.breed.specDmg, 0, 40, opp.x, opp.y - 50*ART);
      spawnParts(opp.x, opp.y - 60*ART, 15, '#FF00FF', 3, 25, 3);
    }
    if (d.timer <= 0) { f.specActive = false; f.state = 'idle'; f.stateFrame = 0; }
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Hit Resolution
// ═══════════════════════════════════════════════════════════════════

function applyHit(target, attacker, dmg, kb, stunFrames, sparkX, sparkY) {
  if (target.state === 'ko' || target.invincible > 0) return;
  const blocked = isBlocking(target, attacker);
  const dir = attacker.x < target.x ? 1 : -1;

  if (blocked) {
    target.hp -= Math.ceil(dmg * BLOCK_DMG);
    target.vx = dir * kb * BLOCK_KB;
    target.guard -= GUARD_COST + dmg;
    target.guardDelay = GUARD_REGEN_DELAY;
    spawnParts(sparkX, sparkY, 6, P.blockSpark, 5, 10, 3);
    if (target.guard <= 0) {
      // guard break: the block gives way and the defender is left wide open
      target.guard = 0;
      target.state = 'dizzy'; target.stateFrame = 0;
      target.dizzyTime = GUARD_BREAK_STUN;
      target.vx = dir * 4;
      spawnHitFx('fx_hit_block', sparkX, sparkY, 190, 22);
      spawnParts(sparkX, sparkY, 16, P.blockSpark, 8, 22, 4);
      spawnPopup('GUARD BREAK!', target.x, target.y - target.breed.spriteH - 56, P.gold);
      addShake(9);
      SFX.guardBreak();
      game.hitPause = HEAVY_PAUSE;
    } else {
      target.state = 'blockstun'; target.stateFrame = 0;
      target.blockstunTime = Math.ceil(stunFrames * 0.5);
      spawnHitFx('fx_hit_block', sparkX, sparkY, 70, 12);
      SFX.block();
      game.hitPause = 3;
    }
  } else {
    // a hit that lands before the target recovers extends the combo; each one deals a little less
    // and stuns a little shorter, so a combo always ends
    if (target.state === 'dizzy') target.guard = GUARD_MAX;
    const n = target.comboCount;
    const dealt = n ? Math.max(1, Math.round(dmg * Math.max(COMBO_MIN_SCALE, 1 - n * COMBO_SCALE))) : dmg;
    const stun = Math.max(6, stunFrames - Math.max(0, n - 2) * COMBO_STUN_DECAY);
    target.hp -= dealt;
    target.vx = dir * kb / target.breed.weight;
    target.vy = -Math.abs(kb) * 0.3;
    target.hitstunTime = stun;
    target.state = 'hitstun'; target.stateFrame = 0;
    target.flashTimer = stun;
    target.comboCount = n + 1;
    target.comboDmg += dealt;
    attacker.combo.hits = n + 1; attacker.combo.dmg = target.comboDmg; attacker.combo.life = COMBO_SHOW;
    spawnHitSparks(sparkX, sparkY, dir);
    spawnHitFx('fx_hit_5', sparkX, sparkY, dmg > 15 ? 130 : 80, 14);
    addShake(dmg > 15 ? 10 : 5);
    if (dmg > 15) { SFX.hitHeavy(target); game.hitPause = HEAVY_PAUSE; }
    else { SFX.hitLight(); game.hitPause = HIT_PAUSE; }
  }

  const wasReady = attacker.special >= SPECIAL_MAX || target.special >= SPECIAL_MAX;
  attacker.special = Math.min(SPECIAL_MAX, attacker.special + SPECIAL_GAIN_DEAL);
  target.special = Math.min(SPECIAL_MAX, target.special + SPECIAL_GAIN_TAKE);
  if (!wasReady && (attacker.special >= SPECIAL_MAX || target.special >= SPECIAL_MAX)) SFX.ready();

  if (target.hp <= 0) {
    target.hp = 0;
    target.state = 'ko'; target.stateFrame = 0;
    target.vx = dir * 6;
    target.vy = -6;
    target.grounded = false;
    game.hitPause = KO_PAUSE;
    addShake(MAX_SHAKE);
    SFX.ko(target);
    spawnParts(sparkX, sparkY, 25, P.ko, 8, 25, 5);
    spawnHitFx('fx_ko_burst', sparkX, sparkY, 300, 30, { grow: 1.2, spin: 0.15 });
    spawnHitFx('fx_dust_3', target.x, GROUND_Y - 10, 180, 30, { add: false, rot: 0, spin: 0, grow: 0.7, dy: -14 });
    spawnParts(sparkX, sparkY, 15, P.gold, 6, 30, 4);
  }
}

function checkHits(f1, f2) {
  // f1 attacking f2
  if ((f1.state === 'light' || f1.state === 'heavy') && !f1.hitThisAtk) {
    const hitbox = fighterAtkHitbox(f1);
    if (hitbox && rectsHit(hitbox, fighterHurtbox(f2))) {
      f1.hitThisAtk = true;
      const atk = atkData(f1);
      const sparkX = (f1.x + f2.x) / 2;
      const sparkY = hitbox.y + hitbox.h / 2;
      applyHit(f2, f1, atk.dmg, atk.kb, f1.state === 'heavy' ? 18 : 10, sparkX, sparkY);
    }
  }
}

function pushApart(f1, f2) {
  const dist = Math.abs(f1.x - f2.x);
  const minDist = (f1.breed.bodyRX + f2.breed.bodyRX + 4) * ART;
  if (dist < minDist) {
    const push = (minDist - dist) / 2 * PUSH_APART * 0.5;
    const dir = f1.x < f2.x ? -1 : 1;
    f1.x += dir * push;
    f2.x -= dir * push;
  }
}

// ═══════════════════════════════════════════════════════════════════
//  CPU Controller
// ═══════════════════════════════════════════════════════════════════

// The CPU sharpens as the player's win streak grows: level 1 on a fresh run, CPU_MAX_LEVEL after
// seven straight wins. A loss resets the streak, and the level with it.
function cpuLevel() { return Math.min(CPU_MAX_LEVEL, game.winStreak + 1); }

function makeBrain(level) {
  const k = (level - 1) / (CPU_MAX_LEVEL - 1);   // 0 = pushover, 1 = ruthless
  return {
    level, k, decision: 'wait', timer: 0,
    thinkMin: Math.round(lerp(16, 5, k)), thinkMax: Math.round(lerp(34, 11, k)),   // frames between decisions
    react: Math.round(lerp(20, 3, k)),   // frames to notice an attack starting
    block: lerp(0.1, 0.85, k),           // chance to guard an attack it noticed
    aggro: lerp(0.4, 0.8, k),            // chance to attack rather than hang back
    punish: lerp(0.1, 0.95, k),          // chance to punish a missed attack or a broken guard
    special: lerp(0.15, 0.75, k),        // chance to spend a full meter when the special can reach
  };
}

// how close the opponent must be (px) for each special to be worth firing
const SPECIAL_REACH = { furball: 330, shadowDash: 230, earthquake: 170 * ART, hypnoGaze: 130 * ART };

function aiUpdate(brain, self, opp) {
  const dist = Math.abs(self.x - opp.x);
  const oppAtk = opp.state === 'light' || opp.state === 'heavy' || opp.state === 'special';
  // spotting an attack as it starts cuts the current plan short
  if (oppAtk && opp.stateFrame === 0 && dist < 150 * ART) brain.timer = Math.min(brain.timer, brain.react);
  if (--brain.timer <= 0) {
    brain.timer = rndInt(brain.thinkMin, brain.thinkMax);
    brain.decision = aiDecide(brain, self, opp, dist, oppAtk);
  }
  return aiToInput(brain, self, opp);
}

function aiDecide(brain, self, opp, dist, oppAtk) {
  if (self.state === 'hitstun' || self.state === 'blockstun' || self.state === 'dizzy' || self.state === 'ko') return 'wait';
  const chance = p => Math.random() < p;
  const close = dist < 90 * ART, mid = dist < 140 * ART;

  // an opponent who cannot defend: guard broken, or stuck recovering from an attack that missed
  const atk = atkData(opp);
  const open = opp.state === 'dizzy' || (atk && opp.stateFrame >= atk.su + atk.ac);
  if (open && chance(brain.punish)) return close ? 'heavy' : mid ? 'approach_attack' : 'approach';

  // a full meter, spent only where the special can connect
  const spec = self.breed.specType;
  if (self.special >= SPECIAL_MAX && dist < SPECIAL_REACH[spec] && (spec !== 'earthquake' || opp.grounded) && chance(brain.special)) return 'special';

  // defence; a guard that is nearly broken is not worth holding up
  if (oppAtk && mid && chance(brain.block)) return self.guard < 35 && chance(brain.k) ? 'jump_back' : 'block';

  if (close) {
    if (chance(brain.aggro)) return chance(0.3) ? 'heavy' : chance(0.1 + brain.k * 0.25) ? 'low' : 'light';
    return chance(0.3) ? 'jump_back' : chance(0.5) ? 'block' : 'retreat';
  }
  if (mid) return chance(brain.aggro) ? 'approach_attack' : chance(0.6) ? 'approach' : 'wait';
  return chance(0.55 + brain.aggro * 0.3) ? 'approach' : chance(0.3) ? 'jump_in' : 'wait';
}

function aiToInput(brain, self, opp) {
  const inp = { left:false, right:false, up:false, down:false, light:false, heavy:false, special:false, block:false };
  const toOpp = opp.x > self.x ? 'right' : 'left';
  const awayOpp = toOpp === 'right' ? 'left' : 'right';

  switch (brain.decision) {
    case 'approach': inp[toOpp] = true; break;
    case 'approach_attack': inp[toOpp] = true; if (Math.abs(self.x - opp.x) < 100 * ART) inp.light = true; break;
    case 'retreat': inp[awayOpp] = true; break;
    case 'light': inp.light = true; break;
    case 'heavy': inp.heavy = true; break;
    case 'low': inp.down = true; inp.light = true; break;
    case 'special': inp.special = true; break;
    case 'block': inp.block = true; break;
    case 'jump_back': inp[awayOpp] = true; inp.up = true; break;
    case 'jump_in': inp[toOpp] = true; inp.up = true; if (!self.grounded && self.vy > -2 && Math.abs(self.x - opp.x) < 140 * ART) inp.heavy = true; break;
  }
  return inp;
}

// ═══════════════════════════════════════════════════════════════════
//  Fighter Drawing
// ═══════════════════════════════════════════════════════════════════

function drawCat(f) {
  drawSpriteCat(f, ASSETS.sprites[f.breed.key]);
  drawProjectiles(f);
}

function drawProjectiles(f) {
  if (!f.specActive || !f.specData || f.specData.type !== 'furball') return;
  const fr = 1 + ((game.frame >> 2) % 3);
  for (const ball of f.specData.balls) {
    if (!ball.hit) drawImg('fx_furball_' + fr, ball.x, ball.y, 26 * ART, { rot: game.frame * 0.25 * f.facing, glow: f.breed.specColor, blur: 14 });
  }
}

function spriteSeq(S, prefix) {
  if (!S.seq) S.seq = {};
  if (!S.seq[prefix]) {
    const arr = [];
    for (let i = 1; S.frames[prefix + '_' + i]; i++) arr.push(S.frames[prefix + '_' + i]);
    S.seq[prefix] = arr;
  }
  return S.seq[prefix];
}

function spriteIdle(f, S) {
  const a = spriteSeq(S, 'idle');
  if (f.breed.key === 'razor') return a[1] || a[0];
  return a[((game.frame / 32) | 0) % a.length];
}

function spritePose(f, S) {
  const sf = f.stateFrame, b = f.breed;
  const idle = spriteIdle(f, S);
  const at = (p, i) => { const a = spriteSeq(S, p); return a.length ? a[Math.max(0, Math.min(a.length - 1, i))] : idle; };
  const step = (p, rate, offset) => { const a = spriteSeq(S, p); return a.length ? a[Math.min(a.length - 1, ((sf - (offset || 0)) / rate) | 0)] : idle; };
  if (f.winPose && (f.state === 'idle' || f.state === 'walk')) return at('win', 0);
  switch (f.state) {
    case 'idle': return idle;
    case 'walk': { const a = spriteSeq(S, 'walk'); return a.length ? a[((sf / 7) | 0) % a.length] : idle; }
    case 'jump': case 'airborne': return at('jump', f.vy < 0 ? 0 : 1);
    case 'crouch': return at('crouch', 0);
    case 'light': return f.atkKind === 'crouch' ? at('crouch', 0) : at('light', sf < b.lAtk.su ? 0 : 1);
    case 'heavy': return f.atkKind === 'crouch' ? at('crouch', 0) : at('heavy', sf < b.hAtk.su ? 0 : 1);
    case 'special': return spriteSeq(S, 'special').length ? step('special', 8) : at('roar', 0);
    case 'hitstun': return step('hit', 6);
    case 'blockstun': case 'block': return at('block', 0);
    case 'dizzy': return at('hit', 9);
    case 'ko': { const hit = spriteSeq(S, 'hit'); if (sf < 8 && hit.length) return hit[hit.length - 1]; return step('ko', 8, 8); }
  }
  return idle;
}

function spriteScale(f, S) {
  if (!S.scale) { const a = spriteSeq(S, 'idle'); const ref = f.breed.key === 'razor' ? (a[1] || a[0]) : a[0]; S.scale = f.breed.spriteH / ref.h; }
  return S.scale;
}

function drawSpriteCat(f, S) {
  const b = f.breed, sf = f.stateFrame, gf = game.frame;
  const fr = spritePose(f, S);
  const flash = f.flashTimer > 0 && sf < 9 && Math.floor(sf / 3) % 2 === 0;
  let bob = 0, sx = 1, sy = 1, rot = 0, ox = 0;
  const atk = f.state === 'light' ? b.lAtk : f.state === 'heavy' ? b.hAtk : null;
  const active = atk && sf >= atk.su && sf < atk.su + atk.ac;
  switch (f.state) {
    case 'idle': sy = 1 + Math.sin(sf * 0.08) * 0.012; sx = 1 - Math.sin(sf * 0.08) * 0.006; break;
    case 'walk': bob = -Math.abs(Math.sin(sf * 0.17)) * 4; rot = Math.sin(sf * 0.17) * 0.02; break;
    case 'jump': case 'airborne': rot = 0.06; break;
    case 'light': case 'heavy':
      ox = sf < atk.su ? -4 : active ? (f.atkKind === 'crouch' ? 16 : 8) : lerp(8, 0, (sf - atk.su - atk.ac) / atk.re);
      if (f.atkKind === 'air') rot = 0.42;
      break;
    case 'block': ox = -2; sx = 0.98; break;
    case 'special': sy = 1 + Math.sin(sf * 0.3) * 0.02; break;
    case 'hitstun': rot = -0.08 + Math.sin(sf * 0.5) * 0.03; ox = -3; break;
    case 'blockstun': ox = -2; break;
    case 'dizzy': rot = Math.sin(sf * 0.22) * 0.06; ox = -3; break;
    case 'ko': ox = sf < 10 ? -6 : 0; break;
  }
  const sc = spriteScale(f, S);
  const w = fr.w * sc, h = fr.h * sc, fx = fr.fx * sc;

  ctx.save();
  ctx.translate(f.x, f.y);
  if (f.facing < 0) ctx.scale(-1, 1);
  // ground shadow
  drawImg('fx_shadow', w * 0.05, GROUND_Y - f.y + 4, w * 0.22, { alpha: 0.75 });
  // afterimages
  if (!flash && (f.state === 'walk' && b.key === 'vex' || (f.state === 'special' && f.specData && f.specData.type === 'shadowDash'))) {
    for (let i = 1; i <= 3; i++) { ctx.globalAlpha = 0.18 / i; ctx.drawImage(fr.img, -fx - i * 14, -h, w, h); }
    ctx.globalAlpha = 1;
  }
  if (!flash && b.key === 'hex' && (gf % 150) < 4) {
    ctx.globalAlpha = 0.5;
    ctx.drawImage(whiteFrame(fr), -fx - 5, -h, w, h); ctx.drawImage(whiteFrame(fr), -fx + 5, -h, w, h);
    ctx.globalAlpha = 1;
  }
  ctx.translate(ox, bob); ctx.rotate(rot); ctx.scale(sx, sy);
  if (f.state === 'special' && !flash) { ctx.shadowColor = b.specColor; ctx.shadowBlur = 24 + Math.sin(gf * 0.4) * 8; }
  ctx.drawImage(fr.img, -fx, -h, w, h);
  ctx.shadowBlur = 0;
  if (flash) { ctx.globalAlpha = 0.5; ctx.drawImage(whiteFrame(fr), -fx, -h, w, h); ctx.globalAlpha = 1; }
  if (active && !flash) {
    const sy0 = f.atkKind === 'crouch' ? -h * 0.22 : -h * 0.55;
    const swipeKey = f.state === 'heavy' ? 'fx_swipe_heavy' : 'fx_swipe_light';
    const k = (sf - atk.su) / Math.max(1, atk.ac);
    drawImg(swipeKey, w * 0.55, sy0, h * (f.state === 'heavy' ? 0.95 : 0.7) * (0.85 + k * 0.3), { add: true, alpha: 0.95 - k * 0.4, rot: f.atkKind === 'air' ? 0.5 : 0 });
  }
  if (f.state === 'special' && f.specActive && f.specData) { ctx.save(); ctx.scale(ART, ART); drawSpecialEffect(f); ctx.restore(); }
  if (f.state === 'dizzy') {   // sparks circling a dazed head
    for (let i = 0; i < 3; i++) {
      const a = gf * 0.14 + i * 2.094;
      drawImg('fx_hit_block', Math.cos(a) * w * 0.2, -h - 2 + Math.sin(a) * 7, 22, { add: true, rot: a });
    }
  }
  ctx.restore();
}

// drawn in the fighter's own space: origin at the feet, facing right, in art units
function drawSpecialEffect(f) {
  const d = f.specData, sf = f.stateFrame;
  if (d.type === 'shadowDash') {
    drawImg('fx_dash_streak', -46, -46, 62, { add: true, alpha: Math.min(1, d.timer / 10) });
  } else if (d.type === 'earthquake' && sf >= 6 && sf <= 24) {
    const k = (sf - 6) / 18;
    drawImg('fx_shockwave', 0, 6, 34 + k * 56, { add: true, alpha: 1 - k * k });
  } else if (d.type === 'hypnoGaze' && sf < 26) {
    const k = sf / 26;
    drawImg('fx_hypno_' + (1 + Math.min(2, (sf / 9) | 0)), 34 + k * 30, -66, 24 + k * 60, { add: true, alpha: 1 - k * 0.6, rot: sf * 0.2 });
  }
}

function roundRect(cx, x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.lineTo(x + w - r, y);
  cx.arcTo(x + w, y, x + w, y + r, r);
  cx.lineTo(x + w, y + h - r);
  cx.arcTo(x + w, y + h, x + w - r, y + h, r);
  cx.lineTo(x + r, y + h);
  cx.arcTo(x, y + h, x, y + h - r, r);
  cx.lineTo(x, y + r);
  cx.arcTo(x, y, x + r, y, r);
  cx.fill();
}

// ═══════════════════════════════════════════════════════════════════
//  Backdrop effects — small moving touches over the painted stages
// ═══════════════════════════════════════════════════════════════════

function glowBlob(x, y, r, color, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexAlpha(color, alpha)); g.addColorStop(1, hexAlpha(color, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function smokeColumn(x, y, gf, seed, n, drift, color) {
  for (let i = 0; i < n; i++) {
    const age = (gf + i * 37 * ((seed % 5) + 1)) % 200, t = age / 200;
    ctx.fillStyle = color || '#C8C0C8'; ctx.globalAlpha = (1 - t) * 0.14 * Math.min(1, t * 6);
    ctx.beginPath(); ctx.arc(x + Math.sin(age * 0.04 + i + seed) * 10 + drift * age, y - age * 0.55, 6 + age * 0.14, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// wind streaks and blown litter
function roofWind(gf) {
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) { const wx = (gf * 6 + i * 200) % (W + 200) - 100; const wy = GROUND_Y + 20 + i * 18; ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + 90, wy - 1); ctx.stroke(); }
  ctx.fillStyle = '#C8C0B0';
  for (let i = 0; i < 3; i++) {
    const age = (gf * 3 + i * 330) % (W + 80);
    ctx.save(); ctx.translate(age - 40, GROUND_Y + 30 + i * 25 + Math.sin(age * 0.05) * 6); ctx.rotate(age * 0.08); ctx.globalAlpha = 0.6; ctx.fillRect(-5, -3, 10, 7); ctx.restore();
  }
}

// drifting dust
function scrapDust(gf) {
  ctx.fillStyle = '#C8A070';
  for (let i = 0; i < 10; i++) {
    const x = (gf * 0.6 + i * 97) % (W + 40) - 20, y = GROUND_Y + 10 + (i * 37) % 90 + Math.sin(gf * 0.02 + i) * 6;
    ctx.globalAlpha = 0.14; ctx.beginPath(); ctx.arc(x, y, 1.5 + (i % 3), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// falling blossom
function templePetals(gf, seed, n, alpha) {
  const rng = srand(31 + seed);
  for (let i = 0; i < n; i++) {
    const bx = rng() * W, sp = 0.5 + rng() * 0.6, ph = rng() * 6, off = rng() * H;
    const y = ((gf * sp + off) % (H + 40)) - 20;
    const x = bx + Math.sin(gf * 0.03 + ph) * 30 + gf * 0.2 * (1 + sp);
    ctx.save(); ctx.translate(x % (W + 40) - 20, y); ctx.rotate(gf * 0.05 + ph); ctx.globalAlpha = alpha;
    ctx.fillStyle = i % 2 ? '#F080B0' : '#FFB8D8'; ctx.beginPath(); ctx.ellipse(0, 0, 4, 2.5, 0, 0, 7); ctx.fill(); ctx.restore();
  }
}

const STAGES = [
  { id: 'pit', name: 'THE PIT', sub: 'NO RULES. NO EXIT.', quote: 'SOME CATS PLAY. THE PIT ENDS THEM.', accent: '#FF2E63' },
  { id: 'rooftop', name: 'ROOFTOP RUMBLE', sub: 'HIGH GROUND. DIRTY FIGHTS.', quote: 'SOME CATS CLIMB. WE FIGHT.', accent: '#FF2E8A' },
  { id: 'scrap', name: 'SCRAP YARD', sub: 'RUST. BLOOD. GLORY.', quote: 'EVERYTHING BREAKS EVENTUALLY.', accent: '#F5A030' },
  { id: 'temple', name: 'TEMPLE OF NINE LIVES', sub: 'HONOUR. DISCIPLINE. PAIN.', quote: 'BEAUTY HITS JUST AS HARD.', accent: '#08D9D6' },
];

function drawStage() {
  const st = STAGES[game.stage];
  ctx.drawImage(img('stage_' + st.id), 0, 0, W, H);
  stageFx(st, game.frame);
}

function stageFx(st, gf) {
  const rng = srand(3);
  ctx.fillStyle = '#FFF8E0';
  for (let i = 0; i < 22; i++) {
    const bx = rng() * W, by = 80 + rng() * 300, sp = 0.2 + rng() * 0.4;
    ctx.globalAlpha = 0.10 + 0.10 * Math.sin(gf * 0.05 + i);
    ctx.beginPath(); ctx.arc(bx + Math.sin(gf * 0.01 + i) * 12, by + ((gf * sp + i * 13) % 200) - 100, 1, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (st.id === 'pit') {
    if ((gf * 7919) % 97 < 2) { ctx.fillStyle = 'rgba(0,0,0,0.10)'; ctx.fillRect(0, 0, W, H); }
    if (shakeAmt > 6 && (gf % 3) === 0) {   // camera flashes in the crowd on a big hit
      ctx.save(); ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 40;
      ctx.beginPath(); ctx.arc(Math.random() * W, 250 + Math.random() * 10, 5, 0, 7); ctx.fill(); ctx.restore();
    }
    smokeColumn(900, 300, gf, 1, 5, 0.05);
  } else if (st.id === 'temple') {
    templePetals(gf, 7, 10, 0.9);
  } else if (st.id === 'scrap') {
    scrapDust(gf);
  } else if (st.id === 'rooftop') {
    roofWind(gf);
  }
}

function drawBarArt(key, x, y, w, h, box, frac, lostFrac, anchorRight) {
  ctx.drawImage(img(key), x, y, w, h);
  const [fx0, fx1, fy0, fy1] = box;
  const bx = x + fx0 * w, bw = (fx1 - fx0) * w, by = y + fy0 * h, bh = (fy1 - fy0) * h;
  const top = Math.max(frac, lostFrac);
  if (lostFrac > frac) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    if (anchorRight) ctx.fillRect(bx + bw * (1 - lostFrac), by, bw * (lostFrac - frac), bh);
    else ctx.fillRect(bx + bw * frac, by, bw * (lostFrac - frac), bh);
  }
  ctx.fillStyle = 'rgba(12,6,14,0.94)';
  if (anchorRight) ctx.fillRect(bx, by, bw * (1 - top), bh);
  else ctx.fillRect(bx + bw * top, by, bw * (1 - top), bh);
}

function drawDigits(n, cx, cy, h, gap) {
  const s = String(n);
  const ws = [...s].map(ch => { const im = img('ui_digit_' + ch); return im.width * h / im.height; });
  const total = ws.reduce((a, b) => a + b, 0) + gap * (s.length - 1);
  let x = cx - total / 2;
  for (let i = 0; i < s.length; i++) { drawImg('ui_digit_' + s[i], x + ws[i] / 2, cy, h); x += ws[i] + gap; }
}

function drawHUD() {
  const f1 = game.f1, f2 = game.f2;
  const hg = ctx.createLinearGradient(0, 0, 0, 80);
  hg.addColorStop(0, 'rgba(4,2,8,0.75)'); hg.addColorStop(1, 'rgba(4,2,8,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, 80);

  const b1 = img('ui_hud_healthbar_p1'), b2 = img('ui_hud_healthbar_p2');
  const w1 = 372, h1 = w1 * b1.height / b1.width;
  const w2 = 372 * b2.width / b1.width, h2 = w2 * b2.height / b2.width;
  const y = 6;
  drawBarArt('ui_hud_healthbar_p1', 14, y, w1, h1, HUD_FILL.p1, Math.max(0, f1.hp / f1.maxHp), Math.max(0, f1.displayHp / f1.maxHp), false);
  drawBarArt('ui_hud_healthbar_p2', W - 14 - w2, y, w2, h2, HUD_FILL.p2, Math.max(0, f2.hp / f2.maxHp), Math.max(0, f2.displayHp / f2.maxHp), true);

  drawImg('ui_name_' + f1.breed.key, 14 + w1 * 0.44, y + h1 * 0.85, 30);
  drawImg('ui_name_' + f2.breed.key, W - 14 - w2 * 0.40, y + h2 * 0.85, 30);
  ctx.font = `bold 11px ${F_MONO}`; ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'left'; ctx.fillText(`${Math.ceil(f1.hp)}`, 14 + w1 * 0.285, y + h1 * 0.50);
  ctx.textAlign = 'right'; ctx.fillText(`${Math.ceil(f2.hp)}`, W - 14 - w2 * 0.145, y + h2 * 0.50);

  const mw = 200, mh1 = mw * img('ui_hud_meter_p1').height / img('ui_hud_meter_p1').width;
  const mw2 = 200 * img('ui_hud_meter_p2').width / img('ui_hud_meter_p1').width, mh2 = mw2 * img('ui_hud_meter_p2').height / img('ui_hud_meter_p2').width;
  const my = y + h1 - 6;
  const m1x = 14 + w1 * 0.27, m2x = W - 14 - w2 * 0.13 - mw2;
  drawBarArt('ui_hud_meter_p1', m1x, my, mw, mh1, HUD_FILL.m1, f1.special / SPECIAL_MAX, f1.special / SPECIAL_MAX, false);
  drawBarArt('ui_hud_meter_p2', m2x, my, mw2, mh2, HUD_FILL.m2, f2.special / SPECIAL_MAX, f2.special / SPECIAL_MAX, true);
  const blink = Math.floor(game.frame / 12) % 2 === 0;
  if (f1.special >= SPECIAL_MAX && blink) drawImg('ui_hud_special_ready', m1x + mw / 2, my + mh1 + 12, 24, { glow: P.p1, blur: 12 });
  if (f2.special >= SPECIAL_MAX && blink) drawImg('ui_hud_special_ready', m2x + mw2 / 2, my + mh2 + 12, 24, { glow: P.p2, blur: 12 });

  for (let i = 0; i < WINS_NEEDED; i++) {
    drawImg(i < f1.wins ? 'ui_pip_p1' : 'ui_pip_off', m1x + mw + 18 + i * 24, my + mh1 / 2, 20);
    drawImg(i < f2.wins ? 'ui_pip_p2' : 'ui_pip_off', m2x - 18 - i * 24, my + mh2 / 2, 20);
  }

  drawImg('ui_hud_timer', W / 2, 42, 72);
  const tm = Math.ceil(game.roundTimer);
  ctx.save();
  if (tm <= 10) { ctx.shadowColor = P.ko; ctx.shadowBlur = 14; }
  drawDigits(String(tm).padStart(2, '0'), W / 2, 44, 30, 3);
  ctx.restore();

  drawCombo(f1, 104, P.p1);
  drawCombo(f2, W - 104, P.p2);
}

// "3 HITS" under the attacker's health bar while a combo is running, with the damage it has done
function drawCombo(f, cx, col) {
  const c = f.combo;
  if (c.life <= 0 || c.hits < 2) return;
  const pop = 1 + Math.max(0, 7 - (COMBO_SHOW - c.life)) * 0.07;
  ctx.save();
  ctx.globalAlpha = Math.min(1, c.life / 18);
  ctx.translate(cx, 164); ctx.scale(pop, pop);
  ctx.fillStyle = 'rgba(8,4,12,0.6)';
  roundRect(ctx, -84, -32, 168, 86, 10);
  ctx.shadowColor = col; ctx.shadowBlur = 14;
  drawDigits(c.hits, -40, 0, 46, 2);
  ctx.shadowBlur = 0;
  tagText('HITS', 32, 15, 30, col);
  tagText(Math.round(c.dmg) + ' DMG', 0, 44, 15, '#F0F0F0');
  ctx.restore();
}

function drawCharSelect() {
  drawCorkboard();
  drawImg('ui_header_fighter', W / 2, 52, 68, { glow: P.p1, blur: 16 });

  const order = [0, 1, 2, 3].sort((a, b) => {
    const sa = a === game.p1Select || a === game.p2Select, sb = b === game.p1Select || b === game.p2Select;
    return sa === sb ? a - b : sa ? 1 : -1;
  });
  const rots = [-0.05, 0.04, -0.03, 0.05];
  for (const i of order) {
    const b = BREEDS[BREED_KEYS[i]];
    const cx = 150 + i * 220, cy = 270;
    const sel1 = game.p1Select === i, sel2 = game.p2Select === i, sel = sel1 || sel2;
    const sc = sel ? 1.12 : 1, oy = sel ? -14 : 0;
    ctx.save();
    ctx.translate(cx, cy + oy); ctx.rotate(sel ? rots[i] * 0.4 : rots[i]); ctx.scale(sc, sc);
    const fim = img(sel1 ? 'ui_polaroid_p1' : sel2 ? 'ui_polaroid_p2' : 'ui_polaroid'), fh = 200, fw = fh * fim.width / fim.height;
    ctx.drawImage(fim, -fw / 2, -100, fw, fh);
    // portrait, cropped to the photo window of the frame

    scratchText(b.name, 0, 76, 24, '#1A1612', { skew: -0.12 });

    if (sel1) sprayText('P1', cx - 50 * sc, cy + oy - 112 * sc, 24, P.p1, { seed: 1, drips: false, outline: '#1A0A10' });
    if (sel2) sprayText(game.vsAI ? 'CPU' : 'P2', cx + 48 * sc, cy + oy - 112 * sc, 22, P.p2, { seed: 2, drips: false, outline: '#0A1A1A' });

  // scouting notes: stat bars for each pick

      ctx.fillRect(px + 36 + bw * 0.07, sy - bh * 0.22, bw * 0.86 * stats[s][1], bh * 0.44);
      ctx.globalAlpha = 1;

  }

  ctx.font = `12px ${F_MONO}`; ctx.textAlign = 'center'; ctx.fillStyle = '#9A8060';
  ctx.fillText(game.vsAI ? 'A/D or ←/→ to select  |  ENTER to confirm' : 'P1: A/D  |  P2: ←/→  |  ENTER to confirm', W / 2, H - 14);

function drawStageSelect() {

  const st = STAGES[game.stageSelect];
  glowBlob(W / 2, 260, 420, st.accent, 0.08);
  drawImg('ui_header_ground', W / 2, 52, 68, { glow: P.p1, blur: 16 });

  const rots = [-0.03, 0.02, -0.025, 0.03];
  const order = [0, 1, 2, 3].sort((a, b) => (a === game.stageSelect) - (b === game.stageSelect));
  for (const i of order) {
    const s = STAGES[i];
    const cx = 150 + i * 220, cy = 250, sel = i === game.stageSelect;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(sel ? 0 : rots[i]); ctx.scale(sel ? 1.1 : 1, sel ? 1.1 : 1);
    const fim = img(sel ? 'ui_frame_pink' : 'ui_frame_grey'), fw = 198, fh = fw * fim.height / fim.width;
    ctx.drawImage(fim, -fw / 2, -10 - fh / 2, fw, fh);
    const tb = [-fw / 2 + fw * 0.07, -10 - fh / 2 + fh * 0.08, fw * 0.86, fh * 0.84];
    ctx.drawImage(img('stage_' + s.id), ...tb);
    if (!sel) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(...tb); }
    drawImg('ui_stage_' + s.id, 0, 82, 44);
    scratchText(s.sub, 0, 104, 10, '#9A9A9A');
    drawImg('ui_level_' + (i + 1), -62, -104, 30);
    if (sel) drawSafetyPin(82, -98, 0.5, '#C0C0C8');
    ctx.restore();
  }

  scratchText('"' + st.quote + '"', W / 2, 430, 22, st.accent);
  ctx.font = `13px ${F_MONO}`; ctx.textAlign = 'center'; ctx.fillStyle = '#6A6A6A';
  ctx.fillText('A/D or ←/→ to select  |  ENTER to fight  |  ESC back', W / 2, H - 38);
}

// ═══════════════════════════════════════════════════════════════════
//  Game State Machine
// ═══════════════════════════════════════════════════════════════════

const game = {
  state: 'loading',
  frame: 0,
  f1: null, f2: null,
  cpu: null,   // the CPU's brain for this match (see makeBrain)
  vsAI: true,
  modeSelect: 0,
  p1Select: 0, p2Select: 1,
  round: 1,
  roundTimer: ROUND_TIME,
  hitPause: 0,
  introTimer: 0,
  introText: '',
  matchWinner: 0,
  winStreak: 0,
  pauseMenu: 0,
  stage: 0, stageSelect: 0,
  roundWinner: 1, endReason: 'ko', perfect: false,
  controlsPlayer: 0,
  controlsAction: 0,
  controlsWaiting: false,
};

function confirm() {
  return wasPressed('Enter') || wasPressed('NumpadEnter') || touchJust.confirm;
}

function updateLoading() {
  if (loadState.done !== loadState.seen) { loadState.seen = loadState.done; loadState.idle = 0; }
  const settled = loadState.done >= loadState.total;
  // a missing file, or a request that has hung for 20 seconds, stops here rather than starting a broken game
  if ((settled && loadState.failed.length) || (!settled && ++loadState.idle > 60 * 20)) game.state = 'loadError';
  else if (settled) game.state = 'title';
}

function updateLoadError() {
  if (confirm() || touchJust.any) location.reload();
}

function updateTitle() {
  if (confirm() || touchJust.any) {
    game.state = 'modeSelect';
    game.modeSelect = 0;
    SFX.select();
  }
}

function updateModeSelect() {
  if (wasPressed('KeyW') || wasPressed('ArrowUp') || wasPressed('KeyA') || wasPressed('ArrowLeft') || touchJust.up || touchJust.left) {
    game.modeSelect = 0; SFX.move();
  }
  if (wasPressed('KeyS') || wasPressed('ArrowDown') || wasPressed('KeyD') || wasPressed('ArrowRight') || touchJust.down || touchJust.right) {
    game.modeSelect = 1; SFX.move();
  }
  let tappedMode = false;
  for (let i = 0; i < 2; i++) if (tapIn(W/2 + (i ? 205 : -205) - 150, 290 - 150, 300, 300)) { game.modeSelect = i; tappedMode = true; }
  if (confirm() || tappedMode) {
    game.vsAI = game.modeSelect === 0;
    game.state = 'charSelect';
    game.p1Select = 0;
    game.p2Select = game.vsAI ? rndInt(1, 3) : 1;
    SFX.select();
  }
}

function updateCharSelect() {
  // P1 selection
  if (wasPressed('KeyA') || touchJust.left) {
    game.p1Select = (game.p1Select + 3) % 4;
    if (game.p1Select === game.p2Select) game.p1Select = (game.p1Select + 3) % 4;
    SFX.move();
  }
  if (wasPressed('KeyD') || touchJust.right) {
    game.p1Select = (game.p1Select + 1) % 4;
    if (game.p1Select === game.p2Select) game.p1Select = (game.p1Select + 1) % 4;
    SFX.move();
  }

  // P2 selection (only in 2P mode)
  if (!game.vsAI) {
    if (wasPressed('ArrowLeft')) {
      game.p2Select = (game.p2Select + 3) % 4;
      if (game.p2Select === game.p1Select) game.p2Select = (game.p2Select + 3) % 4;
      SFX.move();
    }
    if (wasPressed('ArrowRight')) {
      game.p2Select = (game.p2Select + 1) % 4;
      if (game.p2Select === game.p1Select) game.p2Select = (game.p2Select + 1) % 4;
      SFX.move();
    }
  }

  if (game.vsAI) {
    // in AI mode, P2 select is random but different from P1
    if (game.p2Select === game.p1Select) {
      game.p2Select = (game.p1Select + 1) % 4;
    }
  }

  let goFight = false;
  for (let i = 0; i < 4; i++) if (tapIn(150 + i * 220 - 90, 270 - 115, 180, 240)) {
    if (game.p1Select === i) goFight = true;
    else if (i !== game.p2Select || !game.vsAI) { game.p1Select = i; if (game.vsAI && game.p2Select === i) game.p2Select = (i + 1) % 4; SFX.move(); }
  }
  if (wasPressed('Escape')) { game.state = 'modeSelect'; SFX.back(); return; }
  if (confirm() || goFight) {
    game.state = 'stageSelect';
    SFX.meow(BREEDS[BREED_KEYS[game.p1Select]]);
    SFX.select();
  }
}

function updateStageSelect() {
  if (wasPressed('KeyA') || wasPressed('ArrowLeft') || touchJust.left) {
    game.stageSelect = (game.stageSelect + STAGES.length - 1) % STAGES.length; SFX.move();
  }
  if (wasPressed('KeyD') || wasPressed('ArrowRight') || touchJust.right) {
    game.stageSelect = (game.stageSelect + 1) % STAGES.length; SFX.move();
  }
  if (wasPressed('Escape')) { game.state = 'charSelect'; SFX.back(); return; }
  let go = false;
  for (let i = 0; i < STAGES.length; i++) if (tapIn(150 + i * 220 - 105, 250 - 120, 210, 260)) { if (game.stageSelect === i) go = true; else { game.stageSelect = i; SFX.move(); } }
  if (confirm() || go) {
    game.stage = game.stageSelect;
    startMatch();
    SFX.select();
  }
}

function startMatch() {
  game.f1 = createFighter(BREED_KEYS[game.p1Select], 250, 1);
  game.f2 = createFighter(BREED_KEYS[game.p2Select], W - 250, -1);
  game.round = 1;
  game.cpu = makeBrain(cpuLevel());
  startRound();
}

function startRound() {
  game.state = 'roundIntro';
  game.introTimer = 90;
  game.introText = `ROUND ${game.round}`;
  game.roundTimer = ROUND_TIME;
  game.hitPause = 0;

  resetFighter(game.f1, 250, 1);
  resetFighter(game.f2, W - 250, -1);

  particles.length = 0;
  hitFx.length = 0; popups.length = 0;
  shakeAmt = 0;
  SFX.bell();
}

function resetFighter(f, x, facing) {
  Object.assign(f, {
    x, y: GROUND_Y, vx: 0, vy: 0, facing,
    hp: f.maxHp, displayHp: f.maxHp, special: 0,
    state: 'idle', stateFrame: 0, grounded: true,
    hitThisAtk: false, hitstunTime: 0, blockstunTime: 0, invincible: 0, flashTimer: 0,
    guard: GUARD_MAX, guardDelay: 0, dizzyTime: 0, comboCount: 0, comboDmg: 0, combo: { hits: 0, dmg: 0, life: 0 },
    specActive: false, specData: null, winPose: false, atkKind: 'stand', airAtk: false,
  });
}

function updateRoundIntro() {
  game.introTimer--;
  if (game.introTimer === 30) {
    game.introText = 'FIGHT!';
    SFX.fight();
  }
  if (game.introTimer <= 0) {
    game.state = 'fighting';
  }
}

function updateFighting() {
  if (wasPressed('Space') || wasPressed('Escape') || touchJust.pause) {
    game.state = 'paused';
    game.pauseMenu = 0;
    SFX.pause();
    return;
  }

  // hit pause
  if (game.hitPause > 0) {
    game.hitPause--;
    return;
  }

  // timer
  const secsBefore = Math.ceil(game.roundTimer);
  game.roundTimer -= 1/60;
  if (game.roundTimer <= 0) {
    game.roundTimer = 0;
    SFX.bell();
    // most health left wins, as a share of each fighter's own maximum
    endRound(game.f1.hp / game.f1.maxHp >= game.f2.hp / game.f2.maxHp ? 1 : 2, 'time');
    return;
  }
  if (secsBefore <= 10 && Math.ceil(game.roundTimer) < secsBefore) SFX.tick();

  // input
  const inp1 = p1Input();
  const inp2 = game.vsAI ? aiUpdate(game.cpu, game.f2, game.f1) : {
    left: P2.left(), right: P2.right(), up: P2.up(), down: P2.down(),
    light: P2.light(), heavy: P2.heavy(), special: P2.special(), block: P2.block(),
  };

  game.f1.currentInput = inp1;
  game.f2.currentInput = inp2;
  updateFighter(game.f1, inp1, game.f2);
  updateFighter(game.f2, inp2, game.f1);

  // push apart
  pushApart(game.f1, game.f2);

  // hit detection (both directions)
  checkHits(game.f1, game.f2);
  checkHits(game.f2, game.f1);

  // check KO
  if (game.f1.hp <= 0) endRound(2, 'ko');
  else if (game.f2.hp <= 0) endRound(1, 'ko');

  updateParticles();
}

function tapIn(x, y, w, h) { return tapPos && tapPos.x >= x && tapPos.x <= x + w && tapPos.y >= y && tapPos.y <= y + h; }

function updatePaused() {
  const MENU_ITEMS = ['Resume', 'Configure Controls', 'Quit to Menu'];
  let tapped = false;
  for (let i = 0; i < MENU_ITEMS.length; i++) if (tapIn(W/2 - 200, 250 + i * 64 - 30, 400, 60)) { game.pauseMenu = i; tapped = true; }
  if (wasPressed('KeyW') || wasPressed('ArrowUp') || touchJust.up) {
    game.pauseMenu = (game.pauseMenu + MENU_ITEMS.length - 1) % MENU_ITEMS.length;
    SFX.move();
  }
  if (wasPressed('KeyS') || wasPressed('ArrowDown') || touchJust.down) {
    game.pauseMenu = (game.pauseMenu + 1) % MENU_ITEMS.length;
    SFX.move();
  }
  if (wasPressed('Space') || wasPressed('Escape') || touchJust.pause) {
    game.state = 'fighting';
    SFX.pause();
    return;
  }
  if (tapIn(W/2 - 110, H - 82, 220, 30)) { toggleMute(); SFX.move(); return; }
  if (confirm() || tapped) {
    if (game.pauseMenu === 0) {
      game.state = 'fighting';
      SFX.select();
    } else if (game.pauseMenu === 1) {
      game.state = 'controls';
      game.controlsPlayer = 0;
      game.controlsAction = 0;
      game.controlsWaiting = false;
      SFX.select();
    } else if (game.pauseMenu === 2) {
      game.state = 'title';
      game.winStreak = 0;
      particles.length = 0;
      hitFx.length = 0; popups.length = 0;
      shakeAmt = 0;
      SFX.back();
    }
  }
}

function updateControls() {
  if (game.controlsWaiting) {
    const k = lastKeyPressed();
    if (k && k !== 'Escape' && k !== 'Space') {
      const player = game.controlsPlayer === 0 ? 'p1' : 'p2';
      const action = ACTIONS[game.controlsAction];
      bindings[player][action] = k;
      saveBindings();
      game.controlsWaiting = false;
      SFX.select();
    }
    if (wasPressed('Escape')) {
      game.controlsWaiting = false;
      SFX.move();
    }
    return;
  }

  // rebinding needs a keyboard, so on a touch screen any tap goes back
  if (wasPressed('Escape') || wasPressed('Space') || (touchActive && touchJust.any)) {
    game.state = 'paused';
    SFX.back();
    return;
  }

  // navigate actions
  if (wasPressed('KeyW') || wasPressed('ArrowUp')) {
    game.controlsAction = (game.controlsAction + ACTIONS.length - 1) % ACTIONS.length;
    SFX.move();
  }
  if (wasPressed('KeyS') || wasPressed('ArrowDown')) {
    game.controlsAction = (game.controlsAction + 1) % ACTIONS.length;
    SFX.move();
  }
  // switch player tabs
  if (wasPressed('KeyA') || wasPressed('ArrowLeft')) {
    game.controlsPlayer = 0;
    SFX.move();
  }
  if (wasPressed('KeyD') || wasPressed('ArrowRight')) {
    game.controlsPlayer = 1;
    SFX.move();
  }
  // begin rebinding
  if (confirm()) {
    game.controlsWaiting = true;
    SFX.select();
  }
  // reset to defaults
  if (wasPressed('KeyR')) {
    bindings = JSON.parse(JSON.stringify(DEFAULT_BINDINGS));
    saveBindings();
    SFX.bell();
  }
}

function endRound(winner, reason) {
  game.state = 'roundEnd';
  game.introTimer = 150;
  game.roundWinner = winner;
  game.endReason = reason || 'ko';
  const wf = winner === 1 ? game.f1 : game.f2;
  game.perfect = wf.hp >= wf.maxHp;
  game.f1.flashTimer = 0; game.f2.flashTimer = 0;
  if (winner === 1) { game.f1.wins++; game.f1.winPose = true; game.introText = `${game.f1.breed.name} WINS!`; }
  else { game.f2.wins++; game.f2.winPose = true; game.introText = `${game.f2.breed.name} WINS!`; }
}

const NO_INPUT = { left:false, right:false, up:false, down:false, light:false, heavy:false, special:false, block:false };

// after the round is decided: let the knockout land and the winner settle into a pose
function settleFighters() {
  if (game.hitPause > 0) { game.hitPause--; return; }
  game.f1.currentInput = game.f2.currentInput = NO_INPUT;
  updateFighter(game.f1, NO_INPUT, game.f2);
  updateFighter(game.f2, NO_INPUT, game.f1);
}

function updateRoundEnd() {
  game.introTimer--;
  settleFighters();
  updateParticles();

  if (game.introTimer <= 0 || ((confirm() || touchJust.any) && game.introTimer < 80)) {
    // check match winner
    if (game.f1.wins >= WINS_NEEDED) {
      game.state = 'matchEnd';
      game.matchWinner = 1;
      game.introTimer = 180;
      if (game.vsAI) { game.winStreak++; saveHighScore(game.winStreak); }
      SFX.win(game.f1);
    } else if (game.f2.wins >= WINS_NEEDED) {
      game.state = 'matchEnd';
      game.matchWinner = 2;
      game.introTimer = 180;
      game.winStreak = 0;
      SFX.win(game.f2);
    } else {
      game.round++;
      startRound();
    }
  }
}

function updateMatchEnd() {
  game.introTimer--;
  settleFighters();
  updateParticles();

  // victory particles
  if (game.frame % 8 === 0) {
    const wx = game.matchWinner === 1 ? game.f1.x : game.f2.x;
    spawnParts(wx + rnd(-30, 30), GROUND_Y - rnd(20, 80), 3, P.gold, 3, 20, 3);
  }

  // stays up until the player continues
  if ((confirm() || touchJust.any) && game.introTimer < 120) {
    game.state = 'charSelect';
    if (game.vsAI) game.p2Select = (game.p1Select + rndInt(1, 3)) % 4;   // a new challenger
    particles.length = 0;
    hitFx.length = 0; popups.length = 0;
    SFX.select();
  }
}
