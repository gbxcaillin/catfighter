    ctx.beginPath(); ctx.arc(bx + Math.sin(gf * 0.01 + i) * 12, y, 1, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // swinging bulb
  const ang = Math.sin(gf * 0.02) * 0.14, len = 70;
  const bx = W / 2 + Math.sin(ang) * len, by = 0 + Math.cos(ang) * len;
  glowBlob(bx, by + 140, 260, '#FFD080', 0.08);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(bx, by); ctx.stroke();

  ctx.fillStyle = '#444'; ctx.fillRect(bx - 3, by - 4, 6, 6);
  // crowd
  const pump = shakeAmt > 3;
  for (let i = 0; i < pitCrowd.length; i++) {
    const m = pitCrowd[i];
    const sx = m.x + Math.sin(gf * 0.05 + m.ph) * 2.5, sy = m.y + (pump ? -Math.abs(Math.sin(gf * 0.5 + m.ph)) * 6 : 0);
    ctx.fillStyle = '#0B0B12';
    ctx.beginPath(); ctx.ellipse(sx, sy + 10, 14 * m.s, 22 * m.s, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(sx, sy - 9 * m.s, 9.5 * m.s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx - 8 * m.s, sy - 14 * m.s); ctx.lineTo(sx - 6 * m.s, sy - 24 * m.s); ctx.lineTo(sx - 1 * m.s, sy - 16 * m.s); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx + 8 * m.s, sy - 14 * m.s); ctx.lineTo(sx + 6 * m.s, sy - 24 * m.s); ctx.lineTo(sx + 1 * m.s, sy - 16 * m.s); ctx.fill();
    if (m.arm || pump) {
      ctx.strokeStyle = '#0B0B12'; ctx.lineWidth = 5 * m.s; ctx.lineCap = 'round';
      const ay = sy - 30 * m.s - (pump ? Math.abs(Math.sin(gf * 0.4 + m.ph)) * 8 : Math.sin(gf * 0.08 + m.ph) * 3);
      ctx.beginPath(); ctx.moveTo(sx + 8 * m.s, sy); ctx.lineTo(sx + 14 * m.s, ay); ctx.stroke();
      if (m.phone) {
        ctx.save(); ctx.fillStyle = '#E8F4FF'; ctx.shadowColor = '#B0D8FF'; ctx.shadowBlur = 10;
        ctx.fillRect(sx + 11 * m.s, ay - 8, 5, 8); ctx.restore();
      }
    }
    ctx.fillStyle = m.eye;
    ctx.fillRect(sx - 4 * m.s, sy - 10 * m.s, 2, 1.5); ctx.fillRect(sx + 2 * m.s, sy - 10 * m.s, 2, 1.5);
  }
  // camera flash on big hits
  if (shakeAmt > 6 && (gf % 3) === 0) {
    const m = pitCrowd[(gf * 7) % pitCrowd.length];
    ctx.save(); ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(m.x + 12, m.y - 34, 5, 0, 7); ctx.fill(); ctx.restore();
  }
  // rat
  const rt = gf % 1100;
  if (rt < 240) {
    const rx = -20 + rt * (W + 40) / 240, ry = GROUND_Y - 3;
    ctx.fillStyle = '#141014';
    ctx.beginPath(); ctx.ellipse(rx, ry, 9, 4, 0, 0, 7); ctx.fill();

    ctx.strokeStyle = '#141014'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(rx - 9, ry); ctx.quadraticCurveTo(rx - 16, ry - 4 + Math.sin(gf * 0.5) * 3, rx - 22, ry - 1); ctx.stroke();
  }
}

function skylineLayer(seed, yBase, minH, maxH, color, winColors, winAlpha, neon) {

    ctx.fillStyle = color; ctx.fillRect(x, yBase - h, w, h);
    if (rng() < 0.3) { ctx.fillRect(x + w * 0.3, yBase - h - 14, w * 0.4, 14); }
    if (rng() < 0.25) { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + w / 2, yBase - h); ctx.lineTo(x + w / 2, yBase - h - 30); ctx.stroke(); ctx.fillStyle = '#FF3040'; ctx.fillRect(x + w / 2 - 1.5, yBase - h - 32, 3, 3); }
    for (let wy = yBase - h + 8; wy < yBase - 10; wy += 11) for (let wx = x + 5; wx < x + w - 6; wx += 9) {
      if (rng() < 0.45) { ctx.fillStyle = winColors[Math.floor(rng() * winColors.length)]; ctx.globalAlpha = winAlpha * (0.4 + rng() * 0.6); ctx.fillRect(wx, wy, 4, 6); }

    x += w + 4 + rng() * 10;

}

  for (let i = 0; i < 6; i++) { const age = (gf * 1.5 + i * 33) % 100; ctx.fillStyle = '#D8ECF8'; ctx.globalAlpha = (1 - age / 100) * 0.2; ctx.beginPath(); ctx.arc(120 + Math.sin(age * 0.1 + i) * 30, 330 - age * 0.4, 8 + age * 0.2, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  // lantern flicker
  for (const [lx, ly, s] of [[62, 259, 1], [320, 275, 0.8], [700, 284, 0.7]]) {
    const fl = 0.7 + Math.sin(gf * 0.25 + lx) * 0.15 + Math.sin(gf * 0.71 + lx) * 0.1;
    ctx.save(); ctx.fillStyle = '#FFC070'; ctx.shadowColor = '#FF9040'; ctx.shadowBlur = 18 * fl; ctx.globalAlpha = fl;
    ctx.fillRect(lx - 6 * s, ly - 6 * s, 12 * s, 12 * s); ctx.restore();
    glowBlob(lx, ly, 70 * s, '#FF9040', 0.14 * fl);
  }
  // statue eye
  const eg = 0.6 + Math.sin(gf * 0.04) * 0.4;
  ctx.save(); ctx.fillStyle = '#FFE8A0'; ctx.shadowColor = '#FFD060'; ctx.shadowBlur = 12 * eg; ctx.globalAlpha = eg;
  ctx.beginPath(); ctx.ellipse(828, 186, 5, 3, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(806, 186, 4, 3, 0, 0, 7); ctx.fill(); ctx.restore();
  // fireflies
  const fr = srand(13);
  for (let i = 0; i < 12; i++) {
    const bx = fr() * W, by = 150 + fr() * 170, ph = fr() * 6;
    const a = Math.max(0, Math.sin(gf * 0.04 + ph));
    ctx.save(); ctx.fillStyle = '#C8FF80'; ctx.shadowColor = '#A0FF40'; ctx.shadowBlur = 6; ctx.globalAlpha = a * 0.8;
    ctx.beginPath(); ctx.arc(bx + Math.sin(gf * 0.02 + ph) * 20, by + Math.cos(gf * 0.017 + ph) * 12, 1.5, 0, 7); ctx.fill(); ctx.restore();
  }
  // falling petals (behind)
  templePetals(gf, 0, 12, 0.6);
}

function templePetals(gf, seed, n, alpha) {
  const rng = srand(31 + seed);
  for (let i = 0; i < n; i++) {
    const bx = rng() * W, sp = 0.5 + rng() * 0.6, ph = rng() * 6, off = rng() * H;
    const y = ((gf * sp + off) % (H + 40)) - 20;
    const x = bx + Math.sin(gf * 0.03 + ph) * 30 + gf * 0.2 * (1 + sp);
    ctx.save(); ctx.translate(x % (W + 40) - 20, y); ctx.rotate(gf * 0.05 + ph); ctx.globalAlpha = alpha;
    ctx.fillStyle = i % 2 ? '#F080B0' : '#FFB8D8'; ctx.beginPath(); ctx.ellipse(0, 0, 4, 2.5, 0, 0, 7); ctx.fill(); ctx.restore();
  }
}

function templeFront() {

  ctx.fillStyle = '#333A42'; ctx.fillRect(740, 342, 158, 88);
  ctx.fillStyle = '#4A525A'; ctx.fillRect(740, 342, 158, 4);

function templeOver(gf) {

}

const STAGES = [
  { id: 'pit', name: 'THE PIT', sub: 'NO RULES. NO EXIT.', quote: 'SOME CATS PLAY. THE PIT ENDS THEM.', accent: '#FF2E63', accent2: '#08D9D6', back: pitBack, mid: pitMid, front: pitFront, over: pitOver },
  { id: 'rooftop', name: 'ROOFTOP RUMBLE', sub: 'HIGH GROUND. DIRTY FIGHTS.', quote: 'SOME CATS CLIMB. WE FIGHT.', accent: '#FF2E8A', accent2: '#6A3FC8', back: roofBack, mid: roofMid, front: roofFront, over: roofOver },
  { id: 'scrap', name: 'SCRAP YARD', sub: 'RUST. BLOOD. GLORY.', quote: 'EVERYTHING BREAKS EVENTUALLY.', accent: '#F5A030', accent2: '#E82040', back: scrapBack, mid: scrapMid, front: scrapFront, over: scrapOver },
  { id: 'temple', name: 'TEMPLE OF NINE LIVES', sub: 'HONOUR. DISCIPLINE. PAIN.', quote: 'BEAUTY HITS JUST AS HARD.', accent: '#08D9D6', accent2: '#FF6FB0', back: templeBack, mid: templeMid, front: templeFront, over: templeOver },
];

function stageLayers(st) {
  if (!st.layers) {
    const back = makeLayer(), front = makeLayer();
    withCtx(back.getContext('2d'), st.back);
    withCtx(front.getContext('2d'), st.front);
    st.layers = { back, front };
  }
  return st.layers;
}

function stageImage(st) { return img('stage_' + st.id); }

function drawStage() {
  const st = STAGES[game.stage];
  const im = stageImage(st);
  if (im) {
    ctx.drawImage(im, 0, 0, W, H);
    stageImageFx(st, game.frame);
    return;
  }
  const L = stageLayers(st);
  ctx.drawImage(L.back, 0, 0);
  st.mid(game.frame);
  ctx.drawImage(L.front, 0, 0);
  st.over(game.frame);
}

// light dynamic touches layered over a painted backdrop
function stageImageFx(st, gf) {
  const rng = srand(3);
  ctx.fillStyle = '#FFF8E0';
  for (let i = 0; i < 22; i++) {
    const bx = rng() * W, by = 80 + rng() * 300, sp = 0.2 + rng() * 0.4;
    ctx.globalAlpha = 0.10 + 0.10 * Math.sin(gf * 0.05 + i);
    ctx.beginPath(); ctx.arc(bx + Math.sin(gf * 0.01 + i) * 12, by + ((gf * sp + i * 13) % 200) - 100, 1, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (st.id === 'pit') {
    if ((gf * 7919) % 97 < 2) { ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, H); }
    if (shakeAmt > 6 && (gf % 3) === 0) {
      const m = pitCrowd[(gf * 7) % pitCrowd.length];
      ctx.save(); ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 40;
      ctx.beginPath(); ctx.arc(m.x, 250 + (m.y - 336), 5, 0, 7); ctx.fill(); ctx.restore();
    }
    smokeColumn(900, 300, gf, 1, 5, 0.05);
  } else if (st.id === 'temple') {
    templePetals(gf, 7, 10, 0.9);
  } else if (st.id === 'scrap') {
    scrapOver(gf);
  } else if (st.id === 'rooftop') {
    roofOver(gf);
  }
}

function drawBarArt(key, x, y, w, h, box, frac, lostFrac, anchorRight) {
  ctx.drawImage(img(key), x, y, w, h);
  const [fx0, fx1, fy0, fy1] = box;
  const bx = x + fx0 * w, bw = (fx1 - fx0) * w, by = y + fy0 * h, bh = (fy1 - fy0) * h;
  const top = Math.max(frac, lostFrac);
  if (lostFrac > frac) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    if (anchorRight) ctx.fillRect(bx + bw * (1 - lostFrac), by, bw * (lostFrac - frac), bh);
    else ctx.fillRect(bx + bw * frac, by, bw * (lostFrac - frac), bh);
  }
  ctx.fillStyle = 'rgba(12,6,14,0.94)';
  if (anchorRight) ctx.fillRect(bx, by, bw * (1 - top), bh);
  else ctx.fillRect(bx + bw * top, by, bw * (1 - top), bh);
}

function drawDigits(n, cx, cy, h, gap) {
  const s = String(n);
  const ws = [...s].map(ch => { const im = img('ui_digit_' + ch); return im ? im.width * h / im.height : h * 0.6; });
  const total = ws.reduce((a, b) => a + b, 0) + gap * (s.length - 1);
  let x = cx - total / 2;
  for (let i = 0; i < s.length; i++) { drawImg('ui_digit_' + s[i], x + ws[i] / 2, cy, h); x += ws[i] + gap; }
}

function drawHUDArt() {
  const f1 = game.f1, f2 = game.f2;
  const b1 = img('ui_hud_healthbar_p1'), b2 = img('ui_hud_healthbar_p2');
  const w1 = 372, h1 = w1 * b1.height / b1.width;
  const w2 = 372 * b2.width / b1.width, h2 = w2 * b2.height / b2.width;
  const y = 6;
  drawBarArt('ui_hud_healthbar_p1', 14, y, w1, h1, HUD_FILL.p1, Math.max(0, f1.hp / f1.maxHp), Math.max(0, f1.displayHp / f1.maxHp), false);
  drawBarArt('ui_hud_healthbar_p2', W - 14 - w2, y, w2, h2, HUD_FILL.p2, Math.max(0, f2.hp / f2.maxHp), Math.max(0, f2.displayHp / f2.maxHp), true);

  ctx.font = `15px ${F_SPRAY}`; ctx.fillStyle = '#F0F0F0';
  ctx.textAlign = 'left'; ctx.fillText(f1.breed.name, 14 + w1 * 0.31, y + h1 * 0.88);
  ctx.textAlign = 'right'; ctx.fillText(f2.breed.name, W - 14 - w2 * 0.21, y + h2 * 0.88);
  ctx.font = `bold 11px ${F_MONO}`; ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'left'; ctx.fillText(`${Math.ceil(f1.hp)}`, 14 + w1 * 0.285, y + h1 * 0.50);
  ctx.textAlign = 'right'; ctx.fillText(`${Math.ceil(f2.hp)}`, W - 14 - w2 * 0.145, y + h2 * 0.50);

  const mw = 200, mh1 = mw * img('ui_hud_meter_p1').height / img('ui_hud_meter_p1').width;
  const mw2 = 200 * img('ui_hud_meter_p2').width / img('ui_hud_meter_p1').width, mh2 = mw2 * img('ui_hud_meter_p2').height / img('ui_hud_meter_p2').width;
  const my = y + h1 - 6;
  const m1x = 14 + w1 * 0.27, m2x = W - 14 - w2 * 0.13 - mw2;
  drawBarArt('ui_hud_meter_p1', m1x, my, mw, mh1, HUD_FILL.m1, f1.special / SPECIAL_MAX, f1.special / SPECIAL_MAX, false);
  drawBarArt('ui_hud_meter_p2', m2x, my, mw2, mh2, HUD_FILL.m2, f2.special / SPECIAL_MAX, f2.special / SPECIAL_MAX, true);
  const blink = Math.floor(game.frame / 12) % 2 === 0;
  if (f1.special >= SPECIAL_MAX && blink) drawImg('ui_hud_special_ready', m1x + mw / 2, my + mh1 + 12, 24, { glow: P.p1, blur: 12 });
  if (f2.special >= SPECIAL_MAX && blink) drawImg('ui_hud_special_ready', m2x + mw2 / 2, my + mh2 + 12, 24, { glow: P.p2, blur: 12 });

  for (let i = 0; i < WINS_NEEDED; i++) {
    drawImg(i < f1.wins ? 'ui_pip_p1' : 'ui_pip_off', m1x + mw + 18 + i * 24, my + mh1 / 2, 20);
    drawImg(i < f2.wins ? 'ui_pip_p2' : 'ui_pip_off', m2x - 18 - i * 24, my + mh2 / 2, 20);
  }

  drawImg('ui_hud_timer', W / 2, 42, 72);
  const tm = Math.ceil(game.roundTimer);
  ctx.save();
  if (tm <= 10) { ctx.shadowColor = P.ko; ctx.shadowBlur = 14; }
  drawDigits(String(tm).padStart(2, '0'), W / 2, 44, 30, 3);
  ctx.restore();
}

function drawHUD() {
  const f1 = game.f1, f2 = game.f2;
  const hg = ctx.createLinearGradient(0, 0, 0, 80);
  hg.addColorStop(0, 'rgba(4,2,8,0.75)'); hg.addColorStop(1, 'rgba(4,2,8,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, 80);
  if (img('ui_hud_healthbar_p1') && img('ui_hud_healthbar_p2')) { drawHUDArt(); return; }

  // health bar backgrounds
  const barW = 340, barH = 22, barY = 22;
  const p1barX = 40, p2barX = W - 40 - barW;

  // P1 health
  ctx.fillStyle = P.hpBg;
  roundRect(ctx, p1barX, barY, barW, barH, 4);
  const hp1w = (f1.displayHp / f1.maxHp) * barW;
  const lost1w = (f1.hp / f1.maxHp) * barW;
  ctx.fillStyle = P.hpLost;
  roundRect(ctx, p1barX, barY, barW, barH, 4);
  ctx.fillStyle = P.p1;
  if (hp1w > 0) roundRect(ctx, p1barX, barY, Math.max(hp1w, 4), barH, 4);

  // P2 health
  ctx.fillStyle = P.hpBg;
  roundRect(ctx, p2barX, barY, barW, barH, 4);
  const hp2w = (f2.displayHp / f2.maxHp) * barW;
  ctx.fillStyle = P.hpLost;
  roundRect(ctx, p2barX, barY, barW, barH, 4);
  ctx.fillStyle = P.p2;
  if (hp2w > 0) roundRect(ctx, p2barX + barW - Math.max(hp2w, 4), barY, Math.max(hp2w, 4), barH, 4);

  // HP text
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = P.white;
  ctx.fillText(`${Math.ceil(f1.hp)}`, p1barX + 6, barY + 16);
  ctx.textAlign = 'right';
  ctx.fillText(`${Math.ceil(f2.hp)}`, p2barX + barW - 6, barY + 16);

  // special meters
  const specY = barY + barH + 4, specH = 6;
  ctx.fillStyle = '#111';
  ctx.fillRect(p1barX, specY, barW * 0.6, specH);
  ctx.fillStyle = f1.special >= SPECIAL_MAX ? P.gold : '#886600';
  ctx.fillRect(p1barX, specY, barW * 0.6 * (f1.special / SPECIAL_MAX), specH);

  ctx.fillStyle = '#111';
  ctx.fillRect(p2barX + barW * 0.4, specY, barW * 0.6, specH);
  ctx.fillStyle = f2.special >= SPECIAL_MAX ? P.gold : '#886600';
  const sp2w = barW * 0.6 * (f2.special / SPECIAL_MAX);
  ctx.fillRect(p2barX + barW - sp2w, specY, sp2w, specH);

  if (f1.special >= SPECIAL_MAX) {
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = P.gold;
    ctx.fillText('SPECIAL READY!', p1barX, specY + specH + 12);
  }
  if (f2.special >= SPECIAL_MAX) {
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'right';
    ctx.fillStyle = P.gold;
    ctx.fillText('SPECIAL READY!', p2barX + barW, specY + specH + 12);
  }

  // names
  ctx.font = `17px ${F_SPRAY}`;
  ctx.textAlign = 'left';
  ctx.fillStyle = P.p1;
  ctx.fillText(f1.breed.name, p1barX, barY - 4);
  ctx.textAlign = 'right';
  ctx.fillStyle = P.p2;
  ctx.fillText(f2.breed.name, p2barX + barW, barY - 4);

  // round indicators
  for (let i = 0; i < WINS_NEEDED; i++) {
    ctx.fillStyle = i < f1.wins ? P.gold : '#333';
    ctx.beginPath();
    ctx.arc(p1barX + barW + 16 + i * 18, barY + barH/2, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = i < f2.wins ? P.gold : '#333';
    ctx.beginPath();
    ctx.arc(p2barX - 16 - i * 18, barY + barH/2, 5, 0, Math.PI*2);
    ctx.fill();
  }

  // timer
  ctx.font = `32px ${F_SPRAY}`;
  ctx.textAlign = 'center';
  ctx.fillStyle = game.roundTimer <= 10 ? P.ko : P.white;
  ctx.fillText(String(Math.ceil(game.roundTimer)).padStart(2, '0'), W/2, barY + 24);
  ctx.font = '10px monospace';
  ctx.fillStyle = '#666';
  ctx.fillText('TIME', W/2, barY + 2);
}

function drawTitle() {
  const t = game.frame;
  const flashOn = (t % 130) < 2;
  const ti = img('ui_title');
  if (img('ui_title_logo')) {
    drawStage();
    ctx.fillStyle = 'rgba(4,4,10,0.55)';
    ctx.fillRect(0, 0, W, H);
    drawImg('ui_title_logo', W / 2, 136, 205, { glow: '#FF2E63', blur: 26 + Math.sin(t * 0.05) * 10, scale: flashOn ? 1.03 : 1 });
  } else if (ti) {
    ctx.drawImage(ti, 0, 0, W, H);
    ctx.drawImage(titlePatch(), 330, 230);
  } else {
    drawStage();
    ctx.fillStyle = 'rgba(4,4,10,0.62)';
    ctx.fillRect(0, 0, W, H);

    // cat-skull watermark behind the logo
    const pulse = 1 + Math.sin(t * 0.03) * 0.05;
    ctx.save(); ctx.translate(W / 2, 140); ctx.scale(pulse, pulse);
    drawCatSkull(0, 0, 72, '#FF2E63', { alpha: 0.12, hole: 'rgba(20,4,10,0.6)', bones: false });
    ctx.restore();
    drawCrown(W / 2 + 262, 96, 20, '#FF2E63', 3);

    sprayText('CATFIGHTER', W / 2, 176, 98, flashOn ? '#FFFFFF' : '#FF2E63', { glow: 18 + Math.sin(t * 0.05) * 8, glowColor: '#FF2E63', seed: 3, outline: '#14060C' });

  }

  // sparks dropping from the right work light

// ═══════════════════════════════════════════════════════════════════
//  Game State Machine
// ═══════════════════════════════════════════════════════════════════

const game = {
  state: 'title',
  frame: 0,
  f1: null, f2: null,
  vsAI: true,
  modeSelect: 0,
  p1Select: 0, p2Select: 1,
  round: 1,
  roundTimer: ROUND_TIME,
  hitPause: 0,
  introTimer: 0,
  introText: '',
  matchWinner: 0,
  winStreak: 0,
  p1Confirmed: false, p2Confirmed: false,
  pauseMenu: 0,
  stage: 0, stageSelect: 0,
  roundWinner: 1, endReason: 'ko', perfect: false,
  controlsPlayer: 0,
  controlsAction: 0,
  controlsWaiting: false,
};

function confirm() {
  return wasPressed('Enter') || wasPressed('NumpadEnter') || touchJust.confirm;
}

function updateTitle() {
  if (confirm() || touch.any) {
    game.state = 'modeSelect';
    game.modeSelect = 0;
    SFX.select();
  }
}

function updateModeSelect() {
  if (wasPressed('KeyW') || wasPressed('ArrowUp') || wasPressed('KeyA') || wasPressed('ArrowLeft') || touchJust.up || touchJust.left) {
    game.modeSelect = 0; SFX.move();
  }
  if (wasPressed('KeyS') || wasPressed('ArrowDown') || wasPressed('KeyD') || wasPressed('ArrowRight') || touchJust.down || touchJust.right) {
    game.modeSelect = 1; SFX.move();
  }
  if (confirm()) {
    game.vsAI = game.modeSelect === 0;
    game.state = 'charSelect';
    game.p1Select = 0;
    game.p2Select = game.vsAI ? rndInt(0, 3) : 1;
    game.p1Confirmed = false;
    game.p2Confirmed = false;
    SFX.select();
  }
}

function updateCharSelect() {
  // P1 selection
  if (!game.p1Confirmed) {
    if (wasPressed('KeyA') || touchJust.left) {
      game.p1Select = (game.p1Select + 3) % 4;
      if (game.p1Select === game.p2Select) game.p1Select = (game.p1Select + 3) % 4;
      SFX.move();
    }
    if (wasPressed('KeyD') || touchJust.right) {
      game.p1Select = (game.p1Select + 1) % 4;
      if (game.p1Select === game.p2Select) game.p1Select = (game.p1Select + 1) % 4;
      SFX.move();
    }
  }

  // P2 selection (only in 2P mode)
  if (!game.vsAI && !game.p2Confirmed) {
    if (wasPressed('ArrowLeft')) {
      game.p2Select = (game.p2Select + 3) % 4;
      if (game.p2Select === game.p1Select) game.p2Select = (game.p2Select + 3) % 4;
      SFX.move();
    }
    if (wasPressed('ArrowRight')) {
      game.p2Select = (game.p2Select + 1) % 4;
      if (game.p2Select === game.p1Select) game.p2Select = (game.p2Select + 1) % 4;
      SFX.move();
    }
  }

  if (game.vsAI) {
    // in AI mode, P2 select is random but different from P1
    if (game.p2Select === game.p1Select) {
      game.p2Select = (game.p1Select + 1) % 4;
    }
  }

  if (confirm()) {
    game.state = 'stageSelect';
    SFX.select();
  }
}

function updateStageSelect() {
  if (wasPressed('KeyA') || wasPressed('ArrowLeft') || touchJust.left) {
    game.stageSelect = (game.stageSelect + STAGES.length - 1) % STAGES.length; SFX.move();
  }
  if (wasPressed('KeyD') || wasPressed('ArrowRight') || touchJust.right) {
    game.stageSelect = (game.stageSelect + 1) % STAGES.length; SFX.move();
  }
  if (wasPressed('Escape')) { game.state = 'charSelect'; SFX.move(); return; }
  if (confirm()) {
    game.stage = game.stageSelect;
    startMatch();
    SFX.select();
  }
}

function startMatch() {
  game.f1 = createFighter(BREED_KEYS[game.p1Select], 250, 1);
  game.f2 = createFighter(BREED_KEYS[game.p2Select], W - 250, -1);
  game.round = 1;
  game.f1.wins = 0;
  game.f2.wins = 0;
  startRound();
}

function startRound() {
  game.state = 'roundIntro';
  game.introTimer = 90;
  game.introText = `ROUND ${game.round}`;
  game.roundTimer = ROUND_TIME;
  game.hitPause = 0;

  // reset fighter positions and HP
  game.f1.x = 250; game.f1.y = GROUND_Y;
  game.f1.vx = 0; game.f1.vy = 0;
  game.f1.hp = game.f1.maxHp; game.f1.displayHp = game.f1.maxHp;
  game.f1.special = 0; game.f1.state = 'idle'; game.f1.stateFrame = 0;
  game.f1.grounded = true; game.f1.hitThisAtk = false;
  game.f1.hitstunTime = 0; game.f1.blockstunTime = 0;
  game.f1.invincible = 0; game.f1.flashTimer = 0;
  game.f1.specActive = false; game.f1.specData = null; game.f1.winPose = false;
  game.f1.facing = 1;

  game.f2.x = W - 250; game.f2.y = GROUND_Y;
  game.f2.vx = 0; game.f2.vy = 0;
  game.f2.hp = game.f2.maxHp; game.f2.displayHp = game.f2.maxHp;
  game.f2.special = 0; game.f2.state = 'idle'; game.f2.stateFrame = 0;
  game.f2.grounded = true; game.f2.hitThisAtk = false;
  game.f2.hitstunTime = 0; game.f2.blockstunTime = 0;
  game.f2.invincible = 0; game.f2.flashTimer = 0;
  game.f2.specActive = false; game.f2.specData = null; game.f2.winPose = false;
  game.f2.facing = -1;

  particles.length = 0;
  shakeAmt = 0;
  SFX.bell();
}

function updateRoundIntro() {
  game.introTimer--;
  if (game.introTimer === 30) {
    game.introText = 'FIGHT!';
  }
  if (game.introTimer <= 0) {
    game.state = 'fighting';
  }
}

function updateFighting() {
  if (wasPressed('Space') || wasPressed('Escape') || touchJust.pause) {
    game.state = 'paused';
    game.pauseMenu = 0;
    SFX.select();
    return;
  }

  // hit pause
  if (game.hitPause > 0) {
    game.hitPause--;
    return;
  }

  // timer
  game.roundTimer -= 1/60;
  if (game.roundTimer <= 0) {
    game.roundTimer = 0;
    endRound(game.f1.hp >= game.f2.hp ? 1 : 2, 'time');
    return;
  }

  // input
  const inp1 = p1Input();
  const inp2 = game.vsAI ? aiUpdate(game.f2, game.f1) : {
    left: P2.left(), right: P2.right(), up: P2.up(), down: P2.down(),
    light: P2.light(), heavy: P2.heavy(), special: P2.special(),
  };

  game.f1.currentInput = inp1;
  game.f2.currentInput = inp2;
  updateFighter(game.f1, inp1, game.f2);
  updateFighter(game.f2, inp2, game.f1);

  // push apart
  pushApart(game.f1, game.f2);

  // hit detection (both directions)
  checkHits(game.f1, game.f2);
  checkHits(game.f2, game.f1);

  // check KO
  if (game.f1.hp <= 0) endRound(2, 'ko');
  else if (game.f2.hp <= 0) endRound(1, 'ko');

  updateParticles();
}

function updatePaused() {
  const MENU_ITEMS = ['Resume', 'Configure Controls', 'Quit to Menu'];
  if (wasPressed('KeyW') || wasPressed('ArrowUp') || (touchJust.light && touch.up)) {
    game.pauseMenu = (game.pauseMenu + MENU_ITEMS.length - 1) % MENU_ITEMS.length;
    SFX.move();
  }
  if (wasPressed('KeyS') || wasPressed('ArrowDown') || (touchJust.light && touch.down)) {
    game.pauseMenu = (game.pauseMenu + 1) % MENU_ITEMS.length;
    SFX.move();
  }
  if (wasPressed('Space') || wasPressed('Escape') || touchJust.pause) {
    game.state = 'fighting';
    SFX.select();
    return;
  }
  if (confirm()) {
    if (game.pauseMenu === 0) {
      game.state = 'fighting';
      SFX.select();
    } else if (game.pauseMenu === 1) {
      game.state = 'controls';
      game.controlsPlayer = 0;
      game.controlsAction = 0;
      game.controlsWaiting = false;
      SFX.select();
    } else if (game.pauseMenu === 2) {
      game.state = 'title';
      particles.length = 0;
      shakeAmt = 0;
      SFX.select();
    }
  }
}

function updateControls() {
  if (game.controlsWaiting) {
    const k = lastKeyPressed();
    if (k && k !== 'Escape' && k !== 'Space') {
      const player = game.controlsPlayer === 0 ? 'p1' : 'p2';
      const action = ACTIONS[game.controlsAction];
      bindings[player][action] = k;
      saveBindings();
      game.controlsWaiting = false;
      SFX.select();
    }
    if (wasPressed('Escape')) {
      game.controlsWaiting = false;
      SFX.move();
    }
    return;
  }

  if (wasPressed('Escape') || wasPressed('Space') || touchJust.pause) {
    game.state = 'paused';
    SFX.move();
    return;
  }

  // navigate actions
  if (wasPressed('KeyW') || wasPressed('ArrowUp')) {
    game.controlsAction = (game.controlsAction + ACTIONS.length - 1) % ACTIONS.length;
    SFX.move();
  }
  if (wasPressed('KeyS') || wasPressed('ArrowDown')) {
    game.controlsAction = (game.controlsAction + 1) % ACTIONS.length;
    SFX.move();
  }
  // switch player tabs
  if (wasPressed('KeyA') || wasPressed('ArrowLeft')) {
    game.controlsPlayer = 0;
    SFX.move();
  }
  if (wasPressed('KeyD') || wasPressed('ArrowRight')) {
    game.controlsPlayer = 1;
    SFX.move();
  }
  // begin rebinding
  if (confirm()) {
    game.controlsWaiting = true;
    SFX.select();
  }
  // reset to defaults
  if (wasPressed('KeyR')) {
    bindings = JSON.parse(JSON.stringify(DEFAULT_BINDINGS));
    saveBindings();
    SFX.bell();
  }
}

function endRound(winner, reason) {
  game.state = 'roundEnd';
  game.introTimer = 150;
  game.roundWinner = winner;
  game.endReason = reason || 'ko';
  const wf = winner === 1 ? game.f1 : game.f2;
  game.perfect = wf.hp >= wf.maxHp;
  game.f1.flashTimer = 0; game.f2.flashTimer = 0;
  if (winner === 1) { game.f1.wins++; game.f1.winPose = true; game.introText = `${game.f1.breed.name} WINS!`; }
  else { game.f2.wins++; game.f2.winPose = true; game.introText = `${game.f2.breed.name} WINS!`; }
}

function updateRoundEnd() {
  game.introTimer--;
  updateParticles();

  // smooth HP display
  game.f1.displayHp = lerp(game.f1.displayHp, game.f1.hp, 0.12);
  game.f2.displayHp = lerp(game.f2.displayHp, game.f2.hp, 0.12);

  if (game.introTimer <= 0 || confirm()) {
    // check match winner
    if (game.f1.wins >= WINS_NEEDED) {
      game.state = 'matchEnd';
      game.matchWinner = 1;
      game.introTimer = 180;
      game.winStreak++;
      saveHighScore(game.winStreak);
      SFX.win();
    } else if (game.f2.wins >= WINS_NEEDED) {
      game.state = 'matchEnd';
      game.matchWinner = 2;
      game.introTimer = 180;
      game.winStreak = 0;
    } else {
      game.round++;
      startRound();
    }
  }
}

function updateMatchEnd() {
  game.introTimer--;
  updateParticles();

  // victory particles
  if (game.frame % 8 === 0) {
    const wx = game.matchWinner === 1 ? game.f1.x : game.f2.x;
    spawnParts(wx + rnd(-30, 30), GROUND_Y - rnd(20, 80), 3, P.gold, 3, 20, 3);
  }

  if ((game.introTimer <= 0 || confirm()) && game.introTimer < 150) {
    game.state = 'charSelect';
    game.p1Confirmed = false;
    game.p2Confirmed = false;
    particles.length = 0;
    SFX.select();
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Draw Overlays
// ═══════════════════════════════════════════════════════════════════

function drawRoundIntro() {
  ctx.fillStyle = 'rgba(10,10,20,0.4)';
  ctx.fillRect(0, 0, W, H);

  const st = STAGES[game.stage];
  if (game.introText === 'FIGHT!') {
    const scale = 1 + (30 - Math.max(game.introTimer, 0)) * 0.025;
    if (!drawImg('ban_fight', W/2, H/2 - 10, 130, { scale, glow: P.ko, blur: 30, dx: (Math.random() - 0.5) * 3, dy: (Math.random() - 0.5) * 3 })) {
      ctx.save();
      ctx.translate(W/2, H/2);
      ctx.scale(scale, scale);
      sprayText('FIGHT!', 0, 0, 96, P.ko, { glow: 30, seed: 14, jitter: 3, outline: '#14040A' });
      ctx.restore();
    }
  } else {
    scratchText(st.name, W/2, H/2 - 84, 22, st.accent, { underline: true });
    const pop = 1 + Math.max(0, game.introTimer - 78) * 0.04;
    if (!drawImg('ban_round_' + game.round, W/2, H/2 - 10, 104, { scale: pop, glow: P.p1, blur: 22 })) {
      sprayText(game.introText, W/2, H/2 + 4, 84, P.gold, { glow: 16, seed: 15, outline: '#141004' });
    }
  }
}

function drawRoundEnd() {
  ctx.fillStyle = 'rgba(4,4,10,0.45)';
  ctx.fillRect(0, 0, W, H);
  const wf = game.roundWinner === 1 ? game.f1 : game.f2;
  const col = game.roundWinner === 1 ? P.p1 : P.p2;
  const t = 150 - game.introTimer;
  drawImg(game.roundWinner === 1 ? 'ui_crown_p1' : 'ui_crown_p2', wf.x, wf.y - wf.breed.spriteH - 26 + Math.sin(game.frame * 0.12) * 4, 34, { glow: col, blur: 12 });
  if (t < 55) {
    const sc = 1 + Math.max(0, 10 - t) * 0.08;
    const key = game.endReason === 'time' ? 'ban_time_up' : 'ban_ko';
    if (!drawImg(key, W/2, H/2 - 30, 116, { scale: sc, glow: P.ko, blur: 30 })) {
      sprayText(game.endReason === 'time' ? 'TIME UP' : 'K.O.', W/2, H/2 - 20, 80, P.ko, { glow: 20, seed: 23, outline: '#14040A' });
    }
    return;
  }
  const hasHead = drawImg('head_' + wf.breed.key, W/2 - 200, H/2 - 30, 130, { rot: -0.05 });
  const tx = hasHead ? W/2 + 40 : W/2;
  sprayText(wf.breed.name, tx, H/2 - 48, 56, col, { glow: 16, seed: 16, outline: '#0A0608' });
  if (!drawImg('ban_wins', tx, H/2 + 4, 74, { glow: P.gold, blur: 16 })) sprayText('WINS!', tx, H/2 + 20, 56, P.gold, { glow: 14, seed: 24, outline: '#141004' });
  if (game.perfect) drawImg('ban_perfect', tx, H/2 + 62, 52, { glow: P.p2, blur: 14, rot: -0.04 });
  scratchText(`${game.f1.breed.name}  ${game.f1.wins} - ${game.f2.wins}  ${game.f2.breed.name}`, W/2, H/2 + 108, 18, '#C8C8C8');
}

function drawMatchEnd() {
  ctx.fillStyle = 'rgba(10,10,20,0.5)';
  ctx.fillRect(0, 0, W, H);

  const winner = game.matchWinner === 1 ? game.f1 : game.f2;
  const col = game.matchWinner === 1 ? P.p1 : P.p2;

  const hasHead = drawImg('head_' + winner.breed.key, W/2 - 220, H/2 - 40, 170, { rot: -0.06, glow: col, blur: 20 });
  const tx = hasHead ? W/2 + 50 : W/2;
  drawImg(game.matchWinner === 1 ? 'ui_crown_p1' : 'ui_crown_p2', tx, H/2 - 118, 40, { glow: col, blur: 14 });
  sprayText(winner.breed.name, tx, H/2 - 56, 74, col, { glow: 22, seed: 17, outline: '#0A0608' });
  if (!drawImg('ban_wins', tx, H/2 + 4, 80, { glow: P.gold, blur: 16 })) sprayText('WINS', tx, H/2 + 10, 56, P.gold, { glow: 14, seed: 24, outline: '#141004' });
  scratchText('THE MATCH', tx, H/2 + 56, 22, '#E0E0E0');
  scratchText(`Final Score  ${game.f1.wins} - ${game.f2.wins}`, tx, H/2 + 82, 16, '#C8C8C8');
  if (game.vsAI && game.matchWinner === 1) {
    scratchText(`Win Streak: ${game.winStreak}`, tx, H/2 + 104, 16, P.gold);
  }
  if (game.introTimer < 140 && Math.floor(game.frame / 25) % 2 === 0) {
    if (!drawImg('ban_press_enter', W/2, H - 44, 44, { dx: (Math.random() - 0.5) * 3 })) sprayText('PRESS ENTER', W/2, H/2 + 104, 26, '#F4F4F4', { jitter: 2, seed: 19, drips: false, outline: '#0A0608' });
  }
}

function drawPaused() {
  ctx.fillStyle = 'rgba(10,10,20,0.65)';
  ctx.fillRect(0, 0, W, H);

  if (!drawImg('ui_paused', W/2, 158, 96, { glow: P.p1, blur: 24 })) sprayText('PAUSED', W/2, 168, 60, P.gold, { glow: 14, seed: 21, outline: '#141004' });

  const items = ['Resume', 'Configure Controls', 'Quit to Menu'];
  const keys = ['menu_resume', 'menu_controls', 'menu_quit'];
  ctx.font = 'bold 22px monospace';
  for (let i = 0; i < items.length; i++) {
    const y = 250 + i * 64;
    const sel = i === game.pauseMenu;
    if (drawImg('ui_' + keys[i] + (sel ? '_sel' : ''), W/2, y, 54, { alpha: sel ? 1 : 0.8, glow: sel ? P.p1 : null, blur: 14, scale: sel ? 1.05 : 1 })) continue;
    if (sel) {
      roundRect(ctx, W/2 - 180, y - 18, 360, 40, 8);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fill();
      ctx.fillStyle = P.gold;
      ctx.fillText('▸ ' + items[i], W/2, y + 6);
    } else {
      ctx.fillStyle = '#888';
      ctx.fillText(items[i], W/2, y + 6);
    }
  }

  ctx.font = '14px monospace';
  ctx.fillStyle = '#555';
  ctx.fillText('SPACE / ESC to resume', W/2, H - 40);
}

function drawControls() {
  ctx.fillStyle = 'rgba(10,10,20,0.8)';
  ctx.fillRect(0, 0, W, H);

  if (!drawImg('ui_header_controls', W/2, 48, 62, { glow: P.p2, blur: 14 })) sprayText('CONFIGURE CONTROLS', W/2, 64, 38, P.gold, { glow: 10, seed: 22, drips: false, outline: '#141004' });

  // player tabs
  const tabW = 160, tabH = 36, tabY = 85;
  for (let p = 0; p < 2; p++) {
    const tx = W/2 + (p === 0 ? -tabW - 8 : 8);
    const sel = p === game.controlsPlayer;
    if (drawImg(p === 0 ? 'ui_tab_p1' : 'ui_tab_p2', tx + tabW/2, tabY + tabH/2, 44, { alpha: sel ? 1 : 0.45, glow: sel ? (p === 0 ? P.p1 : P.p2) : null, blur: 12 })) continue;
    roundRect(ctx, tx, tabY, tabW, tabH, 6);
    ctx.fillStyle = sel ? (p === 0 ? P.p1 : P.p2) : '#222';
    ctx.fill();
    ctx.font = 'bold 16px monospace';
    ctx.fillStyle = sel ? '#fff' : '#666';
    ctx.fillText(p === 0 ? 'PLAYER 1' : 'PLAYER 2', tx + tabW/2, tabY + tabH/2 + 5);
  }

  // action list
  const player = game.controlsPlayer === 0 ? 'p1' : 'p2';
  ctx.textAlign = 'left';
  const startY = 155;
  for (let i = 0; i < ACTIONS.length; i++) {
    const y = startY + i * 42;
    const sel = i === game.controlsAction;
    const waiting = sel && game.controlsWaiting;

    if (sel) {
      roundRect(ctx, W/2 - 240, y - 4, 480, 34, 6);
      ctx.fillStyle = waiting ? 'rgba(255,200,50,0.12)' : 'rgba(255,255,255,0.06)';
      ctx.fill();
    }

    ctx.font = sel ? 'bold 18px monospace' : '18px monospace';
    ctx.fillStyle = sel ? P.gold : '#aaa';
    ctx.fillText(ACTION_LABELS[ACTIONS[i]], W/2 - 220, y + 18);

    ctx.textAlign = 'right';
    if (waiting) {
      const blink = Math.floor(game.frame / 15) % 2 === 0;
      if (!drawImg('ui_press_a_key', W/2 + 150, y + 13, 30, { alpha: blink ? 1 : 0.6 })) {
        ctx.fillStyle = blink ? P.ko : P.gold;
        ctx.fillText('Press a key...', W/2 + 220, y + 18);
      }
    } else {
      ctx.fillStyle = sel ? '#fff' : '#888';
      ctx.fillText(keyName(bindings[player][ACTIONS[i]]), W/2 + 220, y + 18);
    }
    ctx.textAlign = 'left';
  }

  // footer hints
  ctx.textAlign = 'center';
  ctx.font = '13px monospace';
  ctx.fillStyle = '#555';
  ctx.fillText('↑↓ select  ←→ switch player  ENTER rebind  R reset defaults  ESC back', W/2, H - 40);
}

// ═══════════════════════════════════════════════════════════════════
//  High Score
// ═══════════════════════════════════════════════════════════════════

function loadHighScore() {
  try { return parseInt(localStorage.getItem('catfighter_hs')) || 0; } catch(e) { return 0; }
}
function saveHighScore(streak) {
  try {
    const cur = loadHighScore();
    if (streak > cur) localStorage.setItem('catfighter_hs', streak);
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════════════════
//  Main Loop (fixed timestep)
// ═══════════════════════════════════════════════════════════════════

let lastTime = 0;
let accumulator = 0;

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  if (lastTime === 0) { lastTime = timestamp; return; }
  const delta = Math.min(timestamp - lastTime, 100);
  lastTime = timestamp;
  accumulator += delta;

  while (accumulator >= TIMESTEP) {
    accumulator -= TIMESTEP;
    game.frame++;
    tick();
    clearJustPressed();
    for (const k in touchJust) touchJust[k] = false;
  }

  render();
}

function tick() {
  switch (game.state) {
    case 'title': updateTitle(); break;
    case 'modeSelect': updateModeSelect(); break;
    case 'charSelect': updateCharSelect(); break;
    case 'stageSelect': updateStageSelect(); break;
    case 'roundIntro': updateRoundIntro(); break;
    case 'fighting': updateFighting(); break;
    case 'paused': updatePaused(); break;
    case 'controls': updateControls(); break;
    case 'roundEnd': updateRoundEnd(); break;
    case 'matchEnd': updateMatchEnd(); break;
  }
}

function render() {
  ctx.save();

  // screen shake
  const shake = getShake();
  ctx.translate(shake.x, shake.y);

  switch (game.state) {
    case 'title':
      drawTitle();
      break;
    case 'modeSelect':
      drawModeSelect();
      break;
    case 'charSelect':
      drawCharSelect();
      break;
    case 'stageSelect':
      drawStageSelect();
      break;
    case 'roundIntro':
      drawStage();
      drawCat(game.f1);
      drawCat(game.f2);
      drawHUD();
      drawRoundIntro();
      break;
    case 'fighting':
      drawStage();
      drawCat(game.f1);
      drawCat(game.f2);
      drawParticles();
      drawHitFx();
      drawHUD();
      break;
    case 'paused':
      drawStage();
      drawCat(game.f1);
      drawCat(game.f2);
      drawHUD();
      drawPaused();
      break;
    case 'controls':
      drawStage();
      drawCat(game.f1);
      drawCat(game.f2);
      drawHUD();
      drawControls();
      break;
    case 'roundEnd':
      drawStage();
      drawCat(game.f1);
      drawCat(game.f2);
      drawParticles();
      drawHitFx();
      drawHUD();
      drawRoundEnd();
      break;
    case 'matchEnd':
      drawStage();
      drawCat(game.f1);
      drawCat(game.f2);
      drawParticles();
      drawHitFx();
      drawHUD();
      drawMatchEnd();
      break;
  }

  ctx.restore();
  drawTouchUI();
}

// ═══════════════════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════════════════

canvas.addEventListener('click', () => ensureAudio());
requestAnimationFrame(gameLoop);

</script>
