function drawRoundIntro() {
  ctx.fillStyle = 'rgba(10,10,20,0.4)';
  ctx.fillRect(0, 0, W, H);

  if (game.introText === 'FIGHT!') {
    const scale = 1 + (30 - Math.max(game.introTimer, 0)) * 0.025;
    drawImg('ban_fight', W/2, H/2 - 10, 130, { scale, glow: P.ko, blur: 30, dx: (Math.random() - 0.5) * 3, dy: (Math.random() - 0.5) * 3 });
  } else {
    drawImg('ui_stage_' + STAGES[game.stage].id, W/2, H/2 - 92, 48);
    const pop = 1 + Math.max(0, game.introTimer - 78) * 0.04;
    drawImg('ban_round_' + game.round, W/2, H/2 - 10, 104, { scale: pop, glow: P.p1, blur: 22 });
    if (game.vsAI) scratchText('CPU LEVEL ' + game.cpu.level + (game.cpu.level >= CPU_MAX_LEVEL ? ' · MAX' : ''), W/2, H/2 + 74, 16, P.p2);
  }
}

function drawRoundEnd() {
  ctx.fillStyle = 'rgba(4,4,10,0.45)';
  ctx.fillRect(0, 0, W, H);
  const wf = game.roundWinner === 1 ? game.f1 : game.f2;
  const col = game.roundWinner === 1 ? P.p1 : P.p2;
  const t = 150 - game.introTimer;
  drawImg(game.roundWinner === 1 ? 'ui_crown_p1' : 'ui_crown_p2', wf.x, wf.y - wf.breed.spriteH - 26 + Math.sin(game.frame * 0.12) * 4, 34, { glow: col, blur: 12 });
  if (t < 55) {
    const sc = 1 + Math.max(0, 10 - t) * 0.08;
    drawImg(game.endReason === 'time' ? 'ban_time_up' : 'ban_ko', W/2, H/2 - 30, 116, { scale: sc, glow: P.ko, blur: 30 });
    return;
  }
  const tx = W/2 + 40;
  drawImg('head_' + wf.breed.key, W/2 - 200, H/2 - 30, 130, { rot: -0.05 });
  sprayText(wf.breed.name, tx, H/2 - 48, 56, col, { glow: 16, seed: 16, outline: '#0A0608' });
  drawImg('ban_wins', tx, H/2 + 4, 74, { glow: P.gold, blur: 16 });
  if (game.perfect) drawImg('ban_perfect', tx, H/2 + 62, 52, { glow: P.p2, blur: 14, rot: -0.04 });
  scratchText(`${game.f1.breed.name}  ${game.f1.wins} - ${game.f2.wins}  ${game.f2.breed.name}`, W/2, H/2 + 108, 18, '#C8C8C8');
}

function drawMatchEnd() {
  ctx.fillStyle = 'rgba(10,10,20,0.5)';
  ctx.fillRect(0, 0, W, H);

  const winner = game.matchWinner === 1 ? game.f1 : game.f2;
  const col = game.matchWinner === 1 ? P.p1 : P.p2;
  const tx = W/2 + 50;

  drawImg('head_' + winner.breed.key, W/2 - 220, H/2 - 40, 170, { rot: -0.06, glow: col, blur: 20 });
  drawImg(game.matchWinner === 1 ? 'ui_crown_p1' : 'ui_crown_p2', tx, H/2 - 118, 40, { glow: col, blur: 14 });
  sprayText(winner.breed.name, tx, H/2 - 56, 74, col, { glow: 22, seed: 17, outline: '#0A0608' });
  drawImg('ban_wins', tx, H/2 + 4, 80, { glow: P.gold, blur: 16 });
  drawImg('ban_the_match', tx, H/2 + 58, 40);
  drawImg('ban_final_score', tx - 60, H/2 + 100, 34);
  drawDigits(game.f1.wins, tx + 42, H/2 + 100, 26, 2); scratchText('-', tx + 62, H/2 + 108, 20, '#C8C8C8'); drawDigits(game.f2.wins, tx + 82, H/2 + 100, 26, 2);
  if (game.vsAI && game.matchWinner === 1) {
    drawImg('ban_win_streak', tx - 50, H/2 + 138, 34);
    drawDigits(game.winStreak, tx + 60, H/2 + 138, 26, 2);
  }
  if (game.vsAI) scratchText('NEXT FIGHT: CPU LEVEL ' + cpuLevel(), tx, H/2 + (game.matchWinner === 1 ? 174 : 142), 14, P.p2);
  if (game.introTimer < 120 && Math.floor(game.frame / 25) % 2 === 0) {
    drawImg('ban_press_enter', W/2, H - 44, 44, { dx: (Math.random() - 0.5) * 3 });
  }
}

function drawPaused() {
  ctx.fillStyle = 'rgba(10,10,20,0.65)';
  ctx.fillRect(0, 0, W, H);

  drawImg('ui_paused', W/2, 158, 96, { glow: P.p1, blur: 24 });

  const keys = ['menu_resume', 'menu_controls', 'menu_quit'];
  for (let i = 0; i < keys.length; i++) {
    const sel = i === game.pauseMenu;
    drawImg('ui_' + keys[i] + (sel ? '_sel' : ''), W/2, 250 + i * 64, 54, { alpha: sel ? 1 : 0.8, glow: sel ? P.p1 : null, blur: 14, scale: sel ? 1.05 : 1 });
  }

  scratchText(muted ? 'SOUND: OFF' : 'SOUND: ON', W/2, H - 62, 16, muted ? '#888' : P.p2);
  ctx.font = '13px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#777';
  ctx.fillText(touchActive ? 'tap II to resume  ·  tap SOUND to toggle' : 'SPACE / ESC to resume  ·  M toggles sound', W/2, H - 38);
}

function drawControls() {
  ctx.fillStyle = 'rgba(10,10,20,0.8)';
  ctx.fillRect(0, 0, W, H);

  drawImg('ui_header_controls', W/2, 48, 62, { glow: P.p2, blur: 14 });

  // player tabs
  const tabW = 160, tabH = 36, tabY = 85;
  for (let p = 0; p < 2; p++) {
    const tx = W/2 + (p === 0 ? -tabW - 8 : 8);
    const sel = p === game.controlsPlayer;
    drawImg(p === 0 ? 'ui_tab_p1' : 'ui_tab_p2', tx + tabW/2, tabY + tabH/2, 44, { alpha: sel ? 1 : 0.45, glow: sel ? (p === 0 ? P.p1 : P.p2) : null, blur: 12 });
  }

  // action list
  const player = game.controlsPlayer === 0 ? 'p1' : 'p2';
  ctx.textAlign = 'left';
  const startY = 155;
  for (let i = 0; i < ACTIONS.length; i++) {
    const y = startY + i * 38;
    const sel = i === game.controlsAction;
    const waiting = sel && game.controlsWaiting;

    if (sel) {
      ctx.fillStyle = waiting ? 'rgba(255,200,50,0.12)' : 'rgba(255,255,255,0.06)';
      roundRect(ctx, W/2 - 240, y - 4, 480, 32, 6);
    }

    ctx.font = sel ? 'bold 18px monospace' : '18px monospace';
    ctx.fillStyle = sel ? P.gold : '#aaa';
    ctx.fillText(ACTION_LABELS[ACTIONS[i]], W/2 - 220, y + 18);

    ctx.textAlign = 'right';
    if (waiting) {
      const blink = Math.floor(game.frame / 15) % 2 === 0;
      drawImg('ui_press_a_key', W/2 + 150, y + 13, 30, { alpha: blink ? 1 : 0.6 });
    } else {
      ctx.fillStyle = sel ? '#fff' : '#888';
      ctx.fillText(keyName(bindings[player][ACTIONS[i]]), W/2 + 220, y + 18);
    }
    ctx.textAlign = 'left';
  }

  // footer hints
  ctx.textAlign = 'center';
  ctx.font = '13px monospace';
  ctx.fillStyle = '#555';
  ctx.fillText(touchActive ? 'key bindings need a keyboard  ·  tap anywhere to go back' : '↑↓ select  ←→ switch player  ENTER rebind  R reset defaults  ESC back', W/2, H - 40);
}

// ═══════════════════════════════════════════════════════════════════
//  High Score
// ═══════════════════════════════════════════════════════════════════

function loadHighScore() {
  try { return parseInt(localStorage.getItem('catfighter_hs')) || 0; } catch(e) { return 0; }
}
function saveHighScore(streak) {
  try {
    const cur = loadHighScore();
    if (streak > cur) localStorage.setItem('catfighter_hs', streak);
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════════════════
//  Main Loop (fixed timestep)
// ═══════════════════════════════════════════════════════════════════

let lastTime = 0;
let accumulator = 0;

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  if (lastTime === 0) { lastTime = timestamp; return; }
  const delta = Math.min(timestamp - lastTime, 100);
  lastTime = timestamp;
  accumulator += delta;

  while (accumulator >= TIMESTEP) {
    accumulator -= TIMESTEP;
    game.frame++;
    tick();
    clearJustPressed();
    for (const k in touchJust) touchJust[k] = false;
    tapPos = null;
  }

  render();
}

function tick() {
  switch (game.state) {
    case 'loading': updateLoading(); break;
    case 'loadError': updateLoadError(); break;
    case 'title': updateTitle(); break;
    case 'modeSelect': updateModeSelect(); break;
    case 'charSelect': updateCharSelect(); break;
    case 'stageSelect': updateStageSelect(); break;
    case 'roundIntro': updateRoundIntro(); break;
    case 'fighting': updateFighting(); break;
    case 'paused': updatePaused(); break;
    case 'controls': updateControls(); break;
    case 'roundEnd': updateRoundEnd(); break;
    case 'matchEnd': updateMatchEnd(); break;
  }
}

// the fighter in mid-attack is drawn in front
function drawFighters() {
  const attacking = f => f.state === 'light' || f.state === 'heavy' || f.state === 'special';
  if (attacking(game.f1) && !attacking(game.f2)) { drawCat(game.f2); drawCat(game.f1); }
  else { drawCat(game.f1); drawCat(game.f2); }
  drawGuard(game.f1); drawGuard(game.f2);
}

// guard meter over a fighter's head, shown only while the guard is worn down
function drawGuard(f) {
  if (f.guard >= GUARD_MAX || f.state === 'ko') return;
  const k = f.guard / GUARD_MAX, w = 88, x = f.x - w / 2, y = f.y - f.breed.spriteH - 14;
  const broken = f.state === 'dizzy';
  ctx.fillStyle = 'rgba(8,4,12,0.85)'; ctx.fillRect(x - 2, y - 2, w + 4, 12);
  if (broken) { if (game.frame % 10 < 5) { ctx.fillStyle = P.ko; ctx.fillRect(x, y, w, 8); } }
  else { ctx.fillStyle = k < 0.3 ? P.ko : k < 0.6 ? P.gold : P.p2; ctx.fillRect(x, y, w * k, 8); }
  tagText(broken ? 'BROKEN' : 'GUARD', f.x, y - 5, 12, broken ? P.ko : '#E8E8F0');
}

function drawLoading() {
  ctx.fillStyle = '#08060C';
  ctx.fillRect(0, 0, W, H);
  sprayText('CATFIGHTER', W / 2, H / 2 - 10, 72, P.p1, { seed: 3, outline: '#14060C', drips: false });
  if (game.state === 'loadError') {
    const n = loadState.failed.length;
    scratchText(n ? `COULDN'T LOAD ${n} OF ${loadState.total} FILES` : 'THE DOWNLOAD STALLED', W / 2, H / 2 + 44, 18, P.ko);
    scratchText('CHECK YOUR CONNECTION, THEN TAP OR PRESS ENTER TO TRY AGAIN', W / 2, H / 2 + 72, 13, '#AAA');
    return;
  }
  const k = loadState.total ? loadState.done / loadState.total : 0;
  ctx.fillStyle = '#241828'; ctx.fillRect(W / 2 - 160, H / 2 + 30, 320, 8);
  ctx.fillStyle = P.p2; ctx.fillRect(W / 2 - 160, H / 2 + 30, 320 * k, 8);
  scratchText('LOADING', W / 2, H / 2 + 66, 14, '#888');
}

function render() {
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.save();

  // screen shake
  const shake = getShake();
  ctx.translate(shake.x, shake.y);

  switch (game.state) {
    case 'loading':
    case 'loadError':
      drawLoading();
      break;
    case 'title':
      drawTitle();
      break;
    case 'modeSelect':
      drawModeSelect();
      break;
    case 'charSelect':
      drawCharSelect();
      break;
    case 'stageSelect':
      drawStageSelect();
      break;
    case 'roundIntro':
      drawStage();
      drawFighters();
      drawHUD();
      drawRoundIntro();
      break;
    case 'fighting':
      drawStage();
      drawFighters();
      drawParticles();
      drawHitFx();
      drawHUD();
      break;
    case 'paused':
      drawStage();
      drawFighters();
      drawHUD();
      drawPaused();
      break;
    case 'controls':
      drawStage();
      drawFighters();
      drawHUD();
      drawControls();
      break;
    case 'roundEnd':
      drawStage();
      drawFighters();
      drawParticles();
      drawHitFx();
      drawHUD();
      drawRoundEnd();
      break;
    case 'matchEnd':
      drawStage();
      drawFighters();
      drawParticles();
      drawHitFx();
      drawHUD();
      drawMatchEnd();
      break;
  }

  ctx.restore();
  drawTouchUI();
}

// ═══════════════════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════════════════

requestAnimationFrame(gameLoop);

</script>
